domain: D3
items:
  # ---------------------------------------------------------------- comms.tradeoffs
  - id: D3-001
    version: 1
    type: single
    subtopic: comms.tradeoffs
    tags: [discovery.environment]
    competencies: [x.written-comms]
    difficulty: 1
    level: apply
    time_s: 60
    stem: |
      A pilot will miss its launch date by three weeks because the customer's data-access approval is still pending.
      You are writing the first paragraph of an update to the customer's COO, who reads on a phone between meetings.
      Which opening is best?
    options:
      - text: "Launch moves from 3 November to 24 November. To hold that date, we need your approval of read access to the claims warehouse by Friday."
        correct: true
        why: "Leads with the decision-relevant fact and the specific ask, which is what a busy executive needs from the first lines."
      - text: "The access request went in on 2 September, the VPN change took until 30 September and the security questionnaire is still open, which together move launch from 3 November to 24 November."
        why: "Accurate and complete but chronological. The reader has to work through the history to reach the consequence, and the ask for approval is missing."
        misconception: "Explaining the sequence of events builds credibility"
      - text: "The build is tracking well and testing is on schedule; the one item to flag is data access, which could move the 3 November launch by around three weeks if approval is not completed."
        why: "Buries a three-week slip under reassurance and hedges it as a possibility, which will damage trust when the date moves."
        misconception: "Soften bad news by leading with positives"
      - text: "I want to apologise for the delay to the 3 November launch and assure you of our full commitment to making it a success; the new date and what we need from you follow below."
        why: "Expresses goodwill but the executive still does not know the new date or what is needed from them in the part they will read."
        misconception: "Acknowledging feelings must come before the facts"
    explanation: |
      For executives, lead with the bottom line: the decision, the impact, and the ask. Background goes underneath for those
      who want it. This is the Pyramid Principle, sometimes called BLUF (bottom line up front).

  - id: D3-002
    version: 1
    type: single
    subtopic: comms.tradeoffs
    tags: [llm.failure-modes, eval.gates]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 90
    stem: |
      A customer's head of compliance asks about a policy-question assistant: "Will it ever give a wrong answer? We
      need it to be right every time." Pilot testing shows it answers about 94% of test policy questions correctly. Which
      response is most useful to her decision?
    options:
      - text: "Give the measured rate and the kinds of errors found, then show how a review step catches the costly ones"
        correct: true
        why: "Gives her a calibrated picture, with evidence and controls she can take to her own risk process."
      - text: "Say the goal is full correctness, restrict answers to quoted passages, and commit to correcting any wrong answer within a day"
        why: "Restricting to quotes reduces errors but does not guarantee them, and an unmet promise to a compliance head is costly."
        misconception: "Prompting and guardrails can make a model deterministic"
      - text: "Explain that outputs are sampled from a probability distribution and that lowering temperature reduces variation, so she can judge the residual risk"
        why: "Technically sound but not decision-relevant; it explains mechanism instead of telling her how often, how badly, and with what safeguards."
        misconception: "Explaining the mechanism is what makes uncertainty understandable"
      - text: "Say that 94% is above what human reviewers typically achieve on policy questions, so the risk is already lower than today's"
        why: "A fair comparison needs a measured human baseline. Asserting parity or better without data dismisses her concern."
        misconception: "Humans are imperfect, so the AI's imperfection needs no further treatment"
      - text: "Add a notice to every answer saying it may contain mistakes and must be checked, and present the notice as the control"
        why: "A disclaimer shifts the checking to the reader without measuring or reducing the errors. She cannot take it to a risk process as evidence."
        misconception: "A warning label is a control"
    explanation: |
      Communicate probabilistic behaviour with measured rates, the kinds of errors, and the controls around them. Neither
      promising perfection nor lecturing on sampling gives a risk owner what she needs.

  - id: D3-003
    version: 1
    type: multi
    subtopic: comms.tradeoffs
    tags: [llm.model-selection, deploy.models-network]
    competencies: [x.written-comms]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      An FDE must record the choice between a hosted frontier-model API and a self-hosted open-weights model for a
      customer's contract-review tool. The record is for future engineers and the customer's architecture board. Which
      content belongs in it?
    options:
      - text: "The options considered, including the rejected one, with costs, risks and the evidence behind them"
        correct: true
        why: "Readers need to see what was weighed, or the decision cannot be reviewed or reversed intelligently."
      - text: "The criteria and constraints that drove the choice, such as data residency and expected volume"
        correct: true
        why: "Lets a later reader tell whether the decision still holds when a constraint changes."
      - text: "The conditions that would make the team revisit the choice, such as a price change or a quality regression"
        correct: true
        why: "Decisions age; naming triggers turns the record into a living control."
      - text: "Transcripts of every prompt variant tried during the evaluation, kept so that nothing is lost"
        why: "Belongs, if anywhere, in an appendix or repository. In the record it buries the argument."
        misconception: "More detail makes a decision record more rigorous"
      - text: "A sprint-level implementation plan for building the chosen option, so the board sees it is deliverable"
        why: "A plan is a separate document with a different audience and lifespan. In the record it dilutes the reasoning and dates quickly."
        misconception: "A decision record should also say how the work will be done"
      - text: "The vendors' published benchmark results as the primary evidence for the quality comparison"
        why: "Generic benchmarks do not show how either option performs on this customer's contracts."
        misconception: "Public benchmarks substitute for customer-specific evaluation"
    explanation: |
      A decision record states the options, the criteria, the decision and its trade-offs, and the conditions for
      revisiting it. It is a short argument, not an archive.

  - id: D3-004
    version: 1
    type: single
    subtopic: comms.tradeoffs
    tags: [eval.methods]
    competencies: [x.written-comms]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A customer's architecture review board, all senior engineers, is sceptical about using an LLM to extract fields in
      a payments flow. You have twenty minutes. Which way of presenting is most likely to earn their confidence?
    options:
      - text: "Start with failure modes and error rates measured on their own documents, the controls around them, and the limits of the claims"
        correct: true
        why: "Engineers test claims; showing measured limits on their data invites scrutiny and builds trust."
      - text: "Walk through the architecture and security design in detail first, so the board can see that the system is soundly engineered before any results"
        why: "Engineers will want the design, but design quality does not answer their doubt, which is whether the model is reliable enough for payments."
        misconception: "A sound architecture is what makes a probabilistic component trustworthy"
      - text: "Open with the business case and projected savings, so that the board understands why the payments flow is worth taking some risk on"
        why: "That framing suits executives. This audience will read it as avoiding the technical questions."
        misconception: "One message works for every audience"
      - text: "Present reference deployments at two other payment processors and the results they reported after go-live"
        why: "Social proof from other environments does not answer how it behaves on this board's documents, and engineers discount it."
        misconception: "Other customers' success answers this customer's reliability question"
    explanation: |
      For technical reviewers, lead with evidence and limits: measured behaviour, failure modes, controls. Depth and
      candour about weaknesses do more for credibility than breadth or polish.

  - id: D3-005
    version: 2
    type: single
    subtopic: comms.tradeoffs
    tags: [eval.gates, delivery.go-live]
    competencies: [x.written-comms]
    difficulty: 3
    level: analyze
    time_s: 100
    stem: |
      A pilot's evaluation shows 87% field-level accuracy against an agreed 95% target. Most remaining errors come
      from low-quality scans, which an image-quality check at intake flags reliably; on the other documents, accuracy
      is 96%. The sponsor, under pressure from her own boss, wants to go live next week. How should the FDE
      communicate this?
    options:
      - text: "Report 87% against the agreed 95% and its cause, and recommend launching next week on clean scans only, keeping flagged ones manual"
        correct: true
        why: "Honest about the miss, and the recommended scope meets the agreed bar on the documents it covers, so she can keep her date without lowering the standard. The scope change is still hers to approve."
      - text: "Open with the improvement since the last evaluation, 71% to 87%, then state the gap to 95% and how it could be closed"
        why: "The trend is true and worth including, but leading with it softens the miss, and without a recommendation she cannot brief her boss."
        misconception: "Lead with progress to keep momentum"
      - text: "Present the shortfall and the possible paths, then ask the sponsor to choose between them, since the launch decision is hers to make"
        why: "The decision is hers but she needs a recommendation. Handing back options leaves her to decide on technical grounds."
        misconception: "Neutrality is the safest stance for an advisor"
      - text: "Keep the launch date unchanged while the team works to close the gap, and report the result once 95% is reached"
        why: "Surprises the sponsor if the date slips and leaves her unable to manage her own boss."
        misconception: "Do not raise a problem until it is fixed"
    explanation: |
      Communicating a miss means stating the measured result against the agreed bar, explaining the cause, and
      recommending a course. A limited launch is an honest recommendation when the restricted scope meets the agreed
      bar and the excluded cases can be identified reliably, as here; otherwise the honest recommendation is a later
      date or explicitly revised acceptance criteria. Softening, withholding and neutrality each fail the sponsor in a
      different way.

  - id: D3-006
    version: 1
    type: single
    subtopic: comms.tradeoffs
    tags: [llm.model-selection, obs.cost]
    competencies: [x.written-comms]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      A smaller model costs 60% less per case but gets about four more cases wrong per hundred. The business-unit head
      who sponsors the project must choose between the two. How should the FDE frame the choice?
    options:
      - text: "Put the gap in business terms: extra corrections per thousand cases, their cost, against the saving, and recommend one"
        correct: true
        why: "Translates the technical difference into units the sponsor can weigh, and offers a view."
      - text: "Show cost per case and error rate for both models side by side and let the sponsor pick, since that keeps engineering neutral"
        why: "Gives her the numbers but not what four extra errors per hundred cost her operation, so she must do the conversion and has no recommendation."
        misconception: "Presenting raw metrics is neutral and therefore sufficient"
      - text: "Recommend the larger model, since a quality loss that users can see will cost more credibility than any saving it brings"
        why: "May be right, but stated as an assertion. Without numbers, the sponsor cannot test it against her own priorities."
        misconception: "Quality always beats cost"
      - text: "Recommend the smaller model, since a 60% cost cut is large and the existing review step will catch most of the extra errors"
        why: "May also be right, but it relies on an unmeasured claim about the review step and gives her no numbers to check it against."
        misconception: "Cost savings are certain while quality loss is manageable"
    explanation: |
      Trade-offs are communicated in the decision-maker's units: money, risk and operational effort. Give a recommendation
      and the numbers behind it, so the sponsor can agree or disagree for stated reasons.

  # ---------------------------------------------------------------- comms.stakeholders
  - id: D3-007
    version: 1
    type: single
    subtopic: comms.stakeholders
    tags: [gov.identity]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      The customer's security lead refuses read access to a production database replica, saying "LLM means data
      leakage". The sponsor is frustrated and wants the FDE to join an escalation to the CIO. The project has two weeks
      of slack. What should the FDE do first?
    options:
      - text: "Meet the security lead, ask which leakage scenarios worry them, and propose scoped read-only access with logging; escalate if that stalls"
        correct: true
        why: "Treats the objection as a requirement to be met, and leaves escalation as a fallback with slack still available."
      - text: "Join the escalation to the CIO now, since delay is costing the project weeks and security's risk appetite is a leadership decision"
        why: "Speed is tempting, but escalating before understanding the concern hardens opposition, and slack remains."
        misconception: "Escalate early to protect the schedule"
      - text: "Send the security lead the vendor's SOC 2 report and data-processing terms, and ask for approval on that basis"
        why: "Answers a generic question about the vendor, not this lead's specific fear about what the LLM can reach, and it asks for a decision without a conversation."
        misconception: "Compliance paperwork resolves a security objection"
      - text: "Continue on synthetic data until the security review concludes, then request real data; two weeks of slack covers the wait"
        why: "Defers the problem and risks a prototype that cannot meet the real data's quality or constraints."
        misconception: "Showing results will dissolve a security objection"
      - text: "Ask the sponsor to sign a time-limited exception so access can start while the security review continues"
        why: "The sponsor does not own the security risk; an exception signed by the wrong person bypasses the control and harms trust."
        misconception: "Whoever sponsors the project can waive security policy"
    explanation: |
      Resistant security teams are usually pursuing a legitimate concern. Engage them directly, convert the objection
      into specific requirements, and propose controls such as least privilege and audit logging. Escalate when dialogue fails.

  - id: D3-008
    version: 1
    type: single
    subtopic: comms.stakeholders
    tags: [discovery.framing, gov.audit-compliance]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A legal-document assistant is nearly built for the General Counsel's team when the records-management group
      objects: retention policy bars derived copies of certain documents, and that includes the search index. The
      privacy and security reviews had both passed. Which discovery practice would most likely have caught this
      earlier?
    options:
      - text: "Mapping stakeholders by who controls data, policy and sign-off, not only who sponsors and uses the system"
        correct: true
        why: "Records management is neither sponsor nor user but controls a constraint; mapping by control surfaces them."
      - text: "Starting the privacy impact assessment and security review earlier and making them deeper"
        why: "Those reviewers own privacy and security. Retention of derived copies sits with a group that neither review involves, so a deeper review by the same people misses it."
        misconception: "More thorough standard reviews cover every compliance constraint"
      - text: "Asking the sponsor to list every constraint at kickoff, and treating the resulting list as complete"
        why: "The sponsor can only name constraints they know about, and they may not know about retention rules."
        misconception: "The sponsor knows all the constraints"
      - text: "Interviewing a larger sample of the General Counsel's lawyers about how they would use the system"
        why: "User research shows how people would work, not which policies bind the system. Lawyers using the tool would not necessarily know the retention rule either."
        misconception: "Talking to more end users uncovers every constraint"
    explanation: |
      Stakeholder mapping should cover everyone who can block or constrain the work: legal, records, privacy, security and
      IT, not only sponsor and users. Early conversations with them are cheaper than late surprises.

  - id: D3-009
    version: 1
    type: single
    subtopic: comms.stakeholders
    tags: [delivery.scoping]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      In a steering meeting, the customer's CEO, impressed by a demo of support-ticket triage, says: "Great, have it handling
      all customer email by month end." The team estimates that is five months of work, and the month-end date goes into the
      board pack that is sent out this evening. The sponsor looks at the FDE. What should the FDE do in the room?
    options:
      - text: "Affirm the goal, show the first slice that can land by month end, and ask what should give way for the rest"
        correct: true
        why: "Keeps the CEO's ambition, makes the trade-off visible before the date goes into the board pack, and puts the choice with the person entitled to make it."
      - text: "Say you will look into it and report back tomorrow, then reset expectations with the sponsor privately so nobody is contradicted publicly"
        why: "Avoids friction now, but the board pack goes out tonight, before the reset, with a date the team knows is infeasible."
        misconception: "Never disagree with a senior person in public"
      - text: "Explain that the request is not feasible in that time, listing the data, integration and evaluation steps that are involved"
        why: "May be accurate, but a list of obstacles reads as a refusal and lands badly. It offers the CEO no route to progress."
        misconception: "Detailing the constraints is the same as saying a useful no"
      - text: "Propose to reach month end by adding two engineers and asking the customer's IT team for dedicated integration staff"
        why: "Adding people late to a five-month plan does not compress it to weeks, and it commits the customer's staff on the FDE's behalf."
        misconception: "Adding people compresses a schedule"
    explanation: |
      Saying no to a senior executive works best as a yes to the goal with an explicit trade-off: what can be done by the
      date, what the rest costs, and what would have to give. It keeps authority and information together.

  - id: D3-010
    version: 2
    type: single
    subtopic: comms.stakeholders
    tags: [comms.tradeoffs]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      At a steering meeting, the sponsor tells the group the assistant "will cut handling time by half". Pilot data show
      20 to 25%. No budget or rollout decision depends on the figure before the next steering meeting in two weeks, and
      the sponsor has been a strong ally. What should the FDE do?
    options:
      - text: "Meet the sponsor before the next steering meeting, share the pilot data, and agree how the figure is restated to the group"
        correct: true
        why: "Corrects the expectation with evidence before any decision rests on it, reaches the same audience, and lets the sponsor restate her own claim."
      - text: "Correct the figure in the meeting with the pilot data, since a wrong target left standing will become the FDE's failure"
        why: "Would be right if a decision were about to rest on the figure. None is, so a public correction now costs the sponsor face for no gain over a private one that reaches the same group in time."
        misconception: "Transparency requires immediate public correction"
      - text: "Put the pilot range in the next written status report without comment on the sponsor's figure, so the data is on record"
        why: "Gets the facts out, but the sponsor learns of the gap from a document her peers also read, which feels like an ambush."
        misconception: "Letting the data speak is a gentler way to correct"
      - text: "Hold off until full rollout data is in, since a pilot figure may improve at scale and the sponsor's number could still prove right"
        why: "Possible, but today's evidence says 20 to 25%, the FDE will be judged against the figure, and waiting lets the expectation harden."
        misconception: "Pilot data are too uncertain to challenge a claim"
    explanation: |
      When no decision rests on a wrong claim yet, correct it privately and early: align the sponsor on the facts and
      agree how the corrected figure reaches the same audience, ideally from her. If a decision were about to rely on
      the claim, a brief, respectful clarification in the room would be the better move. Silence lets the gap grow,
      and a bypass costs the relationship.

  - id: D3-011
    version: 1
    type: multi
    subtopic: comms.stakeholders
    tags: [gov.identity, int.enterprise-devex]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      An FDE arrives at a customer whose IT organisation is openly sceptical of the vendor. Which actions are most
      likely to build their trust?
    options:
      - text: "Share the architecture and data-flow diagram and invite review before building the parts that touch their systems"
        correct: true
        why: "Gives IT a say in the design while changes are still cheap."
      - text: "Give their team read access to logs, evaluation results and audit trails from the first week"
        correct: true
        why: "Transparency turns IT from a gatekeeper who has to guess into a participant who can verify."
      - text: "Use their change-management and ticketing process for deployments instead of a parallel path"
        correct: true
        why: "Respects their control process and shows that the FDE will not bypass it."
      - text: "Ask for temporary administrator rights in the test environment so that integration issues can be fixed quickly"
        why: "Speeds the work but asks for more access than needed, which is what a sceptical team fears most."
        misconception: "Broad access in non-production is harmless to trust"
      - text: "Lead with the vendor's security certifications and reference customers to show that IT's concerns are already solved elsewhere"
        why: "Certifications describe the vendor's own estate. IT's worries are about what the system can reach and break in theirs."
        misconception: "Credentials from other environments answer this team's concerns"
      - text: "Ask the executive sponsor to instruct IT to cooperate, so no time is spent winning agreement"
        why: "A mandate buys compliance but not cooperation, and IT retains many ways to slow the work."
        misconception: "Authority from above is a substitute for earned trust"
    explanation: |
      Trust with resistant IT teams is earned with evidence and respect for their process: early design review, visibility
      into what the system does, and no bypassing of controls.

  - id: D3-012
    version: 1
    type: single
    subtopic: comms.stakeholders
    tags: [discovery.environment, delivery.scoping]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      The customer's data owner has not delivered a promised extract for three weeks, and the build is blocked. The
      data owner sits in a different department from the sponsor. The relationship is friendly and no escalation path
      was agreed at kickoff. What is the best next step?
    options:
      - text: "Tell the data owner you are raising it, then give the sponsor the dated impact and a request"
        correct: true
        why: "Transparent with the data owner, and gives the sponsor a decision they can act on."
      - text: "Keep following up with the data owner each day, since preserving their goodwill matters more than speed"
        why: "Repeated nudges after three weeks show that the blocker is not about reminders; the delay keeps costing the project."
        misconception: "Persistence with the same person eventually works"
      - text: "Carry on with synthetic data and stub files so that the schedule holds, and mention the gap in the final report"
        why: "Hides a risk and produces work that may not survive real data."
        misconception: "Keeping the plan on track matters more than surfacing the blocker"
      - text: "Contact the data owner's manager directly with the facts, so the sponsor is not troubled with a detail"
        why: "Goes around both the data owner and the sponsor, who is the one with standing to raise it across departments, and a three-week block is no longer a detail."
        misconception: "Escalating sideways is more tactful than going up"
    explanation: |
      Good escalation is open and specific: tell the person you are raising it, quantify the impact in days, and ask the
      right decision-maker for something concrete. Agree the path at kickoff so it is not a surprise.

  - id: D3-013
    version: 1
    type: single
    subtopic: comms.stakeholders
    tags: [gov.approvals, adoption.change]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A sales-operations VP wants AI-drafted customer emails sent automatically to keep response time under an hour.
      Legal wants every message reviewed before it goes out, because a wrong statement on pricing, contracts or
      complaints could bind the company in writing. Both are senior and both have a legitimate point. Most
      of the volume is routine order-status and scheduling replies; a minority involve pricing, contracts or
      complaints. The COO, who is the project's executive sponsor, has authority over both functions. What should the
      FDE do?
    options:
      - text: "Bring both to the COO with a tiered option: auto-send low-risk categories, review high-risk ones"
        correct: true
        why: "Turns a binary conflict into a risk-based design that gives each side most of what it needs, with a decision from the person who has authority over both."
      - text: "Propose auto-sending everything for now, with Legal reviewing a daily sample afterwards and the rules tightened if problems appear"
        why: "Sampling after the fact lets pricing, contract and complaint messages go out unreviewed, which is the exposure Legal raised, and the FDE is choosing that trade-off for the COO."
        misconception: "Sampling after the fact is equivalent to review before sending"
      - text: "Side with Legal, since a wrongly sent message carries legal exposure while a slow reply costs only a little goodwill"
        why: "Plausible on risk, but a unilateral choice sacrifices the business goal and the FDE does not own that trade-off."
        misconception: "The more conservative side should win by default"
      - text: "Ask the two leaders to settle it between themselves and report back, since they own their own functions"
        why: "Neither has authority over the other, so the conflict stalls and the project waits."
        misconception: "Peers can resolve a cross-functional conflict unaided"
    explanation: |
      Where stakeholders conflict on risk and speed, look for a design that tiers by risk, and take the trade-off to
      the person with authority over both. Proportional human review is the usual shape of a workable compromise.

  # ---------------------------------------------------------------- adoption.change
  - id: D3-014
    version: 1
    type: single
    subtopic: adoption.change
    tags: [delivery.go-live]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      Three months after go-live, 35% of target users use the assistant weekly. Those who do finish tasks faster.
      Interviews show managers still ask for the weekly report from the legacy tool, and the assistant sits in a separate
      browser tab. What is the best next step?
    options:
      - text: "Put the assistant inside the system people already work in, and have managers take the report from its output"
        correct: true
        why: "Removes the reason for the old path and puts the new one where the work happens."
      - text: "Recruit a respected user in each team as a champion and pair every non-user with one for a week"
        why: "Peer support helps, but champions cannot remove the manager's report requirement or the extra tab that pull people back."
        misconception: "Peer influence outweighs structural friction"
      - text: "Run another round of interviews and a survey of non-users, since the cause of the low usage is not yet established"
        why: "The existing interviews already show the cause. More research delays the fix."
        misconception: "More research is needed before acting"
      - text: "Have the sponsor email a mandate to use the assistant from next month, with usage reported to managers"
        why: "Mandates can lift numbers briefly, but do nothing about the competing report and tab friction that cause the behaviour."
        misconception: "Policy alone changes habits"
    explanation: |
      Go-live is not adoption. Adoption follows when the new path is easier than the old and the old path is retired. Fit
      into the existing workflow and align what managers ask for before reaching for training or mandates.

  - id: D3-015
    version: 1
    type: single
    subtopic: adoption.change
    tags: [obs.slo]
    difficulty: 1
    level: apply
    time_s: 60
    stem: |
      A contact-centre assistant has been given to 900 agents. The team wants one metric that shows whether the launch
      is turning into real use during the first two weeks. Which is the best choice?
    options:
      - text: "Share of agents with access who complete a real customer case with the assistant within two weeks"
        correct: true
        why: "Measures completion of the core task, which is what activation means, relative to the people who could use it."
      - text: "Share of the 900 agents who opened the assistant on at least one working day in the first two weeks"
        why: "Counts a single visit as use. Agents can open it once, find nothing useful and leave, so it measures curiosity rather than adoption."
        misconception: "Any activity counts as adoption"
      - text: "Average handling time of agents who use the assistant compared with those who do not"
        why: "An outcome comparison, not a usage measure. Early adopters are often the most capable agents, so it is confounded and says nothing about how many people use it."
        misconception: "An outcome comparison shows whether adoption is happening"
      - text: "Average satisfaction score that agents give the assistant when asked in a short in-app rating prompt"
        why: "Only people who engaged answer, and a high score from a small group can sit alongside very low use."
        misconception: "Sentiment from users measures how many people use it"
    explanation: |
      Activation is the share of users who reach the core value moment, such as completing a real task, within a window.
      Licences, training attendance, logins and ratings are easier to count but are not measures of use.

  - id: D3-016
    version: 1
    type: single
    subtopic: adoption.change
    tags: [comms.stakeholders]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      Claims adjusters passively resist a new triage assistant. A rumour says it will lead to job cuts, and adjusters
      override its suggestions far more often than the pilot predicted. The VP of Operations says no layoffs are planned.
      What is the most effective response?
    options:
      - text: "Have the VP state in writing what changes for roles, and make adjusters reviewers whose corrections shape the tool"
        correct: true
        why: "Addresses the fear at its source with a credible commitment and gives adjusters ownership of the tool's quality."
      - text: "Have the VP tell the claims team in a town hall that no layoffs are planned, and repeat the message in the team newsletter"
        why: "Repeating a verbal assurance with no detail on roles or time frame is easy to discount, and rumours fill the gap."
        misconception: "Reassurance in general terms is enough to settle a rumour"
      - text: "Present the productivity gains to the whole claims team in a town hall to show the tool makes their work better"
        why: "Productivity gains are what make staff fear that fewer of them will be needed."
        misconception: "Showing benefits to the company reassures employees"
      - text: "Add a monthly bonus tied to how often each adjuster accepts the assistant's suggestions"
        why: "With fear present, paying for acceptance produces compliance and gaming, and confirms the suspicion that the tool judges them."
        misconception: "Incentives alone overcome fear"
    explanation: |
      Resistance driven by fear of replacement is a trust problem. Credible written commitments from someone with authority,
      plus real involvement of the affected people, work better than selling benefits or imposing targets.

  - id: D3-017
    version: 1
    type: single
    subtopic: adoption.change
    tags: [delivery.go-live]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A sponsor wants a new assistant live for all 2,000 agents of a contact centre on Monday to start realising
      savings. It has not been tested at scale on real workloads, and several supervisors are lukewarm. What rollout
      do you recommend?
    options:
      - text: "Staged cohorts across several sites and agent profiles, each expansion gated by exit criteria and a rollback plan"
        correct: true
        why: "Limits the cost of surprises, tests at growing scale on representative users, and lets the team learn gradually."
      - text: "A pilot with the most enthusiastic supervisors' teams, then everyone at once if they report well"
        why: "Enthusiasts give a flattering signal, and the jump from a small group to 2,000 agents is the untested-at-scale risk the sponsor is ignoring."
        misconception: "A friendly pilot group gives a reliable signal"
      - text: "All agents on Monday but only the safest feature first, adding the others over the following weeks"
        why: "Limits the feature risk, but all 2,000 agents and the lukewarm supervisors hit the system together, so scale and local resistance are not tested gradually."
        misconception: "Phasing features is equivalent to phasing users"
      - text: "Launch to everyone on Monday with extra floor support, since one training and communications push is far cheaper than staging a rollout"
        why: "Cheapest on paper, but any defect or confusion hits 2,000 agents at once with lukewarm supervisors."
        misconception: "Staging costs more than it saves"
    explanation: |
      A gradual rollout with representative cohorts, willing local leaders, explicit exit criteria and rollback limits
      risk and produces trustworthy evidence. It is the usual path for change that crosses many users.

  - id: D3-018
    version: 2
    type: multi
    subtopic: adoption.change
    tags: [comms.stakeholders]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      An AI-assisted intake process spans Sales Operations, Legal and Finance. Usage is strong in two departments but
      stalled in Finance. Finance managers say the new steps take little time, but the work keeps losing out to their
      own priorities. Which steps are most likely to restore adoption?
    options:
      - text: "Ask the sponsor to name one accountable executive for the end-to-end process and set a shared target across departments"
        correct: true
        why: "Cross-department change needs a single owner; otherwise each department optimises its own goals."
      - text: "Align each department's own goals with the change, for example adding cycle time to Finance's targets"
        correct: true
        why: "Finance's own goals decide what wins its attention; making the change count in them removes the conflict."
      - text: "Set up a regular cross-department review chaired by the sponsor, where blockers are escalated and decided"
        correct: true
        why: "Gives a place where blockers can be resolved with authority instead of lingering."
      - text: "Offer Finance a dedicated analyst to enter and check intake records for the first two months"
        why: "Lowers effort, but Finance says the steps take little time. The blocker is competing priorities, which extra help does not change."
        misconception: "Adoption stalls because the work is burdensome"
      - text: "Run a communication campaign for Finance staff explaining the benefits the other two departments have seen"
        why: "The blocker is Finance's own priorities, not awareness, and benefits accruing to other departments do not change them."
        misconception: "Adoption problems are awareness problems"
      - text: "Negotiate separately with each department head and keep the sponsor out until there is something to report"
        why: "Without the sponsor, the FDE lacks the authority to move priorities, and Finance learns it can wait."
        misconception: "Quiet diplomacy replaces executive sponsorship"
    explanation: |
      Cross-department adoption stalls when no one owns the end-to-end result and local goals conflict. Executive
      sponsorship, shared goals and a place to decide are the usual remedies. Extra help and awareness campaigns
      address effort and knowledge, which are not the blocker here.

  # ---------------------------------------------------------------- adoption.handoff
  - id: D3-019
    version: 1
    type: single
    subtopic: adoption.handoff
    tags: [delivery.go-live]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      A contract ends in two weeks. Documentation is complete, but only the FDE has ever redeployed the system or re-run
      its evaluation suite. The customer's team of three engineers has attended all the walkthroughs. How should the FDE
      handle the handoff?
    options:
      - text: "Have the customer's team make a change, redeploy and re-run the evaluation with the FDE only watching, before sign-off"
        correct: true
        why: "Capability is shown by doing, so the sign-off rests on observed independence rather than on attendance."
      - text: "Pair the FDE with one named customer engineer for the final two weeks and hand that person every operational task"
        why: "Builds depth in one person and creates a new single point of knowledge. Nobody has shown the team can operate the system, and that engineer may leave or be unavailable."
        misconception: "Training one successor transfers the capability"
      - text: "Hand over complete documentation and a recorded walkthrough, so the team can learn at its own pace after the contract ends"
        why: "Documentation is necessary but does not prove the team can operate the system, and the questions will arrive after the FDE has left."
        misconception: "Complete documentation equals successful handoff"
      - text: "Sign off on schedule and offer a retainer for questions, so that the customer has help whenever the need arises after the contract"
        why: "A retainer turns an unfinished handoff into continuing dependence and a billing line."
        misconception: "Ongoing support covers a capability gap"
      - text: "Extend the FDE's involvement until the customer's team has run the system alone for a full quarter"
        why: "Overshoots; independence can be shown in a supervised exercise, and open-ended extension creates dependence."
        misconception: "Trust requires time rather than evidence"
    explanation: |
      Exit criteria should test that the customer can operate, change and troubleshoot the system without you. A supervised
      exercise in which they do the work is stronger evidence than documents or attendance.

  - id: D3-020
    version: 1
    type: single
    subtopic: adoption.handoff
    tags: [obs.troubleshooting]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      The customer's IT operations team already runs deployments and rollbacks for other applications but has never run
      an LLM application, and will own this one after handoff. Which runbook content will help them most on their
      first incident, such as a sudden rise in wrong answers?
    options:
      - text: "Symptom-based playbooks for known failures such as stale index, provider outage and quality drop, each with actions"
        correct: true
        why: "Operators under pressure need to go from a symptom to an action, not from theory to diagnosis."
      - text: "Step-by-step procedures for redeploying and rolling back the application and its configuration"
        why: "Useful, but this team already does deployments and rollbacks. A rollback does not tell them what is wrong or whether rolling back would help."
        misconception: "Operational procedures cover the incident"
      - text: "A guide to every dashboard panel and metric, explaining what each shows and its normal range"
        why: "Helps them read the system but stops short of what to do when a number is off, which is what a runbook is for."
        misconception: "Understanding the metrics is the same as knowing the response"
      - text: "The full text of every prompt, annotated with the intent behind each phrase, so operators can edit them safely"
        why: "Prompt edits without evaluation are a risk, and they are not the first thing an operator needs in an incident."
        misconception: "Operators should be able to tune the prompts"
    explanation: |
      Runbooks are for the person who is paged. Organise them by symptom, with checks, actions, escalation contacts and the
      known failure modes of this deployment.

  - id: D3-021
    version: 2
    type: single
    subtopic: adoption.handoff
    tags: [role.economics, role.productization]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A customer has two engineers. Leadership is content to stay on the vendor's agent platform that underlies the
      solution, but fears needing the vendor for every change and incident, and asks the FDE to design the handoff
      accordingly. What is the best approach?
    options:
      - text: "Keep prompts, evaluation sets and configuration in the customer's repository, document the platform dependency, and agree an SLA"
        correct: true
        why: "The customer owns and can change what carries its logic, while the remaining dependency on the platform is bounded, documented and supported by contract."
      - text: "Build a portability layer so the solution can be moved to a different platform within weeks, and hand over the layer with the solution"
        why: "Prepares for leaving the platform, which leadership does not plan, and leaves two engineers maintaining a layer that does not help them change or run the solution day to day."
        misconception: "Eliminating a dependency is better than managing it"
      - text: "Keep the vendor operating the solution day to day, and give the customer dashboards, since two engineers cannot run it alone and need time"
        why: "Entrenches the dependency leadership wants to reduce and does not transfer capability."
        misconception: "Visibility is the same as control"
      - text: "Negotiate source-code escrow for the platform, so the customer can maintain it themselves if the vendor fails"
        why: "A common safeguard against vendor failure, but that is not the everyday dependence leadership fears, and two engineers could not maintain a platform."
        misconception: "A legal safeguard resolves an operational dependency"
    explanation: |
      When the concern is day-to-day dependence rather than leaving the platform, the customer should own the assets
      that carry its logic and knowledge, and the remaining dependence on the platform should be explicit and
      contractually supported. If leadership wanted an exit path, proportionate export and exit terms would belong in
      the plan as well.

  - id: D3-022
    version: 1
    type: single
    subtopic: adoption.handoff
    tags: [obs.tracing]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      A customer help desk will take calls from users saying "the answers are wrong" after the FDE leaves. Which support
      model best fits?
    options:
      - text: "Tiered support: help desk triage with trace IDs, the customer's app team owns fixes, the vendor takes platform defects"
        correct: true
        why: "Gives each level a defined job, a way to pass evidence upward, and keeps the vendor's role bounded."
      - text: "A shared chat channel where the customer's staff can ask the original FDE directly, for fast answers"
        why: "Fast at first, but it depends on one person's availability and keeps knowledge in their head."
        misconception: "Informal access to the expert is a support model"
      - text: "Route all issues to the vendor's ticket queue so there is a single place to look and the vendor's expertise applies from the first report"
        why: "Simple, but it leaves the customer unable to resolve routine issues and makes every question a vendor cost."
        misconception: "Centralised support avoids confusion"
      - text: "The help desk logs every call and passes it to the customer's app team, who contact the vendor by email if they judge it a platform defect"
        why: "A defined path, but with no triage or evidence capture at the first level, the app team receives every vague complaint without trace data and the vendor cannot reproduce defects."
        misconception: "A single internal owner is enough without triage"
    explanation: |
      A post-handoff support model defines who triages, who fixes, who escalates and what evidence moves between levels.
      Trace identifiers and examples let a help desk pass useful detail rather than "it's wrong".

  - id: D3-023
    version: 1
    type: multi
    subtopic: adoption.handoff
    tags: [gov.audit-compliance, eval.gates]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      Which evidence best shows that a customer's team can operate an AI application without the FDE?
    options:
      - text: "The customer's team handled a real or simulated incident end to end, with the FDE silent"
        correct: true
        why: "Demonstrates operational capability in the situation that matters."
      - text: "Named roles own monitoring, alert response and evaluation re-runs, and the evaluation set is in the customer's repository"
        correct: true
        why: "Ownership assigned to people and artefacts held by the customer are what keep the system running after the handover."
      - text: "The customer's project manager has reviewed and signed off the full handover documentation set"
        why: "Shows the documents exist and were read, not that anyone can act on them."
        misconception: "Signed documents prove capability"
      - text: "The system met its uptime target for the previous 30 days while the FDE was handling the incidents themselves"
        why: "Measures the FDE's operation of the system, not the customer's."
        misconception: "Good service levels show readiness to hand over"
      - text: "Each customer engineer explained, in a review session, what every dashboard metric means and what the alerts are for"
        why: "Shows understanding of the monitoring, but not that they can diagnose and fix a live problem, which is the capability in question."
        misconception: "Being able to explain the system shows the ability to operate it"
    explanation: |
      Exit criteria should be demonstrable: the customer has done the work, owns the assets and has assigned responsibility.
      Documents, explanations and the FDE's own track record say little about the customer's ability.

  # ---------------------------------------------------------------- numeric
  - id: D3-024
    version: 3
    type: numeric
    subtopic: adoption.change
    tags: [role.economics, obs.cost]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 150
    stem: |
      A support assistant is projected to save 1,000 handling hours per month if all 900 agents with access use it. Only
      420 of them actually do, and each active agent contributes equally. A handling hour costs $38 fully loaded, and the
      vendor fee is $20,000 per month. What is the monthly net benefit, in US dollars (negative if a loss)? Round to the
      nearest dollar.
    answer: {value: -2267, tolerance: 15, tolerance_type: abs, unit: "USD (negative = loss)"}
    work: |
      Hours saved = 1,000 × 420 / 900 = 466.67.\
      Value = 466.67 × $38 = $17,733.\
      Net = 17,733 − 20,000 = −$2,267 per month.
    explanation: |
      Benefits scale with adoption, but the fee does not. Assuming full adoption would give +$18,000 (1,000 × 38 − 20,000),
      the opposite sign. Adoption is part of the business case, not an afterthought. Answers within $15 are accepted,
      which covers rounding the hours to a whole number first (467 hours gives −$2,254).

  # ---------------------------------------------------------------- open
  - id: D3-025
    version: 2
    type: open
    subtopic: comms.tradeoffs
    tags: [llm.failure-modes, gov.responsible-ai]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 540
    stem: |
      Last week, an insurer's customer-facing assistant told a policyholder that water damage was covered, when it was
      not. The customer called and complained, and the Head of Claims has asked you for a written account: what
      happened, where things stand now, how likely it is to recur, and what you are changing. You have confirmed that a
      policy document was missing from the knowledge base, so the assistant answered from general knowledge. Nothing in
      the assistant has been changed yet. Write the reply, under 300 words.
    rubric:
      - criterion: "Impact, cause and current status up front"
        points: 2
        guidance: "2 if the opening quickly states the incorrect coverage answer, its cause in brief, and the current status, keeping what is done separate from what is proposed (for example an immediate containment step it recommends or will make today); 1 if these appear but are buried after a preamble or the status is unclear; 0 if there is no usable account, or it presents a fix, or a correction to the policyholder, as already done. A brief expression of regret alongside the facts is fine."
      - criterion: "Accurate, non-defensive account of cause"
        points: 2
        guidance: "2 if the cause (a policy document missing from the knowledge base, so the assistant answered from general knowledge instead of the insurer's wording) is stated plainly and the gap that allowed it is owned, without blame or excuses; 1 if broadly accurate but vague, evasive or needlessly technical; 0 if wrong, absent, or it blames the model or the customer."
      - criterion: "Honest statement of residual risk"
        points: 3
        guidance: "3 if it says errors of this type can recur, gives a credible way to measure or detect them (for example sampling coverage answers, tracking declined answers, regression tests) and neither promises zero nor invents a probability; 2 if it acknowledges the risk with only a limited or vague way to measure it; 1 if only a generic caveat; 0 if it promises it cannot happen again or ignores recurrence."
      - criterion: "Concrete corrective plan with owners and dates"
        points: 3
        guidance: "3 if it covers proportionate containment (for example declining or routing coverage questions that have no matching source), correction (checking every policy against the knowledge base), verification (tests for this question type), and asks for the affected policyholder's case to be reviewed through the claims team, with owners or dates and a follow-up; 2 if concrete and useful but with a material gap in ownership, dates or verification; 1 if a generic promise to improve; 0 if none. Specific numbers such as sample sizes or test counts are examples, not requirements."
    model_answer: |
      Subject: Incorrect coverage answer last week: cause, status and changes

      Last week the assistant told a policyholder that water damage was covered under their policy. It is not. The
      cause is confirmed: that policy's document was missing from the knowledge base, so the assistant answered from
      general knowledge instead of from your wording. Nothing in the assistant has changed yet; the first action below
      is the one I propose for today.

      That gap is ours. We had no check that every policy was loaded, and nothing stopped the assistant answering a
      coverage question without a source.

      Will it recur? It can, and I won't promise otherwise. What we can do is make it less likely and make any
      recurrence visible.

      Actions:

      1. Today, with your approval: the assistant declines coverage questions when it finds no matching policy
         source and refers the customer to your team. We will track how often that happens. Owner: me.
      2. By Friday: check every policy type against the knowledge base and load anything missing. Owner: me.
      3. By next Wednesday: add coverage questions, including this one, to the regression tests run before every
         release. Owner: our evaluation lead.
      4. From next week: your claims team reviews a weekly sample of coverage answers, and I report the error rate
         to you.
      5. Could your team review this policyholder's case and decide how to correct what they were told? I can send
         you the conversation log today.

      I will update you on Friday with the results of the coverage check.
    max_chars: 2200

  - id: D3-026
    version: 1
    type: open
    subtopic: comms.stakeholders
    tags: [discovery.framing, adoption.change]
    competencies: [x.written-comms]
    difficulty: 2
    level: analyze
    time_s: 540
    stem: |
      You start an engagement to automate loan-document intake at a regional bank. The sponsor is the COO. About 60
      processors would use the system. You know little yet about IT, compliance, legal or data owners, and the COO says
      "the processors are nervous". In the first week, describe your stakeholder plan: who you map, what each group
      probably cares about, how you engage them, and where you expect resistance. Under 300 words.
    rubric:
      - criterion: "Maps beyond sponsor and users"
        points: 3
        guidance: "3 if it identifies IT/security, compliance/legal, data owners and a business-side owner (for example the processors' managers) as well as sponsor and users; 2 if it names three groups; 1 if only sponsor and users; 0 if missing."
      - criterion: "Distinguishes interests per group"
        points: 2
        guidance: "2 if each group has a distinct concern (for example security: data exposure, compliance: auditability, processors: job security); 1 if generic; 0 if none."
      - criterion: "Engagement actions are specific and early"
        points: 3
        guidance: "3 if there are concrete first-week actions (interviews, shadowing processors, early review sessions with security/compliance) and a cadence; 2 if concrete but vague on timing; 1 if generic; 0 if none."
      - criterion: "Anticipates resistance and escalation"
        points: 2
        guidance: "2 if it names the likely sources of resistance and how it would address or escalate them via the sponsor; 1 if only one; 0 if neither."
    model_answer: |
      My aim in week one is to find everyone who can block, constrain or benefit from the system, and to understand what
      each needs before I build.

      Map. Sponsor (COO), processors and their team leads, IT and information security, compliance and legal (including
      anyone responsible for model-risk or vendor reviews), and the data owners for the loan and customer systems. I
      would also ask the COO who else has been burned by earlier automation.

      Interests. Processors: job security, whether it makes their work harder, whether they are measured by it. Team
      leads: queues and service levels. Security: where data goes, who can see it, access scope. Compliance and legal:
      auditability, retention and explainability for regulators. Data owners: control over how their data is used.

      Engagement. Shadow processors for a day or two; hold a 30-minute session with each team lead. Book early
      meetings with security and compliance, bring a data-flow diagram and a list of questions, and agree what they
      need in order to approve. Meet the COO weekly.

      Resistance. Processors will resist if they see it as replacement; I would ask the COO for a clear statement on
      roles and involve processors as reviewers. Security and compliance will resist late discoveries, so I would
      get them in early. If anything stalls, I would take it to the COO with dates and a specific request.
    max_chars: 2200

  - id: D3-027
    version: 1
    type: open
    subtopic: adoption.change
    tags: [delivery.go-live, obs.slo]
    competencies: [x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 540
    stem: |
      An AI assistant for evidence review was launched two months ago at a manufacturer's internal-audit group. Only
      18% of the intended users use it each week. The sponsor, the Chief Audit Executive, wants a diagnosis and a plan by
      Friday and says "the tool is fine, people just need to use it". Write your response: how you will find out why
      usage is low, what you will measure, and what you propose for the next 30 days. Under 300 words.
    rubric:
      - criterion: "Challenges the assumption with evidence-gathering"
        points: 3
        guidance: "3 if it politely questions 'the tool is fine' and proposes concrete diagnosis (usage data by user and task, interviews with users and non-users, observing real work); 2 if proposes diagnosis without challenging; 1 if jumps to solutions; 0 if accepts the sponsor's framing."
      - criterion: "Defines adoption metrics"
        points: 2
        guidance: "2 if it defines activation or task-level usage among eligible users, and a target, rather than logins or licences; 1 if usage is mentioned loosely; 0 if no metrics."
      - criterion: "30-day plan is specific and prioritised"
        points: 3
        guidance: "3 if it gives dated actions with owners (for example fix the top friction, embed in existing workflow, recruit champions, adjust manager expectations) and says what would be decided at day 30; 2 if specific but unprioritised; 1 if generic; 0 if none."
      - criterion: "Appropriate use of sponsorship"
        points: 2
        guidance: "2 if it states what it needs from the sponsor (for example changing what managers ask for, naming champions); 1 if mentions the sponsor generically; 0 if none."
    model_answer: |
      Bottom line: 18% weekly use says the tool may be fine for some people and a poor fit for the way the rest work.
      I can't tell which until I have looked, and I would rather know by next Friday than guess.

      Diagnosis (this week). I'll pull usage by person and task to see who tried and dropped off, interview ten users and
      ten non-users, and watch four auditors do real evidence reviews to see where the tool sits in their workflow.

      Metric. I propose we track activation: the share of eligible auditors who complete a real evidence review with the
      tool within their first two weeks, and weekly repeat use after that. Today's 18% is weekly use; I'd like a target
      of 50% activation by day 60, to be confirmed with you.

      Next 30 days. Week 1: diagnose. Week 2: remove the top two friction points we find, and put the tool in the system
      auditors already use. Weeks 3 and 4: recruit three respected auditors as champions and run a short cohort with
      them, measuring time saved. At day 30 we decide whether to widen or to change course.

      From you: ask team leads to take their evidence summaries from the tool's output, and name champions. If the
      diagnosis shows that the tool is not suited to some tasks, we should say so and focus where it works.
    max_chars: 2200

  - id: D3-028
    version: 1
    type: open
    subtopic: adoption.handoff
    tags: [obs.troubleshooting, gov.audit-compliance]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 540
    stem: |
      Your contract ends in six weeks. You built and run a support-ticket classification and drafting system for a
      logistics customer. Their team of three engineers has been involved only from time to time. Write your handoff plan:
      the exit criteria, the schedule, what you will deliver, and the support model afterwards. Under 300 words.
    rubric:
      - criterion: "Exit criteria are demonstrable"
        points: 3
        guidance: "3 if criteria are observable (customer team deploys a change, re-runs evaluation, handles an incident unaided); 2 if mixed with document-based criteria; 1 if only documents and training attendance; 0 if absent."
      - criterion: "Schedule shifts ownership progressively"
        points: 2
        guidance: "2 if the plan moves from FDE-led to shadowing to customer-led within the six weeks; 1 if a single handover event; 0 if no schedule."
      - criterion: "Deliverables cover operation, not only description"
        points: 3
        guidance: "3 if runbooks by symptom, evaluation set and procedure, monitoring and alert ownership, and access/credentials transfer are covered; 2 if two or three; 1 if only documentation; 0 if none."
      - criterion: "Support model and dependencies"
        points: 2
        guidance: "2 if it defines tiers, escalation and what the vendor remains responsible for, and addresses single points of knowledge; 1 if partial; 0 if absent."
    model_answer: |
      Exit test: by week 6 the customer's engineers, with me observing, redeploy a change, re-run the evaluation suite,
      and resolve a simulated incident from the runbook. I will not sign off on documents or attendance alone.

      Schedule. Weeks 1-2: I lead, they shadow, and I involve the three engineers daily; we agree who owns what. Weeks
      3-4: they drive, I advise; they make one prompt change and one routing change through the full release process.
      Weeks 5-6: they run it alone, and I intervene only when asked. In week 6, a game-day exercise with a simulated
      incident.

      Deliverables. Symptom-based runbooks (wrong answers, stale data, provider outage, queue backlog) with checks and
      escalation. The evaluation set and a one-page procedure for re-running and reading it. Dashboards and alerts with a
      named owner each. Prompts, configuration and evaluation data in their repository. A transfer of credentials and
      access, with my access removed.

      Support. Their help desk triages with trace IDs; their app team fixes; the vendor takes platform defects against an
      SLA. A monthly review for the first quarter. I will list single points of knowledge in week 2 and remove them.
    max_chars: 2200

  # ---------------------------------------------------------------- audio
  - id: D3-029
    version: 2
    type: audio
    subtopic: comms.tradeoffs
    tags: [eval.gates, delivery.go-live]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 90
    prep_s: 30
    max_s: 60
    stem: |
      In the corridor, the sponsor asks: "In one minute: should we expand the pilot to all regions?" Pilot results are
      strong in two regions and weak in three, mostly because of data quality in the three. Answer out loud, as you
      would to her.
    rubric:
      - criterion: "Clear recommendation up front"
        points: 3
        guidance: "3 if a direct answer comes in the first sentence (for example: expand to the two strong regions, not yet to the other three); 2 if it comes promptly after a brief lead-in; 1 if it appears late or only by implication; 0 if no recommendation."
      - criterion: "States evidence and uncertainty plainly"
        points: 2
        guidance: "2 if it cites the difference between regions, names data quality as the main cause without ruling out other factors, and says what is not yet known; 1 if only one or two of these; 0 if none."
      - criterion: "Gives a path and a checkpoint for the rest"
        points: 2
        guidance: "2 if it states what is needed in the three regions and when or on what evidence the decision will be revisited, without promising that the data work will be finished by then; 1 if vague; 0 if none."
      - criterion: "Suits a sponsor in a hurry"
        points: 1
        guidance: "1 if jargon-free and the answer fits the minute she asked for; 0 if technical or rambling."
    model_answer: |
      Yes for two regions, not yet for the other three. In the two strong regions the results meet the target. In the
      other three they fall short, mainly because of the quality of their data, so rolling out there now
      would give those teams a poor first experience.

      What I don't know yet is how quickly that data can be fixed, or whether anything else is holding them back. So:
      expand to the two strong regions now, start the data cleanup in the other three with a named owner in each, and
      I'll come back in six weeks with progress and a go or no-go for any region that's ready. In one line for your
      boss: expanding where it works, fixing the data where it doesn't.

  - id: D3-030
    version: 2
    type: audio
    subtopic: comms.stakeholders
    tags: [adoption.change]
    competencies: [x.written-comms]
    difficulty: 2
    level: apply
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      In a review meeting, a team lead for the people using your assistant says: "This tool makes our job harder. It
      adds a step, the drafts need rewriting, and I want it switched off." The sponsor is present. Respond out loud.
    rubric:
      - criterion: "Acknowledges and checks understanding"
        points: 2
        guidance: "2 if it acknowledges the concern specifically and asks a clarifying question rather than defending the tool; 1 if only acknowledges; 0 if defensive."
      - criterion: "Treats the complaint as information"
        points: 2
        guidance: "2 if it proposes to look at real examples (rewritten drafts, the added step) and measure; 1 if it promises to improve in general terms; 0 if it argues with the claim."
      - criterion: "Proposes a concrete and bounded next step"
        points: 3
        guidance: "3 if it offers something specific and time-boxed (for example sit with two agents this week, review the added step and the rewrites, decide together in two weeks) and answers the switch-off request honestly; 2 if specific and time-boxed but one material part is unresolved, such as ignoring the switch-off request; 1 if vague; 0 if none. Accept any justified answer to the switch-off request, including a temporary pause, opt-out for the team or a bounded comparison. Credit a commitment to findings and a decision by the date; a promise that a fix will be done before the cause is known does not count as concrete."
      - criterion: "Handles the sponsor in the room"
        points: 1
        guidance: "1 if it keeps the sponsor informed and does not escalate or play to them; 0 if it appeals to the sponsor to overrule the team lead."
    model_answer: |
      Thank you for saying that directly; if it's making your team's job harder, that's what I need to fix. Can I ask a
      couple of questions? Which step does it add, and how many of the drafts need rewriting?

      I'd like to see examples rather than argue about averages. Could two of your agents sit with me for an hour this
      week, so I can watch the added step and the rewrites on real tickets? I'll measure how much time the tool takes
      against doing it without. If the numbers show it's slowing you down, we should know that.

      On switching it off: I don't want to push it on you. What I propose is that I come back in two weeks with what we
      found on the extra step and the drafts, and what can be fixed, and then we decide together whether it stays on for
      your team. In the meantime I'm happy for you to carry on without it if that's easier. I'll keep the sponsor
      updated on what we find.

  - id: D3-031
    version: 2
    type: audio
    subtopic: adoption.handoff
    tags: [obs.troubleshooting]
    competencies: [x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      You are leaving the engagement next week. You built and have run a retrieval-based assistant over the customer's
      internal documents, on the vendor's agent platform. The customer's new platform owner, who joined last month,
      asks: "What are you handing me, and what do I need to be able to do on day one?" Answer out loud.
    rubric:
      - criterion: "Bottom line first"
        points: 2
        guidance: "2 if it starts with a short summary of what is handed over and what the owner must be able to do; 1 if it starts with background; 0 if disorganised."
      - criterion: "Covers what the owner needs to operate"
        points: 3
        guidance: "3 if it covers at least four of: the runbooks, the evaluation set and how to re-run it, monitoring and alerts, access, and the known failure modes; 2 if three of these; 1 if one or two; 0 if none."
      - criterion: "Is honest about risks and dependencies"
        points: 2
        guidance: "2 if it names specific risks plausible for this system (for example the document index going stale, quality drift when the model changes, dependence on the vendor's platform, knowledge only the FDE holds) and what to watch, or states how the open risks will be listed and confirmed before leaving; 1 if generic; 0 if it claims no risks. Do not require particular risks or invented system details."
      - criterion: "Support and next steps"
        points: 1
        guidance: "1 if it says who to go to for which kind of problem, or how that will be confirmed, and gives a first-week action; 0 if absent."
    model_answer: |
      In short: you are getting a running system, the checks that tell you whether it is healthy, and a way to change it
      safely. On day one you need to be able to read the dashboard, handle the three most common failures from the runbook,
      and re-run the evaluation suite before any change.

      Specifically: runbooks organised by symptom; the evaluation set and the one-page procedure for running it; alerts
      with named owners; the prompts and configuration in your repository, not mine; and access, which I am transferring
      this week.

      What I would watch: the knowledge base goes stale if nobody owns refreshes, and quality can drift when the model
      provider changes versions, so run the evaluation monthly. Some of what I know about the system's quirks is only
      in my head; I'll write it into the runbook and walk you through it before I go.

      For support, your help desk triages, your team fixes, and the vendor's platform team takes platform defects under
      your support agreement; I'll confirm the exact terms with you this week. In your first week, I suggest you re-run
      the evaluation yourself with me watching.
