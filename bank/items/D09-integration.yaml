domain: D9
items:
  - id: D9-001
    version: 1
    type: single
    subtopic: int.apis
    tags: [gov.guardrails]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      Your service receives GitHub-style webhooks and verifies the `X-Hub-Signature-256` HMAC. The check passes in
      local tests but fails for roughly 1 in 20 production deliveries, always for payloads containing non-ASCII
      text or unusual spacing. The handler first parses the JSON body, then re-serialises it with the framework's
      JSON encoder to compute the digest. What should change?
    options:
      - text: Compute the HMAC over the raw request bytes exactly as received, before any parsing
        correct: true
        why: The sender signed the bytes it sent, so any re-encoding that changes whitespace, escaping or key order breaks the digest.
      - text: Re-serialise the parsed JSON with sorted keys and no whitespace and sign that canonical form
        why: The sender did not canonicalise before signing, so a canonical form will still differ from what was signed.
        misconception: Canonicalising JSON on the receiving side makes signatures comparable
      - text: Drop the signature check and accept only requests from the provider's published IP ranges
        why: Source addresses are not payload authentication, and ranges change; this removes integrity and authenticity checks.
        misconception: Network origin is an adequate substitute for a signature
      - text: Put a long random token in the webhook URL query string and require it on each delivery
        why: A static URL token is a bearer secret that appears in logs and proxies, and it does not protect payload integrity.
        misconception: A secret in the URL is equivalent to a signed payload
    explanation: |
      Webhook signatures are computed over the exact bytes the sender transmitted. Capture the raw body before
      the framework parses it, verify with a constant-time comparison, and only then deserialise. Anything that
      reformats the payload first (parsing, re-encoding, trimming) can invalidate valid signatures.
    refs: [https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries]

  - id: D9-002
    version: 1
    type: multi
    subtopic: int.apis
    tags: [gov.identity]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      A security review of your webhook receiver notes that it verifies an HMAC signature on every request, yet an
      attacker who captures one valid delivery (body and signature) could resend it later and trigger the action
      again, such as opening a deployment ticket. Which changes close this gap?
    options:
      - text: "Sign a timestamp with the body and reject deliveries outside a short tolerance window"
        correct: true
        why: A captured request goes stale after a few minutes, and the attacker cannot alter the timestamp without breaking the signature.
      - text: "Record each delivery id for the length of the window and ignore ids already seen"
        correct: true
        why: It blocks replays inside the tolerance window, and it also absorbs the provider's own redelivery of the same event.
      - text: "Move the signature algorithm from SHA-256 to SHA-512 for stronger protection"
        why: A stronger hash makes forgery harder, but a replayed request carries a genuine signature of either kind.
        misconception: A stronger algorithm prevents replay
      - text: "Switch the signature comparison to a constant-time function to avoid timing leaks"
        why: This is good practice against timing attacks, but a replayed request is bit-for-bit valid and still passes.
        misconception: Timing-safe comparison also addresses replay
      - text: "Allow only the provider's published IP ranges to reach the webhook endpoint"
        why: A replay through a compromised or shared egress address, or from captured traffic inside the network, still passes the filter.
        misconception: Network filtering stops replayed requests
    explanation: |
      A signature proves origin and integrity, not freshness. Replay protection needs a signed timestamp with a short
      tolerance and, for exactness inside that window, a record of delivery ids. Both also make the handler safe
      against provider retries.

  - id: D9-003
    version: 1
    type: single
    subtopic: int.apis
    tags: [rag.ingestion]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A nightly job exports about 300,000 tickets from a vendor API using `?offset=N&limit=100`, sorted by
      `updated_at` descending. Tickets are edited while the job runs, and the resulting export contains duplicates
      and misses tickets that the vendor's own UI shows. What is the best remedy?
    options:
      - text: "Page with an opaque cursor (or keyset on updated_at and id) and checkpoint it after each page"
        correct: true
        why: A cursor anchors the position to a stable key rather than a row count, so edits no longer shift pages.
      - text: Raise the limit to the maximum page size so that fewer pages are fetched while the data moves
        why: Fewer pages shrink the exposure window, but every offset boundary can still shift when rows change.
        misconception: Bigger pages remove the offset drift problem
      - text: "Sort by `created_at` ascending, where new tickets land at the end, and keep using offsets"
        why: Inserts then land at the end, but deleted or re-sorted rows still shift offsets, and edits to older tickets are missed.
        misconception: An insert-only ordering makes offset paging safe
      - text: "Schedule the export for the quietest hour of the night and keep using offset paging"
        why: A quiet window lowers the error rate without removing it, and it breaks when volumes grow or time zones overlap.
        misconception: Low traffic makes offset paging reliable
    explanation: |
      Offset pagination is unstable when the underlying set changes between requests. Cursor or keyset pagination
      uses the last seen position (with a unique tiebreaker such as `id`), and persisting it lets a failed job resume.
      Prefer a provider's `updated_since` filter for incremental syncs where available.

  - id: D9-004
    version: 1
    type: single
    subtopic: int.apis
    tags: [int.resilience, agents.state]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      Clients call `POST /runs` to start an expensive agent run. When the response is lost to a network timeout,
      clients retry and the platform starts a second run, billing the customer twice. The API owner wants retries
      to remain possible. What should the endpoint support?
    options:
      - text: "Support an Idempotency-Key header and return the stored first result for any repeat"
        correct: true
        why: A retry carrying the same key resolves to the original run instead of creating another, with no change to client retry logic.
      - text: "Reject any new run with a 409 whenever the same user already has a run in progress"
        why: It blocks legitimate parallel runs from one user and does nothing for a retry that arrives after the first run has finished.
        misconception: A concurrency lock is the same as idempotency
      - text: "Treat requests with identical request bodies within five minutes as duplicates of each other"
        why: Two intentional runs with the same prompt would collapse into one, and the window is arbitrary.
        misconception: Identical payloads always mean a retry
      - text: "Tell clients not to retry POST calls and to poll for the run afterwards instead"
        why: There is no run id to poll for when the response never arrived, and it removes the safety net clients need.
        misconception: POST is unsafe to retry, so retries should not be offered
    explanation: |
      `POST` is not idempotent by definition, so retried creates need a client-supplied idempotency key that the server
      stores with the outcome. Scope keys per client, expire them after a day or so, and return the original response
      (or a conflict if the same key arrives with a different body).
    refs: [https://docs.stripe.com/api/idempotent_requests]

  - id: D9-005
    version: 1
    type: multi
    subtopic: int.apis
    tags: [gov.guardrails, int.resilience]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A platform team exposes a public GraphQL API so partners can fetch runs, steps and tool calls in whatever shape
      they like. Last week one partner's deeply nested query (runs, steps, tool calls, then runs again) saturated the
      database. The API already limits each partner to 600 requests per minute. Which measures address this risk?
    options:
      - text: Reject queries beyond a maximum depth and a computed complexity score
        correct: true
        why: Cost is a property of the query shape, and a static analysis of depth and breadth stops the nested pattern before execution.
      - text: Allow only pre-registered (persisted) queries for production partners
        correct: true
        why: Known queries can be load-tested and costed in advance, so unexpected shapes never reach the database.
      - text: Charge each request against the partner's quota in proportion to its computed cost
        correct: true
        why: One expensive query then consumes much more of the allowance than a cheap one, which the flat request limit ignores.
      - text: Lower the request limit from 600 to 60 per minute for every partner
        why: One heavy query can still do the damage within a single request, and well-behaved partners are throttled for no reason.
        misconception: Request count is a good proxy for load in GraphQL
      - text: Disable schema introspection so that partners cannot see how to nest types
        why: Partners know their data model from documentation, and hiding the schema does not constrain the queries they can write.
        misconception: Obscuring the schema is access control
      - text: Add a CDN cache in front of the endpoint to absorb repeated requests
        why: Heavy queries arrive as POST bodies that vary per partner, so they bypass shared caches and still reach the database.
        misconception: HTTP caching works for GraphQL traffic the way it does for REST
    explanation: |
      GraphQL moves query-shape control to the client, so cost has to be bounded on the server: depth and complexity
      limits, persisted queries for known clients, and cost-based rate limiting. Per-request limits alone cannot
      distinguish a cheap lookup from a fan-out query.
    refs: [https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html]

  - id: D9-006
    version: 1
    type: single
    subtopic: int.async
    difficulty: 1
    level: apply
    time_s: 90
    stem: |
      A queue delivers `case.created` events at least once to a consumer that inserts a row into the platform's
      own Postgres database and then acknowledges the message. After a worker crash between insert and
      acknowledge, the broker redelivers the event and the case appears twice. How should the consumer be made safe?
    options:
      - text: "Add a unique constraint on the producer's event id and treat a conflict as already done"
        correct: true
        why: The event id is stable across redeliveries, and the database enforces it atomically with the insert.
      - text: Turn on the broker's exactly-once mode and remove the duplicate handling from the consumer
        why: Broker-side settings cannot cover a crash between the consumer's external write and its acknowledgement.
        misconception: Exactly-once delivery by the broker gives exactly-once effects in the consumer
      - text: "Key de-duplication on the receipt handle the broker issues with each delivery attempt"
        why: A redelivery gets a new receipt handle, so the second copy would look new and be inserted again.
        misconception: Any identifier attached to a message is a stable de-duplication key
      - text: "Hash the event payload and skip any payload hash already seen within the last hour"
        why: Two distinct events can carry identical content and be dropped, and a duplicate redelivered after the window passes through.
        misconception: Identical content within a time window identifies a duplicate
    explanation: |
      Most brokers guarantee at-least-once delivery, so consumers must be idempotent. Use an identifier fixed by
      the producer and record it atomically with the side effect (unique constraint, or an upsert). Identifiers
      generated by the transport, such as receipt handles, change with each delivery.

  - id: D9-007
    version: 1
    type: single
    subtopic: int.async
    difficulty: 1
    level: apply
    time_s: 70
    stem: |
      A document-processing queue feeds LLM workers. One uploaded file is corrupt, and the worker throws on it
      every time. The broker redelivers the message immediately, one shard of the queue is stuck behind it, and
      other customers' documents are delayed. What is the best fix?
    options:
      - text: "Cap delivery attempts, then park the message in a dead-letter queue with an alert"
        correct: true
        why: The bad message stops blocking others, remains available for diagnosis, and can be replayed after a fix.
      - text: "Increase the visibility timeout so that the failing message is not redelivered so quickly"
        why: This only slows the redelivery loop; the message still fails every attempt and holds the shard longer.
        misconception: Slower redelivery resolves a deterministic failure
      - text: Catch every exception in the worker and acknowledge the message so it leaves the queue
        why: Failures disappear silently and the customer's document is lost with no trace or retry path.
        misconception: Acknowledging on error is graceful handling
      - text: "Send the failing message to the back of the queue so other messages are processed first"
        why: The message fails again whenever it comes up, consuming attempts and worker time, and it keeps blocking the shard with every retry cycle.
        misconception: Moving a poison message to the back of the line contains it
    explanation: |
      A message that always fails (a poison message) must not block the stream. Bound retries, then park it in a
      dead-letter queue, alert on its depth and keep a way to redrive messages once the cause is fixed.

  - id: D9-008
    version: 1
    type: single
    subtopic: int.async
    tags: [agents.state, deploy.compute]
    difficulty: 1
    level: apply
    time_s: 70
    stem: |
      An agent that reviews contracts takes between 2 and 10 minutes per request. The existing synchronous REST
      endpoint sits behind a gateway with a 60-second timeout, so long requests fail with 504 even though the work
      itself succeeds. What is the right API change?
    options:
      - text: "Return 202 with a job id immediately and expose status and result endpoints"
        correct: true
        why: Decoupling submission from completion removes the dependency on the gateway timeout, and clients can poll or receive a callback.
      - text: "Raise the gateway timeout for this route to 15 minutes so that the call can complete"
        why: Long-held connections are fragile to client, proxy and load-balancer limits, and they tie up capacity while waiting.
        misconception: A longer timeout makes a long synchronous call reliable
      - text: Send periodic keep-alive bytes on the open connection until the agent finishes
        why: Intermediaries and clients may still cut idle or slow connections, and a disconnect loses the result with no way to recover it.
        misconception: Keep-alives make a long-lived HTTP request durable
      - text: Split each request into 50-second pieces that the client must call in sequence
        why: It pushes orchestration and state onto every client, and the agent's work does not divide cleanly into timed pieces.
        misconception: A long task can be sliced by wall-clock time
    explanation: |
      For work that outlasts a request, use an asynchronous job pattern: accept, return an identifier, process in the
      background, and let clients poll a status resource or receive a webhook. Results survive client disconnects.

  - id: D9-009
    version: 1
    type: single
    subtopic: int.async
    tags: [agents.state]
    difficulty: 2
    level: analyze
    time_s: 95
    stem: |
      A Jira sync service processes issue events from a topic with 12 parallel consumers. For some issues, an
      `updated` event is applied after the `closed` event that followed it, leaving the mirrored issue open.
      Overall throughput must stay high. What is the best change?
    options:
      - text: "Use the issue key as the partition key so each issue's events stay in order"
        correct: true
        why: Order is preserved where it matters (per issue) while different issues are still processed in parallel.
      - text: Run a single consumer for the whole topic so that events are handled in arrival order
        why: It restores order but gives up the parallelism and throughput the service needs.
        misconception: Global ordering is required to keep per-entity order
      - text: Retry each failed update a few times in case the earlier event has not landed yet
        why: The events succeed out of order rather than failing, so a retry never triggers.
        misconception: Retries fix ordering problems
      - text: Keep the parallel consumers and sort each batch by event timestamp before applying it
        why: A late event arriving in a later batch still gets applied after the closure, and clocks across producers can disagree.
        misconception: Sorting within a batch gives a total order
    explanation: |
      Ordering guarantees are per partition (or per message group), not per topic. Choose a key that matches the
      entity whose events must stay ordered and let consumers scale across keys. A version or sequence check in the
      consumer guards against the remaining edge cases such as reprocessing after a failure.

  - id: D9-010
    version: 1
    type: single
    subtopic: int.async
    tags: [agents.state, int.enterprise-devex]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      An onboarding agent provisions a customer workspace by creating a GitHub repository, a Jira project, and a
      Slack channel in that order. When the Slack call fails permanently (the workspace is at its channel quota),
      the first two resources remain and the customer is half onboarded. These are three independent SaaS APIs.
      Which approach is the most appropriate?
    options:
      - text: "Model the steps as a saga with compensating actions, run by a durable workflow engine"
        correct: true
        why: Each completed step can be undone or retried idempotently, and the recorded state survives restarts and tells operators where it stopped.
      - text: "Wrap the three calls in one distributed transaction using two-phase commit across them"
        why: Public SaaS APIs do not take part in a transaction coordinator, so atomic commit across them is not available.
        misconception: Distributed transactions can span arbitrary external APIs
      - text: "Retry the Slack call indefinitely with exponential backoff until it finally succeeds"
        why: A permanent quota failure never succeeds, so the customer waits forever and the partially built workspace stays inconsistent.
        misconception: Persistent retrying converges on success
      - text: "Log the failure and have an engineer clean up the leftover resources each week"
        why: It leaves customers half onboarded for days, depends on manual work, and does not scale with volume.
        misconception: Manual cleanup is an acceptable consistency model
    explanation: |
      Across independent systems, atomic transactions are unavailable; a saga replaces them with local steps and
      compensations (archive the repo, close the project). Run it on durable state so progress survives crashes, and
      make every step and every compensation idempotent so they can be retried safely.

  - id: D9-011
    version: 1
    type: multi
    subtopic: int.async
    tags: [int.resilience, obs.cost]
    difficulty: 2
    level: evaluate
    time_s: 110
    stem: |
      An ingestion service enqueues thousands of document-summarisation jobs per hour. Workers call an LLM API with a
      shared tokens-per-minute limit that interactive users also depend on. During bulk loads the queue grows, 429
      errors rise, and workers autoscaled by queue depth make it worse. Which measures help?
    options:
      - text: Cap worker concurrency with a limiter shared by all workers and sized from the token budget
        correct: true
        why: Total call rate is held under the provider limit regardless of how many workers exist, so 429s fall.
      - text: Reserve part of the budget for interactive traffic and run bulk jobs at lower priority
        correct: true
        why: Users stay responsive during loads, and bulk work uses whatever capacity remains.
      - text: Let the queue absorb bursts, and alert on the age of the oldest message rather than on depth
        correct: true
        why: Age reflects the delay customers actually see, and the queue is designed to buffer a backlog safely.
      - text: "Autoscale workers on queue depth so that the backlog clears sooner than it does now"
        why: More workers send more requests into the same rate limit, which multiplies the 429s and retries.
        misconception: More consumers drain a queue faster whatever the downstream limit is
      - text: "Discard the oldest messages once the queue passes a fixed length to bound the backlog"
        why: Dropped summaries are lost work, and the same customers submit them again, adding load.
        misconception: Shedding queued work is free for batch jobs
      - text: "Remove retries from the workers so that failed calls stop adding more load"
        why: Transient errors then become permanent failures, and the lost jobs need manual replay.
        misconception: Turning off retries is the right response to rate limiting
    explanation: |
      Backpressure should hold the system under the scarcest downstream limit. Control concurrency with that limit
      in mind, protect latency-sensitive traffic with reserved capacity and priorities, and use the queue as a buffer
      while monitoring how long work waits.

  - id: D9-012
    version: 1
    type: single
    subtopic: int.async
    tags: [agents.state]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A queue worker pulls code-review jobs and calls an LLM agent. Jobs take between 3 and 12 minutes, and the
      queue's visibility timeout (lease) is 5 minutes. Operators see some jobs executed by two workers at once,
      producing duplicate comments on pull requests. The broker is working as documented. What is the root cause
      and fix?
    options:
      - text: "The lease expires mid-job; renew it while working and make the job idempotent"
        correct: true
        why: Redelivery after lease expiry is expected behaviour, so renewing the lease while working and guarding side effects fixes both causes.
      - text: The broker is delivering twice by mistake; switch to a FIFO queue to enforce single delivery
        why: Ordering and deduplication windows in FIFO queues do not stop a lease from expiring during a slow job.
        misconception: FIFO queues guarantee that a message is processed only once
      - text: Too few workers are running; add more workers so jobs finish before the lease ends
        why: Parallelism does not shorten a single job's run time, and each extra worker adds more chances for overlap.
        misconception: Adding capacity shortens an individual job
      - text: The model is too slow; add a hard 5-minute timeout to every job so it always finishes inside the lease
        why: Jobs that legitimately need 12 minutes would be killed and retried repeatedly, wasting spend without finishing.
        misconception: Fitting the job to the lease is simpler than managing the lease
    explanation: |
      A visibility timeout is a lease. If processing outlives it, the broker assumes the worker died and redelivers.
      Set the lease above the worst-case duration or heartbeat to extend it, and keep handlers idempotent because
      overlapping or repeated execution can still occur.

  - id: D9-013
    version: 1
    type: single
    subtopic: int.async
    tags: [data.modeling]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A case-management service saves a case to its database and then publishes `case.created` to a broker in the
      same request handler. Occasionally the database commit succeeds, the process dies before publishing, and the
      downstream agent never hears about the case. The team cannot rely on the broker supporting transactions
      shared with the database. What is the most robust design?
    options:
      - text: "Write the event to an outbox table in the same transaction; a relay publishes it"
        correct: true
        why: The case and its event commit or fail together, and a crash after commit leaves the event waiting for the relay.
      - text: Publish first and write to the database afterwards so that no event is ever missed
        why: It reverses the failure, because a crash after publishing yields an event about a case that was never saved.
        misconception: Reordering the two writes removes the inconsistency
      - text: Catch publish errors and retry the publish in the request handler a few times
        why: A process crash between commit and publish skips the retry entirely, and in-memory retries are lost with it.
        misconception: In-process retries cover process failure
      - text: "Use two-phase commit between the database and the broker for every request"
        why: It needs both systems to support the protocol and adds blocking failure modes, so most brokers and managed databases do not offer it.
        misconception: Atomic commit across systems is routinely available
    explanation: |
      The dual-write problem arises whenever one request writes to two systems. The transactional outbox makes
      the database the single source of truth: events are written atomically with the data and published
      asynchronously, giving at-least-once delivery that consumers must handle idempotently.

  - id: D9-014
    version: 1
    type: single
    subtopic: int.resilience
    tags: [int.apis]
    difficulty: 2
    level: apply
    time_s: 85
    stem: |
      Two hundred workers call an LLM API. When they hit 429 responses, each retries after a fixed 2 seconds, and the
      resulting synchronised waves trigger more 429s. The responses include a `Retry-After` header. What retry
      policy should the client adopt?
    options:
      - text: "Honour `Retry-After`, then add exponential backoff with random jitter up to a cap"
        correct: true
        why: It respects the server's hint and spreads retries so workers stop arriving in lockstep.
      - text: "Double the delay on each attempt up to 60 seconds, with no randomness added"
        why: All workers that failed together still retry together at each step, so the waves remain, just further apart.
        misconception: Exponential growth alone prevents synchronised retries
      - text: Retry immediately up to five times so that most requests succeed before the limit window resets
        why: Immediate retries add load while the limit is exhausted, extending the period of rejections for everyone.
        misconception: Fast retries recover capacity sooner
      - text: "Lengthen the fixed delay from 2 to 10 seconds for every retry attempt"
        why: A fixed delay still synchronises the workers and also adds latency for the many requests that would succeed sooner.
        misconception: A longer constant delay is equivalent to backoff
    explanation: |
      Retries should honour the server's `Retry-After`, grow exponentially up to a cap, and include jitter so
      clients desynchronise. Jitter matters most when many clients fail at the same moment. Pair it with a shared
      limiter to avoid hitting the limit at all.
    refs: [https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/]

  - id: D9-015
    version: 1
    type: single
    subtopic: int.resilience
    tags: [llm.model-selection, deploy.compute]
    difficulty: 1
    level: apply
    time_s: 90
    stem: |
      A support copilot calls one LLM provider with a 60-second timeout. During a provider incident, every request
      hangs until timeout, the service's request threads are exhausted, and even the health-check and FAQ pages stop
      responding. The business wants customers to still get some help during provider outages. What pattern fits?
    options:
      - text: "A circuit breaker that fails fast after repeated errors, with a fallback path"
        correct: true
        why: Threads are freed immediately, and the fallback (backup model, cached answer, or handoff to a human) keeps serving users.
      - text: "Raise the timeout from 60 to 120 seconds so that slow provider responses can complete"
        why: Requests that would fail anyway hold their threads twice as long, deepening the exhaustion.
        misconception: Longer waits make an unhealthy dependency usable
      - text: "Retry each failed call up to five times before returning an error to the customer"
        why: Retries multiply the load and the time each request ties up a thread during the outage.
        misconception: More retries improve availability during an outage
      - text: "Add more instances of the service behind the load balancer to get more request threads"
        why: Each new thread is consumed by the same hanging calls, so capacity is exhausted a little later at more cost.
        misconception: Scaling out compensates for a failing dependency
    explanation: |
      A circuit breaker stops calling a dependency that is failing, which protects the caller's resources and gives
      fast, predictable behaviour. Pair it with a fallback and a half-open state that tests recovery. Bulkheads
      (separate pools) keep unrelated endpoints responsive.

  - id: D9-016
    version: 1
    type: multi
    subtopic: int.resilience
    tags: [obs.troubleshooting]
    difficulty: 3
    level: analyze
    time_s: 110
    stem: |
      A request passes through an API gateway, an orchestration service and an LLM SDK, and each layer retries
      timeouts up to 3 times. When the model backend slows down, traffic to it jumps by more than 20 times and
      recovery takes hours. Which changes reduce this retry amplification?
    options:
      - text: Retry at a single layer, closest to the failing call, and let the others fail fast
        correct: true
        why: Multiplied retry counts across layers become one bounded count.
      - text: Propagate a deadline so that no layer retries once the caller's remaining time is spent
        correct: true
        why: Work that the caller has already abandoned is not retried, which removes a large share of the surplus load.
      - text: Limit retries to a small fraction of recent calls with a shared budget
        correct: true
        why: Retry traffic stays proportional to normal traffic and cannot grow into a storm during a degradation.
      - text: Raise each layer's backoff delay so that its retries are spread more thinly
        why: Delays spread retries over time but the total number of attempts remains multiplicative.
        misconception: Slower retries are fewer retries
      - text: Remove the timeouts so that slow calls complete rather than being retried
        why: Calls then hang indefinitely and exhaust connection pools, so the failure moves rather than disappearing.
        misconception: Removing timeouts removes the cause of retries
    explanation: |
      Layered retries multiply: three layers with three retries each can issue up to 4 x 4 x 4 = 64 attempts per
      user call. Keep retries at one layer, propagate deadlines, and cap retry volume with a budget.
    refs: [https://sre.google/sre-book/handling-overload/]

  - id: D9-017
    version: 1
    type: single
    subtopic: int.resilience
    tags: [llm.fundamentals, obs.cost]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      Your LLM provider limits the account to 1,000 requests and 2 million tokens per minute. Batch jobs send
      requests whose size varies from 500 to 40,000 tokens (input plus maximum output). A client-side limiter set to
      1,000 requests per minute still triggers frequent 429 errors whenever large requests cluster. How should the
      limiter be changed?
    options:
      - text: "A token bucket charged by estimated tokens, shared across workers and reconciled with actual usage"
        correct: true
        why: The binding constraint is tokens, so cost-weighted admission keeps the total under the limit however sizes vary.
      - text: Keep the request-count limiter and lower it to 300 per minute, which leaves ample slack for large requests
        why: It wastes capacity for small requests and still fails if enough large requests arrive in the same minute.
        misconception: A lower request cap is a safe proxy for a token limit
      - text: "Give each worker a fixed sleep between calls that divides the limit by the worker count"
        why: Per-worker sleeps ignore request size and the number of active workers, so combined traffic can still exceed the limit.
        misconception: Local pacing in each worker equals a global rate limit
      - text: Remove client-side limiting and rely on 429 responses with backoff to find the right rate
        why: It works eventually but wastes calls, adds latency, and rate-limit errors can also affect interactive traffic on the same account.
        misconception: Reactive backoff is as good as admission control
    explanation: |
      When a provider limits several dimensions (requests and tokens), enforce each of them on the client, charging
      requests by their estimated cost and correcting with actual usage. Share the limiter across workers, or the
      per-process limits add up to more than the account's limit.

  - id: D9-018
    version: 1
    type: single
    subtopic: int.resilience
    tags: [int.enterprise-devex, agents.state]
    difficulty: 2
    level: analyze
    time_s: 95
    stem: |
      To stay within Jira's rate limits, an assistant caches issue details for one hour. Users now see stale statuses,
      and last week the agent transitioned an issue based on a cached state that someone had changed minutes earlier.
      Reads must stay cheap. What is the best design?
    options:
      - text: "Invalidate on Jira webhook events and re-read with a version check before any write"
        correct: true
        why: Reads stay cheap while writes are protected by fresh state, so the agent cannot act on a stale view.
      - text: "Lengthen the cache lifetime to 24 hours to cut Jira API calls further"
        why: It lowers API usage further but makes the stale reads, and the risk of acting on them, much worse.
        misconception: Rate-limit pressure justifies longer staleness
      - text: "Remove the cache entirely and fetch the issue from Jira again on every single read"
        why: It restores freshness but reintroduces the rate-limit problem the cache solved, and reads that need no freshness pay for it too.
        misconception: Caching is unsafe for mutable data
      - text: Keep the one-hour cache but show users the time at which each value was fetched
        why: It improves transparency for people, but the agent still acts on stale state when it writes.
        misconception: Disclosing staleness makes stale data safe to act on
    explanation: |
      Match consistency to the use. Reads can tolerate bounded staleness, so cache them and invalidate on change
      events; writes and decisions that depend on current state should re-check at the source, ideally with an
      optimistic concurrency token (ETag or version) so a conflicting change is detected.

  - id: D9-019
    version: 1
    type: single
    subtopic: int.enterprise-devex
    tags: [gov.identity]
    difficulty: 1
    level: apply
    time_s: 90
    stem: |
      An internal tool reads pull requests and posts review comments across 40 repositories in a customer's GitHub
      organisation. The prototype uses a classic personal access token from the developer who built it, and rate-limit
      errors have started. The customer's security team asks for a production design. What do you propose?
    options:
      - text: "A GitHub App installed on the org with minimal permissions and short-lived tokens"
        correct: true
        why: Access is scoped, tokens expire, the integration does not depend on one person, and rate limits scale with the installation.
      - text: A shared service-account user with a classic personal access token that has the full repo scope
        why: The token is long-lived, over-privileged, consumes a seat, and shares one user's rate limit.
        misconception: A shared bot user is equivalent to a purpose-built integration identity
      - text: An OAuth app that acts as each developer who signs in, with each person's own token
        why: This fits actions taken on behalf of a user, but this is a background service that needs to act without anyone present.
        misconception: User-delegated OAuth suits every integration
      - text: A deploy key on each repository, used for both git operations and API calls
        why: Deploy keys authorise git access to one repository only and cannot call the REST API for comments.
        misconception: SSH deploy keys are general API credentials
    explanation: |
      For background integrations with an organisation, prefer a GitHub App: fine-grained permissions chosen by the
      installer, short-lived installation tokens, webhooks, and rate limits that scale with the installation. Use
      user-to-server tokens only when an action must be attributed to, and limited by, a specific user.
    refs: [https://docs.github.com/en/apps/creating-github-apps/about-creating-github-apps/about-creating-github-apps]

  - id: D9-020
    version: 1
    type: single
    subtopic: int.enterprise-devex
    tags: [agents.tools-mcp]
    difficulty: 2
    level: evaluate
    time_s: 95
    stem: |
      A manufacturer's 20-year-old ERP exposes a SOAP service with fields like `STAT_CD = "07"` and dates as
      `YYYYMMDD` strings. You are building agent tools that need order status. The ERP team will not change the
      service. How should the agent connect to it?
    options:
      - text: "Put an adapter in front that maps codes and formats into a clean domain model for the tools"
        correct: true
        why: Legacy quirks stay in one place, the tool schema stays stable and readable, and the mapping is testable and reviewable.
      - text: Expose the SOAP operations directly as tools and describe the status codes in the tool descriptions
        why: Legacy codes leak into prompts and tool schemas, and any ERP change forces prompt changes across every agent.
        misconception: Documenting a legacy interface in prompts is sufficient integration
      - text: Let the model interpret the raw codes and date strings from the responses on its own each time
        why: Interpretation becomes nondeterministic and cannot be audited, and mistakes show up as wrong answers to users.
        misconception: LLMs can reliably infer undocumented code tables
      - text: "Re-platform the ERP's order module first, then build the agent tools against the new system"
        why: A multi-year migration is out of proportion to the need and blocks delivery of value now.
        misconception: Legacy systems must be replaced before they can be integrated
    explanation: |
      An anti-corruption layer (adapter) translates between a legacy model and the model your system wants,
      so the legacy design does not leak into new components. Codes, formats and quirks are mapped once, in tested
      code, and agents see stable, meaningful fields.

  - id: D9-021
    version: 1
    type: single
    subtopic: int.enterprise-devex
    tags: [int.async, agents.state]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A Slack slash command `/summarize-incident` triggers an agent that needs about 40 seconds to finish. Users
      see a Slack timeout error even though the summary is eventually produced by the backend. What is the
      correct way to handle the interaction?
    options:
      - text: "Acknowledge within 3 seconds, work in the background, post the result via the response URL"
        correct: true
        why: Slack requires a quick acknowledgement, and the delayed response URL or message API delivers the result when it is ready.
      - text: "Increase the web server's response timeout for this route to 60 seconds to cover the run"
        why: Slack gives up on its side after about 3 seconds, so server-side timeouts have no effect on the error.
        misconception: The server's timeout controls how long the platform waits
      - text: "Stream partial tokens back in the HTTP response as the agent produces them, line by line"
        why: Slack's command acknowledgement is not a streaming channel and it needs a response within seconds.
        misconception: Streaming the HTTP response satisfies the platform's timeout
      - text: "Switch to a smaller, faster model and tune the agent to finish inside three seconds"
        why: Even the fastest agent run is unlikely to finish in three seconds with tool calls, and the next slow day will fail again.
        misconception: Optimising latency is the right answer to a protocol deadline
    explanation: |
      Chat platforms expect an acknowledgement within a few seconds. Treat the incoming event as a trigger: respond
      immediately, enqueue the work, and post the result later through the callback URL or the API. The same
      pattern applies to webhooks from other SaaS products.
    refs: [https://api.slack.com/interactivity/slash-commands]

  - id: D9-022
    version: 1
    type: multi
    subtopic: int.enterprise-devex
    tags: [int.apis, int.async]
    difficulty: 2
    level: evaluate
    time_s: 105
    stem: |
      You are keeping an internal work-item index in sync with a customer's Azure DevOps (or Jira) project. The
      business wants changes visible within a minute and the index to be correct, and the vendor API enforces rate
      limits. Which elements belong in the design?
    options:
      - text: "Subscribe to service hooks for work-item events and enqueue each one for processing"
        correct: true
        why: Push delivery gives sub-minute latency without spending API quota on polling.
      - text: "Run a periodic reconciliation of items changed since a stored cursor, repairing differences"
        correct: true
        why: Webhooks can be dropped or delayed, so a low-frequency sweep restores correctness for anything missed.
      - text: "Poll the full item list every 10 seconds to guarantee the freshest possible view"
        why: Full polling burns the rate limit quickly and gets slower as the project grows.
        misconception: Aggressive polling is the dependable route to freshness
      - text: "Rely on webhooks alone, since the vendor retries failed deliveries by itself"
        why: Vendor retries are limited in time and number, and delivery can still be lost during your own outages.
        misconception: Webhooks alone guarantee eventual delivery of every event
      - text: "Disable rate-limit handling because webhook-driven designs do not consume API quota"
        why: Fetching details for each event and running reconciliation still call the API, so 429 handling remains necessary.
        misconception: Event-driven integrations never hit API limits
    explanation: |
      Combine push and pull: webhooks for latency, a cursor-based sweep for correctness, and idempotent processing
      to handle duplicates. The receiver should acknowledge quickly and process asynchronously, and API calls
      still need rate-limit handling.

  - id: D9-023
    version: 1
    type: single
    subtopic: int.enterprise-devex
    tags: [role.productization]
    difficulty: 2
    level: evaluate
    time_s: 95
    stem: |
      Your FDE team has deployed a document-intake agent at five customers. Each deployment began as a copy of the
      repository with customer-specific edits, and bug fixes now have to be ported by hand. The team wants a
      sustainable structure that still allows real per-customer differences. What do you propose?
    options:
      - text: "One shared codebase with typed, validated per-customer config and defined extension points"
        correct: true
        why: Fixes ship once to everyone, and customer differences live in reviewable config and plug-ins rather than forks.
      - text: "Keep per-customer forks and merge the upstream changes into each of them every month"
        why: Merge conflicts and drift accumulate with each customer, and fixes reach customers at different times.
        misconception: Forks are the safest way to isolate customer differences
      - text: "Add per-customer if branches in the main code for each variation as it comes up"
        why: The core fills with special cases, every change risks other customers, and the branching is hard to test.
        misconception: Conditionals in core code are equivalent to configuration
      - text: "Move all differences into free-form environment variables set by whoever does the deploy"
        why: Without a schema or validation, mistakes surface only at runtime, and the settings cannot be reviewed or versioned reliably.
        misconception: Unstructured settings are as good as designed configuration
    explanation: |
      Keep a single product core and push customer variation into validated configuration, adapters and
      extension points. This is the same discipline as separating a platform from customer-specific
      integration code, and it lets field learnings flow back into the product.

  - id: D9-024
    version: 1
    type: numeric
    subtopic: int.async
    tags: [int.resilience, obs.cost]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 150
    stem: |
      After an outage, 9,000 document-summarisation jobs are queued. Each job consumes 6,500 tokens (input plus
      output) of LLM capacity. The provider allows 1.2 million tokens per minute and 500 requests per minute (one
      request per job). Interactive users must keep 25% of both limits free. Ignoring ramp-up, how many minutes
      will it take the workers to drain the queue at the maximum allowed rate?
    answer: {value: 65, tolerance: 1, tolerance_type: abs, unit: "minutes"}
    work: |
      Capacity available to batch work: 75% of each limit.
      Token limit: 0.75 * 1,200,000 = 900,000 tokens per minute, which is 900,000 / 6,500 = 138.5 jobs per minute.
      Request limit: 0.75 * 500 = 375 jobs per minute.
      The token limit binds (138.5 < 375), so the rate is 138.46 jobs per minute.
      Total tokens = 9,000 * 6,500 = 58,500,000. Time = 58,500,000 / 900,000 = 65 minutes.
    explanation: |
      Common mistakes: using the request limit (9,000 / 375 = 24 minutes), forgetting the interactive reserve
      (48.75 minutes), or applying the reserve to only one limit. Find the binding constraint first, then divide.

  - id: D9-025
    version: 1
    type: numeric
    subtopic: int.resilience
    competencies: [x.estimation]
    difficulty: 1
    level: apply
    time_s: 150
    stem: |
      A client retries failed calls up to 6 times using exponential backoff with full jitter: before retry
      number n (n = 1, 2, ...) it sleeps a uniformly random time between 0 and min(cap, base * 2^(n-1)). The base
      is 0.5 seconds and the cap is 8 seconds. If all 6 retries are used, what is the expected total time spent
      sleeping, in seconds?
    answer: {value: 11.75, tolerance: 0.1, tolerance_type: abs, unit: "seconds"}
    work: |
      Upper bounds for retries 1 to 6: 0.5, 1, 2, 4, 8 (0.5 * 2^4), and min(8, 16) = 8 for the sixth.
      Sum of bounds = 0.5 + 1 + 2 + 4 + 8 + 8 = 23.5 seconds.
      A uniform random value on [0, b] has mean b/2, so the expected total is 23.5 / 2 = 11.75 seconds.
    explanation: |
      Common mistakes: reporting the worst case (23.5 s), forgetting the cap on retry 6 (giving 31.5 / 2 = 15.75), or
      halving only the last term. Full jitter halves the average wait compared with plain backoff while spreading
      clients out, but the worst case remains the sum of the capped bounds.

  - id: D9-026
    version: 1
    type: open
    subtopic: int.async
    tags: [int.apis, comms.stakeholders]
    competencies: [x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 540
    stem: |
      Last night your Jira-integration service created 214 duplicate tickets for a customer's support team. The
      customer's engineering manager has written: "This is the second integration bug this quarter. Explain exactly
      what happened and why I should trust the fix." Your investigation shows that Jira's webhook delivery timed
      out because your endpoint called the LLM before responding, Jira retried the delivery, and your handler
      created a ticket for each delivery. Write your reply.
    rubric:
      - criterion: Direct, accountable opening
        points: 2
        guidance: 2 if it opens with a plain statement of impact and ownership (what happened, that it was the service's fault, current state) without blaming the vendor; 1 if accountable but buried or vague; 0 if defensive or blames Jira.
      - criterion: Accurate root cause in plain language
        points: 3
        guidance: 3 if it explains that slow processing before acknowledging caused redelivery and that the handler was not safe to run twice, in terms a manager can follow; 2 if only one of the two causes; 1 if generic; 0 if wrong or absent.
      - criterion: Fix addresses both layers and is verifiable
        points: 3
        guidance: 3 if it proposes acknowledging quickly and processing from a queue, and de-duplication by event id or an idempotency key, with a named verification (replay test with duplicate deliveries, load test); 2 if it covers one layer well; 1 if generic; 0 if only more monitoring or apology.
      - criterion: Customer remediation and trust-building
        points: 2
        guidance: 2 if it offers concrete cleanup of the 214 tickets, an alert for duplicate rate, and a time-bound follow-up or review; 1 if one of these; 0 if none.
    model_answer: |
      You are right to be frustrated, and this one is on us. Last night our service created 214 duplicate tickets
      in your support project. I have already closed the duplicates (nothing was deleted), and I will send you the list by noon so
      your team can confirm nothing legitimate was removed.

      What happened: when Jira sends us an event, it expects an answer within a few seconds. Our endpoint was calling
      the language model before answering, so Jira treated the delivery as failed and sent it again. Our code then
      created a new ticket for every delivery instead of recognising that it had already handled the event. Two
      weaknesses combined: we answered too slowly, and we were not safe against being told the same thing twice.

      The fix has two parts. First, the endpoint will acknowledge immediately and put the event on a queue; the model
      work happens afterwards. Second, every event carries an identifier, and we will record it with the ticket so a
      repeat delivery does nothing. Both are standard for webhook receivers and each protects against the other failing.

      To let you verify it rather than trust me: before Friday I will run a test that sends each event three times and
      slows the model down, and we will share the result. We are also adding an alert when more than a handful of
      tickets are created in a minute. I would like to walk you through this on a 20-minute call this week, and I will
      follow up with a written review of the quarter's two incidents.
    max_chars: 2500

  - id: D9-027
    version: 1
    type: code
    subtopic: int.apis
    tags: [gov.guardrails, int.async]
    competencies: [x.python]
    difficulty: 3
    level: apply
    time_s: 780
    stem: |
      Implement `verify_webhook(secret, timestamp, body, signature_header, now, tolerance_s=300)` for a receiver of
      signed webhooks.

      - The sender signs the string `f"{timestamp}.{body}"` (UTF-8 encoded) with HMAC-SHA256 using the shared
        secret and sends the lower-case hex digest in the header as `v1=<hex>`.
      - `signature_header` may contain several comma-separated entries (for example during secret rotation, such as
        `v1=aaa, v1=bbb`). Ignore whitespace around entries and ignore entries that do not start with `v1=`.
        The request is valid if any `v1=` entry matches.
      - `timestamp` is a string of integer seconds. Return `False` if it is not an integer or if it differs from `now`
        by more than `tolerance_s` seconds (in either direction).
      - Compare signatures in constant time. Return a `bool`; never raise for malformed input.
    code:
      function: verify_webhook
      starter: |
        import hmac
        import hashlib


        def verify_webhook(secret: str, timestamp: str, body: str, signature_header: str,
                           now: int, tolerance_s: int = 300) -> bool:
            ...
      reference: |
        import hmac
        import hashlib


        def verify_webhook(secret, timestamp, body, signature_header, now, tolerance_s=300):
            try:
                ts = int(timestamp)
            except (TypeError, ValueError):
                return False
            if abs(now - ts) > tolerance_s:
                return False
            expected = hmac.new(secret.encode("utf-8"), f"{timestamp}.{body}".encode("utf-8"),
                                hashlib.sha256).hexdigest().encode("utf-8")
            ok = False
            for part in (signature_header or "").split(","):
                part = part.strip()
                if part.startswith("v1="):
                    if hmac.compare_digest(part[3:].encode("utf-8"), expected):
                        ok = True
            return ok
      examples:
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v1=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1700000100]
          expected: true
      tests:
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"closed\"}", "v1=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1700000100]
          expected: false
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v1=b7b647432d3f213e729d02b983463892e1795a33703adf73a043f0816a9245ff", 1700000100]
          expected: false
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v1=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1700000300]
          expected: true
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v1=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1700000301]
          expected: false
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v1=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1699999600]
          expected: false
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v1=b7b647432d3f213e729d02b983463892e1795a33703adf73a043f0816a9245ff, v1=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1700000050]
          expected: true
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v0=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1700000050]
          expected: false
        - args: ["whsec_test", "1700000000", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "", 1700000050]
          expected: false
        - args: ["whsec_test", "abc", "{\"id\":\"evt_1\",\"action\":\"opened\"}", "v1=21d5d8cbc2bc45f4de792b3b6b0645cf50e6ebfd7fb968b4ef06ff7b016d9637", 1700000050]
          expected: false
        - args: ["whsec_test", "1700000000", "{\"msg\":\"café\"}", "v1=fca219104ddc9ed3beb1648f545bfafdaf8eb504a4f3e5d47eb17c64b3b367ef", 1700000010]
          expected: true
        - args: ["whsec_test", "1700000000", "", "v1=5967f3c560522fa40cf2876ebc3c3a08551dd6959aaade3b413460591895bdcc", 1700000010]
          expected: true
        - kwargs: {secret: "whsec_test", timestamp: "1700000000", body: "", signature_header: "v1=5967f3c560522fa40cf2876ebc3c3a08551dd6959aaade3b413460591895bdcc", now: 1700000011, tolerance_s: 10}
          expected: false
      timeout_s: 5
    explanation: |
      A correct receiver checks freshness (timestamp inside a tolerance window) and authenticity (HMAC over the exact
      signed string), and compares digests with `hmac.compare_digest` to avoid timing leaks. Accepting several
      `v1=` entries allows secret rotation without downtime. Combine this with a record of seen delivery ids to stop
      replays inside the window.
    refs: [https://docs.python.org/3/library/hmac.html]

  - id: D9-028
    version: 1
    type: code
    subtopic: int.async
    tags: [int.apis]
    competencies: [x.python]
    difficulty: 2
    level: apply
    time_s: 600
    stem: |
      A queue delivers account-balance events at least once: the same event may arrive several times, in the same
      batch or in a later one. Implement `apply_events(events, processed_ids)`.

      - `events` is a list of dicts with keys `id` (str), `account` (str) and `delta` (int).
      - `processed_ids` is a list of event ids that were already applied in earlier batches.
      - Apply each event at most once: skip an event whose id is in `processed_ids` or was already seen earlier in
        this batch (the first occurrence wins, even if a later duplicate carries a different `delta`).
      - Return a dict `{"balances": {...}, "processed_ids": [...]}`. `balances` maps each account that had at least
        one applied event to the sum of its applied deltas (these are changes for this batch, not totals).
        `processed_ids` is the sorted list of all ids from `processed_ids` and the events newly applied.
    code:
      function: apply_events
      starter: |
        def apply_events(events: list[dict], processed_ids: list[str]) -> dict:
            ...
      reference: |
        def apply_events(events, processed_ids):
            seen = set(processed_ids)
            balances = {}
            for ev in events:
                if ev["id"] in seen:
                    continue
                seen.add(ev["id"])
                balances[ev["account"]] = balances.get(ev["account"], 0) + ev["delta"]
            return {"balances": balances, "processed_ids": sorted(seen)}
      examples:
        - args:
            - [{"id": "e1", "account": "a", "delta": 5}, {"id": "e1", "account": "a", "delta": 5}, {"id": "e2", "account": "b", "delta": -2}]
            - []
          expected: {"balances": {"a": 5, "b": -2}, "processed_ids": ["e1", "e2"]}
      tests:
        - args: [[], []]
          expected: {"balances": {}, "processed_ids": []}
        - args:
            - [{"id": "e1", "account": "a", "delta": 5}, {"id": "e3", "account": "a", "delta": 7}]
            - ["e1"]
          expected: {"balances": {"a": 7}, "processed_ids": ["e1", "e3"]}
        - args:
            - [{"id": "e1", "account": "a", "delta": 5}, {"id": "e1", "account": "a", "delta": 99}]
            - []
          expected: {"balances": {"a": 5}, "processed_ids": ["e1"]}
        - args:
            - [{"id": "e1", "account": "a", "delta": 5}]
            - ["e1"]
          expected: {"balances": {}, "processed_ids": ["e1"]}
        - args:
            - [{"id": "z", "account": "x", "delta": 1}, {"id": "y", "account": "x", "delta": -1}, {"id": "w", "account": "y", "delta": 0}]
            - ["m"]
          expected: {"balances": {"x": 0, "y": 0}, "processed_ids": ["m", "w", "y", "z"]}
        - args:
            - [{"id": "e2", "account": "a", "delta": 3}, {"id": "e2", "account": "b", "delta": 3}, {"id": "e4", "account": "b", "delta": 4}]
            - ["e9", "e9"]
          expected: {"balances": {"a": 3, "b": 4}, "processed_ids": ["e2", "e4", "e9"]}
      timeout_s: 5
    explanation: |
      An idempotent consumer keys on a stable event id supplied by the producer and records ids together with the
      effect. In production the id set and the balance update must commit in one transaction (or an upsert with a
      unique constraint); keeping the set in memory only protects within one process lifetime.
