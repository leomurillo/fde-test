# Fast tier (time_s <= 70): short concept checks and compact scenarios for quick-fire multiple-choice sections.
# Word budget: stem + options <= 1.5 x time_s (see AUTHORING.md "Fast-tier items").
domain: D7
items:
  - id: D7-101
    version: 1
    type: single
    subtopic: eval.datasets
    difficulty: 1
    level: recall
    time_s: 40
    stem: |
      Where should the first cases in a golden evaluation dataset come from?
    options:
      - text: Real user cases, including hard edge cases
        correct: true
        why: Real inputs reflect what the system will actually face, edge cases included.
      - text: Questions generated by the model being evaluated
        why: The model tends to write questions it already handles well, which flatters its scores.
        misconception: Synthetic data from the system under test is neutral
      - text: Public benchmark datasets for the same task
        why: Benchmarks rarely match the client's data, language or failure modes.
        misconception: Public benchmarks predict performance on a client's task
      - text: Examples the team writes from the specification
        why: Useful as a supplement, but they miss the messiness of real inputs.
        misconception: Spec-driven examples cover real usage
    explanation: |
      Build golden datasets from real cases (logs, tickets, documents), deliberately including edge cases, then grow
      them with every production failure.

  - id: D7-102
    version: 1
    type: single
    subtopic: eval.datasets
    difficulty: 1
    level: apply
    time_s: 40
    stem: |
      You just fixed a bug that reached production. What should happen to the evaluation suite?
    options:
      - text: Add the failing case as a regression test
        correct: true
        why: The suite should grow with every production failure so the bug cannot quietly return.
      - text: Nothing, because the bug has already been fixed
        why: Without a test, a later prompt or model change can bring it back unnoticed.
        misconception: Fixed bugs stay fixed
      - text: Rebuild the entire suite from scratch
        why: Throws away existing coverage to address one case.
        misconception: A miss means the whole suite is invalid
      - text: Remove the cases that have passed for months
        why: Old passing cases still guard against regressions.
        misconception: Passing tests are dead weight
    explanation: |
      Regression suites grow with every production failure; each fixed bug becomes a permanent test case.

  - id: D7-103
    version: 1
    type: single
    subtopic: eval.datasets
    difficulty: 2
    level: analyze
    time_s: 60
    stem: |
      Scores jumped after a teammate added few-shot examples to the prompt. You find the examples were copied from
      the evaluation set. What is the problem?
    options:
      - text: Leakage; the eval no longer measures performance on unseen cases
        correct: true
        why: The model is being tested on answers it was shown, so the jump overstates real quality.
      - text: None; examples should closely mirror the evaluation cases
        why: They should resemble the task, not be the test answers themselves.
        misconception: Matching the eval set is good prompt design
      - text: The evaluation set is now too small to be reliable
        why: Size did not change; contamination did.
        misconception: The issue is sample size
      - text: Scores rose because few-shot prompting is very effective
        why: Some gain may be real, but the measurement can no longer tell how much.
        misconception: A score jump proves the technique works
    explanation: |
      Keep prompt examples, training data and evaluation cases separate. Leakage inflates scores and hides
      regressions; version datasets to track what was used where.

  - id: D7-104
    version: 1
    type: single
    subtopic: eval.methods
    difficulty: 1
    level: recall
    time_s: 40
    stem: |
      To check that each output is valid JSON with the required fields, which grader should you use?
    options:
      - text: A code-based check
        correct: true
        why: Deterministic, fast and exact; no judgment is involved.
      - text: An LLM judge with a rubric
        why: Slower, costlier and less reliable than code for a mechanical check.
        misconception: LLM judges are the default grader
      - text: Pairwise comparison between outputs
        why: Compares quality between two answers; it does not verify a schema.
        misconception: Pairwise judging fits every eval
      - text: Human review of a sample of outputs
        why: Slow and incomplete for something code can check on every output.
        misconception: Humans are the gold standard for every check
    explanation: |
      Use code-based graders (exact match, schema validation, unit tests) wherever possible; reserve model graders
      for judgments code cannot make.

  - id: D7-105
    version: 1
    type: single
    subtopic: eval.methods
    difficulty: 2
    level: apply
    time_s: 60
    stem: |
      In pairwise comparisons, your LLM judge tends to prefer whichever answer is shown first. What should you do?
    options:
      - text: Judge each pair in both orders and count only consistent wins
        correct: true
        why: Swapping positions cancels position bias; inconsistent verdicts become ties.
      - text: Switch to a larger, more capable model as the judge
        why: Larger judges still show position bias.
        misconception: Bigger judges are unbiased
      - text: Always show the new model's answer in second place
        why: Moves the bias in a fixed direction instead of removing it.
        misconception: A fixed order is a fair order
      - text: Tell the judge in its prompt to be impartial
        why: Instructions alone do not remove a systematic bias.
        misconception: Asking for fairness produces fairness
    explanation: |
      LLM judges show position, verbosity and self-preference biases. Randomize or swap order, control length, and
      calibrate against human labels.

  - id: D7-106
    version: 1
    type: single
    subtopic: eval.methods
    difficulty: 2
    level: apply
    time_s: 70
    stem: |
      Before you let an LLM judge decide whether releases can ship, what should you do?
    options:
      - text: Measure its agreement with human labels on a sample
        correct: true
        why: A judge is only useful if its verdicts track what people would decide.
      - text: Use the same model as the one being evaluated, for consistency
        why: Models tend to favor their own outputs (self-preference bias).
        misconception: Same-model judging is neutral
      - text: Ask it to explain its reasoning before every verdict
        why: Explanations can help, but they do not show whether verdicts are right.
        misconception: Plausible reasoning means accurate judgments
      - text: Raise the judge's temperature so verdicts are more varied
        why: More randomness makes the gate less consistent.
        misconception: Variety improves judging
    explanation: |
      Calibrate LLM judges against human labels (agreement rates, confusion on borderline cases) before using them
      as release gates, and re-check after changing the judge prompt or model.

  - id: D7-107
    version: 1
    type: single
    subtopic: eval.rag-agent
    difficulty: 1
    level: recall
    time_s: 40
    stem: |
      In RAG evaluation, what does faithfulness (groundedness) measure?
    options:
      - text: Whether the answer's claims are supported by the context
        correct: true
        why: It checks that the answer does not assert things the retrieved sources do not say.
      - text: Whether the answer addresses the user's question
        why: That is answer relevance.
        misconception: Faithfulness means relevance
      - text: Whether the retrieved passages hold all the needed facts
        why: That is context recall, a retrieval metric.
        misconception: Faithfulness measures retrieval
      - text: Whether the answer matches the reference word for word
        why: That is exact match, which penalizes correct paraphrases.
        misconception: Faithful means identical to the reference
    explanation: |
      RAG metrics split retrieval (context precision and recall) from generation (faithfulness, answer relevance), so
      you can tell which stage failed.

  - id: D7-108
    version: 1
    type: single
    subtopic: eval.rag-agent
    difficulty: 2
    level: recall
    time_s: 40
    stem: |
      Which metric captures whether an agent succeeds on every one of k repeated attempts at the same task?
    options:
      - text: pass^k
        correct: true
        why: It measures consistency, the probability that all k trials succeed.
      - text: pass@k
        why: pass@k counts success if at least one of k attempts works, which flatters unreliable agents.
        misconception: pass@k measures reliability
      - text: Average task success rate
        why: An average hides whether the same task sometimes fails.
        misconception: Mean success equals reliability
      - text: Tool-call accuracy per step
        why: A trajectory metric, not end-to-end consistency.
        misconception: Correct steps guarantee consistent outcomes
    explanation: |
      pass@k (any of k succeeds) suits tasks where a human picks the best attempt; pass^k (all k succeed) suits
      customer-facing agents that must work every time.

  - id: D7-109
    version: 1
    type: single
    subtopic: eval.rag-agent
    difficulty: 2
    level: analyze
    time_s: 40
    stem: |
      A RAG system gave a wrong answer. Looking at the trace, the retrieved passages never contained the needed
      fact. Which metric does this lower?
    options:
      - text: Context recall
        correct: true
        why: Retrieval missed relevant information, so the generator never had a chance.
      - text: Faithfulness
        why: The answer may still be faithful to what was retrieved; the retrieval was the gap.
        misconception: Every wrong answer is a faithfulness failure
      - text: Answer relevance
        why: The answer can address the question and still be wrong.
        misconception: Relevance captures correctness
      - text: Context precision
        why: Precision is about irrelevant passages ranking high; here relevant ones were missing.
        misconception: Precision and recall are interchangeable
    explanation: |
      Context recall falls when the needed information is not retrieved; fix retrieval (chunking, hybrid search,
      query rewriting) rather than the prompt.

  - id: D7-110
    version: 1
    type: single
    subtopic: eval.gates
    difficulty: 2
    level: evaluate
    time_s: 60
    stem: |
      On a 50-case evaluation set, prompt B scores 2 points higher than prompt A. What should you conclude?
    options:
      - text: Not enough evidence yet; the gap may be noise
        correct: true
        why: With 50 cases, a 2-point difference is one case, well within run-to-run variation.
      - text: B is better, so it should replace A in production now
        why: Treats a difference of one case as a real improvement.
        misconception: Any higher score is a real win
      - text: A is better, because small gains hide real regressions
        why: The data does not support either direction.
        misconception: Small differences favor the incumbent
      - text: The evaluation set must be broken and needs rebuilding
        why: Small differences are expected; nothing suggests the set is broken.
        misconception: Close scores mean a bad eval
    explanation: |
      Small samples are noisy. Repeat runs, enlarge the set, or use paired comparisons and confidence intervals before
      treating a difference as real.

  - id: D7-111
    version: 1
    type: single
    subtopic: eval.gates
    difficulty: 1
    level: recall
    time_s: 40
    stem: |
      What does an evaluation release gate in CI do?
    options:
      - text: Blocks a deploy when scores fall below thresholds
        correct: true
        why: Changes ship only when agreed metrics meet their thresholds.
      - text: Runs the evaluations after release and reports the results
        why: That is monitoring; a gate acts before release.
        misconception: Gates report rather than block
      - text: Requires a manual sign-off on every code change
        why: That is a review policy, not an automated quality gate.
        misconception: Gates are manual approvals
      - text: Limits deployments to business hours on weekdays
        why: That is a change-window policy.
        misconception: Any release rule is a gate
    explanation: |
      Release gates run the eval suite in CI and block the change when a metric falls below its threshold, including
      after model upgrades.

  - id: D7-112
    version: 1
    type: multi
    subtopic: eval.online
    difficulty: 2
    level: apply
    time_s: 70
    stem: |
      Which of these are useful online-evaluation signals for a deployed support assistant?
    options:
      - text: Sampled production conversations graded with the rubric
        correct: true
        why: Grades real traffic, including cases the offline set never anticipated.
      - text: How often users escalate to a human right after an answer
        correct: true
        why: An implicit feedback signal tied directly to answer quality.
      - text: Last month's scores on the offline golden dataset
        why: An offline measure; it says nothing about current production traffic.
        misconception: Offline scores are online signals
      - text: The number of API calls the assistant makes each day
        why: A volume metric, not a quality signal.
        misconception: Usage volume reflects answer quality
      - text: The model provider's published benchmark results
        why: Generic, offline and unrelated to this deployment.
        misconception: Vendor benchmarks evaluate your system
    explanation: |
      Online evaluation samples production traffic for grading and tracks user feedback signals (explicit ratings,
      escalations, retries) to catch drift that offline sets miss.

  - id: D7-113
    version: 1
    type: single
    subtopic: eval.online
    difficulty: 2
    level: analyze
    time_s: 60
    stem: |
      Offline eval scores are stable and the model version is pinned, but complaints rise as new product lines
      launch. What is the most likely cause?
    options:
      - text: Production traffic has drifted away from the eval set
        correct: true
        why: Questions about new products are not represented offline, so stable scores hide the new failures.
      - text: Users have grown more demanding over the months
        why: Possible, but the timing points to new kinds of questions, not new expectations.
        misconception: Rising complaints are about user mood
      - text: The offline graders have become more lenient
        why: The graders did not change; the inputs did.
        misconception: Stable scores mean a broken grader
      - text: The eval set is too large to detect small changes
        why: Size is not the issue; coverage of new topics is.
        misconception: Large eval sets are insensitive
    explanation: |
      Drift: production inputs change while the offline set stays the same. Sample live traffic and add new case types
      to the golden set.
