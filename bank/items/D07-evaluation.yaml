domain: D7
items:
  # ---------------------------------------------------------------- eval.datasets
  - id: D7-001
    version: 1
    type: single
    subtopic: eval.datasets
    tags: [discovery.framing]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      You are building the first evaluation set for an insurer's claims-summarisation assistant. The product
      owner offers 40 claim files that her team "hand-picked because they show the assistant at its best", and
      suggests using them as the benchmark for the pilot. How should you build the golden dataset?
    options:
      - text: "Stratified sample of real, de-identified claims with deliberate hard cases, and expert-adjudicated reference summaries"
        correct: true
        why: The set mirrors what the pilot will actually see, including awkward files, and has trustworthy references.
      - text: "Start with the 40 hand-picked files and add 200 randomly sampled claims later, so early iteration is fast and coverage grows over time"
        why: Early tuning and the first reported scores would be anchored on a set chosen to flatter the assistant, and a set you tuned on is hard to un-bias later.
        misconception: A curated starter set is harmless if a random set follows
      - text: "Have a strong model generate 2,000 synthetic claims with reference summaries, with an adjuster reviewing a sample of them"
        why: Synthetic data is useful for augmentation, but alone it reflects the generator's idea of claims, not the client's messy real files.
        misconception: Bigger synthetic sets substitute for real-distribution data
      - text: "Adopt a public document-summarisation benchmark so results can be compared with published numbers for other models"
        why: A generic benchmark measures generic summarisation, not the client's claim formats, terminology or failure costs.
        misconception: Public benchmark scores predict performance on a specific enterprise task
    explanation: |
      A golden dataset should come from the real input distribution, cover edge cases deliberately, and have
      references that domain experts agree on. Curated showcase examples, purely synthetic data and public
      benchmarks each answer a different question than "will it work on this client's claims?"
    refs: [https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents]

  - id: D7-002
    version: 1
    type: single
    subtopic: eval.datasets
    tags: [llm.prompting]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A team tuning a ticket-routing prompt copies the hard failures from its 150-case eval set into the prompt as
      few-shot examples. Eval accuracy climbs from 71% to 93% over two weeks, yet misrouted-ticket complaints in the
      pilot are unchanged. What is the most effective fix to the evaluation process?
    options:
      - text: "Keep a development set for iteration and a held-out set scored only at release, so reported scores stay unbiased"
        correct: true
        why: Held-out cases that never influenced the prompt give an unbiased estimate, and refreshing them tracks the live distribution.
      - text: "Paraphrase the few-shot examples so they no longer match the eval inputs word for word, then re-run the evaluation"
        why: Paraphrases of the same cases still teach the prompt the answers; the score remains contaminated.
        misconception: Leakage only matters when strings match exactly
      - text: "Triple the eval set by generating paraphrased variants of the existing 150 cases and averaging over all 450"
        why: Variants of cases already used for tuning are near-duplicates; a bigger set with the same leakage is still optimistic.
        misconception: More samples fix a biased estimate
      - text: "Switch the scoring to an LLM judge so the grader is not tied to the exact labels the prompt was tuned against"
        why: The problem is that the prompt was tuned on the evaluated inputs, not how they are graded.
        misconception: A different grader removes overfitting to the test cases
    explanation: |
      Optimising against the cases you report on turns the eval into a training set. Keep a development set for
      iteration and a held-out set that is touched rarely, and refresh it from production so it stays representative.
      More cases or a different grader do not repair an estimate that is biased by construction.

  - id: D7-003
    version: 1
    type: single
    subtopic: eval.datasets
    tags: [obs.troubleshooting]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A retailer's support bot told a customer that returns are accepted for 60 days; the policy changed to 30 days
      last quarter. The fix, refreshing the policy document in the knowledge base, ships the same day. Which
      follow-up best prevents this class of failure from silently returning?
    options:
      - text: "Add the failing question, anonymised, with variants and the expected policy answer to the regression suite, so recurrence fails a test"
        correct: true
        why: Every future change is now checked against this exact failure, so a stale-content regression fails the gate.
      - text: "Re-run the existing golden set after the knowledge-base refresh and ship the fix if the aggregate score has not dropped relative to the previous run"
        why: The golden set did not contain this failure, so an unchanged score says nothing about it.
        misconception: A passing suite proves the incident is covered
      - text: "Record the incident and the fix in the post-incident review and assign a named owner for the policy document"
        why: Process notes are worthwhile but nothing automated will catch the next stale answer.
        misconception: Documentation substitutes for an automated check
      - text: "Add an output filter that blocks any answer stating a 60-day return window, then monitor for matches"
        why: A brittle patch for one value; the next outdated figure passes straight through.
        misconception: A guardrail on the exact symptom is equivalent to a test for the failure class
    explanation: |
      Regression suites grow from production failures: each incident becomes a permanent test case with the
      expected behaviour. That converts a one-off fix into protection against recurrence and keeps the suite
      representative of how the system really fails.

  - id: D7-004
    version: 1
    type: single
    subtopic: eval.datasets
    tags: [eval.gates]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      Mid-quarter, subject-matter experts correct 60 of 400 golden labels after finding inconsistent annotation
      guidelines. The next release shows a +8 point jump in the dashboard, coinciding with a model upgrade. The
      product manager wants to credit the upgrade in the steering-committee deck. What should you do first?
    options:
      - text: "Version the dataset and re-score the previous release on the corrected labels, so both are compared on one version"
        correct: true
        why: Separates the effect of the label fix from the model change; the like-for-like delta is the real claim.
      - text: "Revert to the original labels so the trend line stays continuous with the past quarters' reported scores"
        why: Preserves a known-flawed baseline; continuity of a wrong measurement is not worth keeping.
        misconception: Frozen datasets must never change
      - text: "Credit the upgrade in the deck, since model changes are the largest source of quality movement in most releases"
        why: Unverified attribution; part or all of the jump may come from corrected labels.
        misconception: The most plausible cause is the actual cause
      - text: "Average the last three releases' scores to smooth out the discontinuity before presenting the trend"
        why: Averaging hides the break instead of explaining it, and mixes scores computed against different labels.
        misconception: Smoothing makes scores comparable
    explanation: |
      Datasets are artefacts that change, so they need versions. Any comparison must hold the dataset version fixed
      by re-scoring the older system on the new version. Otherwise changes in data and changes in the system are
      confounded.

  - id: D7-005
    version: 1
    type: multi
    subtopic: eval.datasets
    tags: [gov.responsible-ai]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      You are assembling the golden dataset for an HR-benefits question-answering assistant at a multinational.
      Which practices make the resulting scores trustworthy?
    options:
      - text: Have two benefits specialists label each case independently and adjudicate disagreements before treating labels as ground truth
        correct: true
        why: Measures and reduces label noise, which otherwise caps what any score can mean.
      - text: Tag every case with metadata such as country, topic and difficulty so results can be sliced
        correct: true
        why: An aggregate score hides a failing country or topic; slice tags make the failure visible.
      - text: Include questions the assistant should decline or escalate, such as individual salary or medical queries
        correct: true
        why: Correct refusal behaviour is part of the contract and is invisible if every case has a substantive answer.
      - text: Drop the cases the current system gets wrong, since they probably have label errors
        why: Removes exactly the hard cases that make the set informative and inflates the baseline.
        misconception: Failures indicate bad labels
      - text: Exclude topics that fewer than 1% of employees ask about, to keep the set focused
        why: Rare topics such as parental leave edge cases can be high stakes; frequency is not the only weight.
        misconception: Coverage should follow traffic frequency alone
      - text: Keep employee chat logs unredacted in the annotation tool, since annotators are already bound by employment confidentiality
        why: Confidentiality terms do not replace data minimisation; personal data should be redacted before it reaches annotators and repositories.
        misconception: A confidentiality obligation makes raw personal data acceptable
    explanation: |
      Trustworthy sets have reliable labels (agreement checked, disagreements adjudicated), enough structure to
      slice, and deliberate coverage of must-refuse and rare-but-costly cases. Dropping failures or rare topics makes
      the score look better without making the system better.

  - id: D7-006
    version: 1
    type: single
    subtopic: eval.datasets
    tags: [delivery.scoping, eval.methods]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A law firm wants a contract-clause extraction pilot in six weeks. Engineering wants to start building;
      the client says they have no labelled data and "can't spare lawyers for annotation until the tool exists."
      What do you propose?
    options:
      - text: "Have two associates label 30 to 50 real contracts in week one, so every prompt change can be scored against them"
        correct: true
        why: A small, real, early set makes every prompt or retrieval change measurable and costs days, not months.
      - text: "Build the tool first and treat the lawyers' feedback during the pilot as the evaluation, since they know good output"
        why: Feedback arrives late, is anecdotal and cannot show whether a change helped or hurt.
        misconception: Evals can wait until users exist
      - text: "Start from a public annotated contract corpus now and add the firm's own labels once the pilot is under way"
        why: Public clause taxonomies and document styles differ from this firm's; early scores would not predict performance on its contracts.
        misconception: Public labelled data can stand in for the client's own cases
      - text: "Have the LLM label the contracts as well and use its labels as ground truth, then spot-check a few with lawyers"
        why: The model grades its own kind of output; unverified labels bake its mistakes into the benchmark.
        misconception: Model-generated labels are equivalent to expert labels
    explanation: |
      Eval-driven development starts small: a few dozen real, expert-labelled cases are enough to detect the large
      effects of early iterations. Grow the set as the system matures and as failures surface.
    refs: [https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents]

  - id: D7-007
    version: 1
    type: single
    subtopic: eval.datasets
    tags: [llm.failure-modes]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A bank's transaction-triage classifier reports 96% accuracy on its eval set. Review shows 97% of the 1,000
      cases are routine, and the 12 "suspected fraud, escalate" cases are the only ones that matter to compliance.
      The model escalated 4 of those 12. What does the evaluation need?
    options:
      - text: "Report recall for the escalation class, oversample those cases, and gate on that slice separately"
        correct: true
        why: Recall of 33% on the class that matters is the real result; a slice-level gate prevents it hiding behind the average.
      - text: "Raise the overall accuracy threshold to 98% so the gate becomes stricter and forces the model to improve"
        why: A tighter average can be met by getting routine cases right; it does not force escalations to be caught.
        misconception: A stricter aggregate threshold protects the rare class
      - text: "Keep reporting overall accuracy but add a confidence interval around it and note the small count of escalation cases"
        why: The interval is a fair caveat, but it is not a response; the metric still ignores the critical class.
        misconception: Statistical uncertainty is the main problem
      - text: "Rebalance by deleting routine cases until the classes are 50/50, then keep using accuracy as the metric"
        why: Throws away the data that shows false-escalation cost and breaks the link to the live class mix.
        misconception: Balanced classes make accuracy meaningful
    explanation: |
      Aggregate accuracy is dominated by the majority class. Evaluate rare, high-cost classes with their own
      metric (recall, plus precision to bound alert fatigue), build enough cases to measure them, and put a
      separate threshold on that slice.

  - id: D7-008
    version: 1
    type: single
    subtopic: eval.datasets
    tags: [gov.audit-compliance, obs.tracing]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      A healthcare client's engineers propose copying a week of production chat transcripts into the shared
      evaluation repository "because those are the most realistic test cases we will ever get". The transcripts
      contain patient names, record numbers and free-text diagnoses, and the client's clinicians have no time to
      write test cases from scratch. How should you respond?
    options:
      - text: "Redact identifiers, including names and record numbers, before ingest, restrict repository access, and set a retention limit"
        correct: true
        why: Keeps the realism and failure coverage of live traffic while meeting minimisation and access obligations.
      - text: "Replace patient names and record numbers with pseudonyms and keep the diagnoses, which are not identifying without a name"
        why: Free-text diagnoses combined with dates and context can re-identify a patient; pseudonymising direct identifiers alone is not de-identification.
        misconception: Removing names makes health data anonymous
      - text: "Copy the transcripts as proposed, since the signed data-processing agreement already covers processing for service improvement"
        why: A contract permits the purpose but does not justify unrestricted repository access or indefinite retention; minimisation and need-to-know still apply.
        misconception: A contract covering the purpose waives access controls
      - text: "Have a model rewrite each transcript into a paraphrased synthetic case and treat the output as de-identified data"
        why: Paraphrasing can preserve identifying details, and sending raw text to a model is itself a disclosure before any scrubbing.
        misconception: Rewriting text removes personal data
    explanation: |
      Production traffic is the best source of realistic cases, but evaluation data inherits the sensitivity of its
      source. Minimise and redact before it enters the repo, limit who can read it and how long it is kept, and
      treat pseudonymising only names, or model-based paraphrasing, as unverified de-identification.

  # ---------------------------------------------------------------- eval.methods
  - id: D7-009
    version: 1
    type: single
    subtopic: eval.methods
    tags: [llm.structured-tools]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A logistics client's pipeline extracts invoice fields (vendor, date, total, currency) from PDFs into JSON.
      A teammate proposes an LLM judge to score every extraction against the reference. What is the better
      first grader?
    options:
      - text: "Schema validation plus normalised exact-match per field, because fields have exact answers; a judge only for free text"
        correct: true
        why: Fields have deterministic right answers, so a cheap, reproducible code grader is more accurate and faster.
      - text: An LLM judge scoring each extraction on a 1 to 5 scale, because it tolerates formatting differences
        why: Costs more, varies run to run and can accept a wrong total that looks plausible.
        misconception: Model graders are better because they are more flexible
      - text: Embedding similarity between the extracted JSON and the reference JSON, thresholded at 0.9
        why: Near-identical strings with a different digit in the total are close in embedding space but wrong.
        misconception: Semantic similarity detects field-level errors
      - text: Manual review of a weekly sample by the finance team as the only grading signal
        why: Human review is slow and should calibrate automated graders, not replace them on checkable fields.
        misconception: Human judgement is needed wherever accuracy matters
    explanation: |
      Prefer code-based graders when the answer can be checked deterministically: schema validity, exact or
      normalised matches, unit tests. They are fast, cheap and reproducible. Use model graders only for the
      qualities code cannot capture, and calibrate them against human labels.
    refs: [https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents]

  - id: D7-010
    version: 2
    type: single
    subtopic: eval.methods
    difficulty: 1
    level: analyze
    time_s: 90
    stem: |
      A pairwise LLM judge compares the current and candidate prompts. The candidate wins 68% of comparisons. An
      engineer notices that the candidate's answer was always presented first. Which step best addresses the
      likely artefact?
    options:
      - text: "Run each pair twice with the order swapped and count a win only when both verdicts agree"
        correct: true
        why: A verdict driven by slot alone flips when the order is swapped and becomes a tie, so order cannot manufacture wins, and the flip rate shows how much of the 68% was order.
      - text: "Add an instruction to the judge prompt telling it to ignore the order in which answers are presented"
        why: Instructions may reduce the bias but do not measure it; you would still not know how much of the 68% is order.
        misconception: Telling the model to be unbiased makes it unbiased
      - text: "Switch to a larger judge model with a longer context window and stronger instruction following"
        why: Position bias appears across model sizes; scale is not a substitute for counterbalancing.
        misconception: Stronger models are free of presentation bias
      - text: "Sample each verdict several times at a higher temperature and take the majority across samples"
        why: Averages out random noise but a systematic order preference survives in every sample.
        misconception: Repeated sampling fixes systematic bias
    explanation: |
      Pairwise judges often favour a particular slot. Counterbalance by evaluating both orders, treat disagreements
      as ties, and report the tie or flip rate alongside the win rate. Randomising order also balances position
      effects at scale; prompt instructions alone do not. Counterbalancing takes order out of the result, not other
      judge biases such as a preference for longer answers, so still check the verdicts against a human-labelled
      sample.
    refs: [https://arxiv.org/abs/2306.05685]

  - id: D7-011
    version: 1
    type: single
    subtopic: eval.methods
    tags: [llm.prompting]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      After a prompt change that makes answers about twice as long, the judge's mean helpfulness score rises 0.6
      points. In a side-by-side with support agents, humans prefer the new answers no more often than the old.
      What is the best next step?
    options:
      - text: "Check how strongly judge scores track length on human-labelled cases, and reward concision in the rubric"
        correct: true
        why: Tests the verbosity-bias hypothesis directly and fixes the rubric where the judge was rewarding length.
      - text: "Replace the 1 to 5 scores with a pairwise judge, since relative comparison avoids scale effects and length bias"
        why: Pairwise judges are also verbosity-biased and often prefer the longer answer.
        misconception: Pairwise comparison removes length bias
      - text: "Use a judge from a different model vendor to remove the original vendor's stylistic preferences from scoring"
        why: That targets self-preference, a different bias; the judge may still reward length.
        misconception: Any judge bias is cured by switching vendor
      - text: "Discard the judge and rely on the humans' side-by-side result as the only measure of quality going forward"
        why: Judges are valuable at scale once calibrated; discarding it throws away the cheap signal instead of fixing it.
        misconception: Automated graders are untrustworthy by nature
    explanation: |
      LLM judges commonly favour longer, more elaborate answers. Measure the correlation of scores with length on
      human-labelled data, then make the rubric specific about what counts (accuracy, completeness, concision).
      Recalibrate against humans after changing the judge or the rubric.

  - id: D7-012
    version: 2
    type: single
    subtopic: eval.methods
    tags: [llm.model-selection]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      To choose a vendor for a client's drafting assistant, an FDE has model A (from vendor X) and model B (from
      vendor Y) answer 200 prompts, and uses model A's larger sibling from vendor X as the only judge. Model A wins
      by a wide margin, but the client's lawyers read the outputs as roughly equal. What most likely happened,
      and what should change?
    options:
      - text: "Self-preference: use a judge from another family, or a panel, and verify on lawyer labels"
        correct: true
        why: Self-preference is the likely cause; an unrelated judge or a multi-family panel removes the shared lineage, and lawyer labels test whether any gap is real.
      - text: "The judge is too lenient overall, so set its sampling temperature to zero to tighten the scoring"
        why: Temperature controls sampling variance, not a systematic preference for one family's style.
        misconception: Determinism removes bias
      - text: "The judge needs chain-of-thought reasoning before scoring, so that it can see model B's strengths"
        why: Reasoning can help, but a judge that likes its own style will rationalise that preference.
        misconception: Reasoning steps neutralise preference
      - text: "The prompts were too easy for both models, so add harder prompts until the gap between them narrows"
        why: Harder prompts change difficulty, not the judge's preference; the mismatch with human readers would persist.
        misconception: Wide score gaps mean the benchmark is too easy
    explanation: |
      Judges can rate outputs from their own model family higher. When comparing vendors, avoid a judge related to
      either contestant: use one from another family or a panel from several, and randomise order. This reduces the
      conflict but does not make the judge neutral, since judges can share other biases such as a preference for
      longer answers. Treat self-preference as a hypothesis and let a human-labelled sample confirm the ranking.
    refs: [https://arxiv.org/abs/2404.13076]

  - id: D7-013
    version: 1
    type: multi
    subtopic: eval.methods
    difficulty: 2
    level: apply
    time_s: 110
    stem: |
      An LLM judge will gate releases of a claims-note summariser, and about 90% of notes are acceptable. How
      should the team establish that the judge can be trusted?
    options:
      - text: Have domain experts label a sample of about 100 summaries, then compare judge verdicts per class and with a chance-corrected measure
        correct: true
        why: With 90% acceptable cases, raw agreement is inflated; per-class and chance-corrected agreement reveals real discrimination.
      - text: Review disagreements between judge and experts and refine the rubric, then re-check on fresh labelled cases
        correct: true
        why: Disagreements show which rubric wording misleads the judge; fresh cases confirm the fix is not overfit.
      - text: Re-run the calibration whenever the judge model, its prompt or the rubric changes
        correct: true
        why: Judge behaviour is a property of model plus prompt; any change can shift agreement silently.
      - text: Accept the judge once raw agreement with experts exceeds 90%
        why: A judge that approves every note would hit 90% on this mix while catching no bad summaries.
        misconception: High raw agreement means a good judge
      - text: Tune the rubric on the same labelled cases used to report the agreement figure
        why: Agreement measured on the tuning cases overstates how the judge performs on new notes.
        misconception: Reusing labelled data is harmless
      - text: Ask the judge to output a confidence score and trust verdicts above 0.9 without human labels
        why: Verbalised confidence is not calibrated evidence; only comparison against human labels shows reliability.
        misconception: Model self-reported confidence is a calibration
    explanation: |
      A judge is a measurement instrument and needs validating against human labels. Use enough labelled cases,
      account for class imbalance with per-class and chance-corrected agreement, hold out data that was not used for
      rubric tuning, and recalibrate after any change to judge model or prompt.
    refs: [https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents]

  - id: D7-014
    version: 1
    type: single
    subtopic: eval.methods
    tags: [llm.prompting]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      A judge prompt asks "Rate the helpfulness of this answer from 1 to 10". Ninety percent of scores land on 7
      or 8, so a prompt that clearly improves answers shows no significant movement. What should you change?
    options:
      - text: "Replace the score with specific pass/fail criteria, each defined with an example, and aggregate them"
        correct: true
        why: Concrete checkable criteria give the judge something to discriminate on and make failures diagnosable.
      - text: "Widen the scale to 1 to 100 so that the judge has finer resolution to separate good answers from great ones in every batch"
        why: A vague criterion on a wider scale produces more clustered noise, not more signal.
        misconception: Finer scales add discrimination
      - text: "Add 'be strict and critical' to the instructions and tell the judge to avoid defaulting to the middle of the scale"
        why: Shifts the average downward without defining what to be strict about; the compression remains.
        misconception: Tone instructions fix rubric vagueness
      - text: "Run the same judge three times per answer and average the scores to reduce variance"
        why: Averaging identical vague judgements converges on the same clustered value.
        misconception: More samples fix a poorly defined criterion
    explanation: |
      Holistic scores like "helpfulness" are underspecified, so judges default to the middle-high range. Break
      quality into narrow, observable criteria (cites the policy section, states the deadline, avoids unsupported
      claims), grade each pass/fail, and let the judge reason before it decides.

  # ---------------------------------------------------------------- eval.rag-agent
  - id: D7-015
    version: 1
    type: single
    subtopic: eval.rag-agent
    tags: [rag.retrieval]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A RAG assistant for a manufacturer's service manuals gets complaints about incomplete repair steps. The eval
      dashboard shows faithfulness 0.95, answer relevancy 0.91 and context recall 0.41. Where should the team work?
    options:
      - text: "Retrieval: answers stay faithful to the retrieved text, but that text lacks much of what the reference needs"
        correct: true
        why: High faithfulness with low context recall means the generator is honest about incomplete evidence.
      - text: "The generation prompt, to make the model include more repair steps in each answer it produces"
        why: Pushing the model to add steps not in the context would lower faithfulness and invite fabrication.
        misconception: Incomplete answers are a generator problem
      - text: "The judge model, since scores above 0.9 on two metrics suggest the third one is being mis-scored"
        why: Metrics measure different things; one low number is not evidence of grader error.
        misconception: Metrics should agree with each other
      - text: "The answer relevancy metric, because it should be capturing the missing steps but is not"
        why: Relevancy checks whether the answer addresses the question, not whether all needed facts were retrieved.
        misconception: Answer relevancy measures completeness
    explanation: |
      Component metrics localise faults. Faithfulness checks that claims are supported by the retrieved context;
      context recall checks that the retrieved context covers what the reference answer needs. Faithful but
      incomplete answers point to the retriever.
    refs: [https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_recall/]

  - id: D7-016
    version: 1
    type: single
    subtopic: eval.rag-agent
    tags: [rag.retrieval]
    difficulty: 1
    level: apply
    time_s: 80
    stem: |
      In a legal-research RAG system, the decisive passage is consistently retrieved but ranked seventh of ten,
      below several off-topic passages, and the generator often ignores it. Which metric is designed to penalise
      this ordering problem, rather than merely checking that the passage was retrieved at all?
    options:
      - text: Context precision, which weights relevant chunks higher when they appear earlier in the ranking
        correct: true
        why: It is rank-aware, so burying the relevant chunk under irrelevant ones lowers the score.
      - text: Context recall, which checks whether the needed information appears anywhere in the retrieved set
        why: The passage is present, so recall stays high regardless of its position.
        misconception: Recall reflects ranking quality
      - text: Faithfulness, which checks whether answer claims are supported by the retrieved context
        why: It evaluates the answer against context, not how the context is ordered.
        misconception: Faithfulness measures retrieval quality
      - text: Answer relevancy, which checks whether the answer addresses the question
        why: It scores the generated answer, not the retrieved ranking.
        misconception: Answer-level metrics diagnose retrieval order
    explanation: |
      Context precision is a rank-aware retrieval metric: it averages precision at each rank where a relevant chunk
      appears, so placing irrelevant chunks first lowers it. Context recall measures coverage and ignores order.
      Faithfulness and answer relevancy judge the generated answer.
    refs: [https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_precision/]

  - id: D7-017
    version: 1
    type: single
    subtopic: eval.rag-agent
    tags: [llm.failure-modes]
    difficulty: 3
    level: analyze
    time_s: 100
    stem: |
      An appliance-warranty chatbot told a customer the warranty is 5 years; the manual says 2. The same response
      scores 0.93 on answer relevancy. The product owner asks whether the metric is broken. What is the correct reading?
    options:
      - text: "Working as designed: it scores whether the answer addresses the question, not whether it is true, so add faithfulness against the retrieved text and a correctness check"
        correct: true
        why: Answer relevancy is derived from regenerating questions from the answer, so a confident, on-topic, wrong answer scores high.
      - text: "Broken: the judge model behind the metric should be upgraded, because a stronger model would notice that 5 years contradicts the manual"
        why: The relevancy prompt never sees the manual, so no judge, however strong, can detect the factual error with this metric.
        misconception: A better judge model makes any metric catch factual errors
      - text: "Working as designed, and context precision is the metric to add, because it flags statements that contradict the retrieved passages"
        why: Context precision scores the ranking of retrieved chunks, not the answer text; faithfulness is the metric that checks claims against context.
        misconception: Context precision measures answer correctness
      - text: "Working as designed: a score above 0.9 means the answer is consistent with the retrieved context, so the retrieval must be the fault"
        why: Consistency with context is faithfulness; relevancy says nothing about it, so the score cannot be used to clear or blame retrieval.
        misconception: Relevancy and faithfulness are interchangeable
    explanation: |
      RAGAS answer relevancy has an LLM generate questions from the response and averages the embedding
      similarity of those questions to the original query (not a direct answer-to-query cosine). It rewards on-topic,
      complete answers and does not check facts. Pair it with faithfulness against the retrieved context and, where
      references exist, a correctness check.
    refs: [https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/answer_relevance/]

  - id: D7-018
    version: 1
    type: single
    subtopic: eval.rag-agent
    tags: [agents.patterns]
    difficulty: 2
    level: evaluate
    time_s: 90
    stem: |
      A travel-booking agent is graded by comparing its tool calls to a reference sequence of seven calls. A new
      model books the correct flight in five calls and is marked as failing. What is the better grading design?
    options:
      - text: "Check the resulting booking state, and add transcript checks only for hard constraints like step budget"
        correct: true
        why: Rewards valid alternative paths while still enforcing the constraints that matter.
      - text: "Keep the exact sequence check since it is deterministic, and add alternative sequences as they are discovered"
        why: Always chasing newly discovered valid paths makes the suite brittle and punishes creativity.
        misconception: Deterministic path checks are the safest regression guard
      - text: "Grade only the final message with an LLM judge for whether it sounds like a successful booking"
        why: A confident message can describe a booking that does not exist; the environment state is the evidence.
        misconception: The final text is a reliable proxy for task success
      - text: "Compare average tool-call counts between old and new model and fail the run when they differ"
        why: Count differences are expected between models and say nothing about correctness.
        misconception: Efficiency parity equals correctness
    explanation: |
      Grade what the agent produced (the outcome in the environment) rather than the exact path. Use trajectory
      checks selectively, for things like step limits, forbidden tools or cost, where the path itself is
      the requirement.
    refs: [https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents]

  - id: D7-019
    version: 2
    type: multi
    subtopic: eval.rag-agent
    tags: [eval.gates]
    difficulty: 3
    level: evaluate
    time_s: 120
    stem: |
      A team runs 5 independent trials per task for two agents. The first is a customer-facing refund agent that acts
      on its own, so a customer gets one attempt per request. The second is an internal coding agent whose patches
      are run against a test suite before anyone sees them, and failed attempts are retried automatically at low
      cost. The release report must lead with either pass@5 (at least one of the 5 trials succeeds) or pass^5 (all 5
      succeed) for each agent. Which positions are sound?
    options:
      - text: Lead with pass^5 for the refund agent, since each customer meets a single attempt and any failed trial is a failure they could have met
        correct: true
        why: "pass^5 asks whether the agent handles a task on all five attempts, the consistency that a stream of customers with one request each relies on. It is stricter than one customer's single-attempt success rate, not the same number."
      - text: Lead with pass@5 for the coding agent, since the test suite filters out failed attempts and one success among several is enough
        correct: true
        why: Where a verifier and cheap retries exist, the question is whether the agent can solve the task at all, which pass@k answers.
      - text: A large gap between pass@5 and pass^5 for the refund agent points to inconsistent behaviour to fix, even when pass@5 looks near-perfect
        correct: true
        why: The two metrics diverge as k grows when per-trial success is below 1; the gap is the inconsistency customers would experience.
      - text: Lead with pass@5 for the refund agent, since a customer can always rephrase and try again after a wrong refund
        why: A refund already issued wrongly is not undone by a retry, and the report should reflect the single attempt the customer actually gets.
        misconception: Retry availability makes any failure recoverable
      - text: Reporting pass^10 from 10 trials instead of pass^5 from 5 raises the figure, because more trials give a more reliable estimate
        why: pass^10 requires all 10 trials to succeed, a stricter event that is lower whenever per-trial success is below 1. Extra trials sharpen an estimate only while k stays fixed.
        misconception: More trials always improve the reported score
      - text: A gap between the two metrics shows that the trials are not independent, so the eval should be rerun before either number is used
        why: For independent trials the metrics are expected to diverge as k grows, so a gap alone is not evidence of a broken harness.
        misconception: Different metrics over the same trials should agree
    explanation: |
      pass@k is the chance of at least one success in k tries and rises with k; pass^k is the chance that all k
      succeed and falls with k (Anthropic's agent-eval guidance gives the same definitions). Which to headline depends
      on whether one success is enough (a verified, retryable setting such as code generation) or consistency is
      required (customer-facing automation). Reporting both exposes how consistent the agent is. Neither equals the
      single-attempt success rate (pass@1), and changing k changes the event being measured, not just the precision
      of the estimate.
    refs: [https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents]

  - id: D7-020
    version: 1
    type: single
    subtopic: eval.rag-agent
    tags: [gov.approvals, agents.tools-mcp]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      An IT-helpdesk agent reaches 90% task success measured by final account state. A transcript review of the
      successful runs finds that about 15% of them called the `reset_mfa` tool without the required manager
      approval step. How should the evaluation change?
    options:
      - text: "Add transcript graders that fail any `reset_mfa` call lacking a prior approval, because the end state hides the bypass"
        correct: true
        why: Outcome grading cannot see policy violations on the way; a transcript check makes the constraint measurable and gateable.
      - text: "Keep outcome-only grading, since the final account state is correct and that is what the business asked for"
        why: The ticket's end state is right but the control was bypassed, which is the actual risk.
        misconception: A correct result means the process was acceptable
      - text: "Switch to scoring the exact tool sequence of each run against a reference run for every ticket type"
        why: Over-constrains legitimate variation and still misses violations the reference did not anticipate.
        misconception: Any process failure needs full trajectory matching
      - text: "Remove `reset_mfa` from the agent's toolset and keep the 90% task success as the headline metric"
        why: May be a valid mitigation, but it changes the product instead of fixing the evaluation blind spot.
        misconception: Removing capability replaces measuring behaviour
    explanation: |
      Outcome grading answers "did it work", while transcript grading answers "how did it get there". When the path
      carries a requirement such as approvals, budgets or forbidden actions, check it explicitly, and track it as
      its own metric next to task success.
    refs: [https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents]

  # ---------------------------------------------------------------- eval.gates
  - id: D7-021
    version: 1
    type: single
    subtopic: eval.gates
    tags: [gov.guardrails]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A CI gate blocks a prompt release unless overall accuracy on 300 cases is at least 85%. A candidate scores 88%
      overall, passes, and ships. Afterwards the team finds that the 20-case "must refuse" slice dropped from 100%
      to 90% in that same run. How should the gate be redesigned?
    options:
      - text: "Add per-slice thresholds with hard floors on critical slices, plus a no-regression check against baseline"
        correct: true
        why: A floor on the refusal slice would have failed this release regardless of the overall score.
      - text: "Raise the overall threshold to 90% so that large regressions in any part of the set are less likely to get through the gate"
        why: The refusal slice is only a fraction of the cases; the average can still rise while it drops.
        misconception: A higher aggregate bar covers all slices
      - text: "Keep the gate as is and require manual review of every diff in the eval output before each release"
        why: Does not scale and relies on a human spotting the slice drop each time.
        misconception: Manual review is a substitute for explicit criteria
      - text: "Add 300 more cases to the set and report the overall average with a confidence interval"
        why: A more precise average still conceals a slice-level regression.
        misconception: Precision of the mean is the issue
    explanation: |
      Gates should encode the release criteria: thresholds per metric and per critical slice, plus a comparison to
      the baseline so regressions fail even when the overall number looks fine.

  - id: D7-022
    version: 2
    type: single
    subtopic: eval.gates
    tags: [comms.stakeholders]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A product manager wants to ship prompt v2 because it scores 74% on a 50-case set against 70% for v1, a
      two-case difference. All runs use temperature 0 and the results repeat exactly. What do you advise?
    options:
      - text: "Compare the prompts case by case with a paired test or bootstrap, and add cases before deciding"
        correct: true
        why: Two cases out of 50 can flip with a different sample of inputs; a paired interval shows if the gap exceeds noise.
      - text: "Ship v2, since deterministic results mean the 4-point gain is a real and repeatable improvement"
        why: Repeatability shows the evaluation is stable, not that it generalises beyond these 50 cases.
        misconception: Deterministic runs remove sampling noise
      - text: "Run each prompt three more times at temperature 0.7 and compare the averaged scores"
        why: Averaging runs smooths output randomness, but the uncertainty here comes from which 50 cases were sampled.
        misconception: More runs fix a small-sample problem
      - text: "Keep v1, because a gain of under 5 points is below the usual significance threshold for evals"
        why: There is no universal 5-point rule; significance depends on sample size and variance.
        misconception: A fixed point difference defines significance
    explanation: |
      With few cases, uncertainty comes from the sample of inputs, not from run-to-run randomness. Prefer paired
      comparisons on the same cases and report an interval. If it is inconclusive, collect an agreed additional
      sample (or trials, if outputs vary) under a decision rule fixed in advance. Adding cases and re-testing until
      the gap looks significant inflates false positives unless the method is designed for sequential decisions. If
      the result is still inconclusive, keep v1 or use an agreed low-risk rollout.
    refs: [https://arxiv.org/abs/1512.04922]

  - id: D7-023
    version: 1
    type: single
    subtopic: eval.gates
    tags: [llm.model-selection, deploy.delivery]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      A provider announces that the model version behind a client's contract-review assistant will be retired in 60
      days, with a successor described as "a drop-in improvement". Engineering proposes switching the model name
      in config and spot-checking five documents. What should the plan be?
    options:
      - text: "Run the full regression suite on the successor and compare per slice with the baseline, because behaviour can shift quietly"
        correct: true
        why: Behaviour can shift in ways a summary claim hides; sliced comparison on your own suite decides if cutover is safe.
      - text: "Accept the five-document check, since the provider's published benchmarks already show clear gains"
        why: Provider benchmarks reflect their tasks, not this client's contract slices.
        misconception: Vendor benchmark gains transfer to your workload
      - text: "Rewrite the prompts to match the successor's best-practice guidance before running any evaluation"
        why: Changes two variables at once, so you cannot attribute differences; measure first, then tune.
        misconception: New models require prompt rewrites before testing
      - text: "Run only the capability suite, since new abilities matter more than regressions on old cases"
        why: Regression cases encode the behaviours the client already relies on; skipping them risks silent breakage.
        misconception: Capability tests are more important than regression tests
    explanation: |
      Treat any model change, including provider-driven ones, as a release: re-run the regression and capability
      suites with the same prompts, compare slices against the baseline, then adjust prompts if needed and pin the
      new version.

  - id: D7-024
    version: 2
    type: multi
    subtopic: eval.gates
    tags: [deploy.delivery]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      The CI eval gate for a summarisation service fails on about one in six unchanged commits. Scores come from
      a sampled candidate model graded by an LLM judge. Which changes make the gate trustworthy?
    options:
      - text: Run several trials per case and gate on the mean pass rate with a tolerance band set from observed run-to-run variance
        correct: true
        why: Measures the real noise level and sets the threshold relative to it.
      - text: Replace judge-scored checks with code-based graders wherever the criterion can be checked deterministically
        correct: true
        why: Removes one source of variance and cost from the gate.
      - text: Pin the judge model version and its prompt, and keep judge sampling temperature low
        correct: true
        why: An unpinned judge drifts, so identical outputs receive different scores across weeks, and a low temperature cuts the grader's run-to-run noise.
      - text: Re-run a failed gate and accept the commit if any attempt passes
        why: Retry-until-green turns a noisy test into a coin flip and lets real regressions through.
        misconception: Flaky tests should be retried until they pass
      - text: Score a freshly drawn random subset of the golden set on each commit, to cover more cases over time
        why: Scoring different cases on each commit against a fixed threshold adds sample-to-sample variance to a gate that already fails on noise; this gate needs like-for-like comparison.
        misconception: Rotating the sample improves coverage without cost to stability
      - text: Gate only on the judge-scored metrics because they give the most holistic view of quality
        why: Holistic but noisy; hard checks like schema validity are cheap and should anchor the gate.
        misconception: Model-based scores are inherently better
    explanation: |
      Flaky gates come from sampling noise in the system under test and in the grader. Measure the noise, gate on
      aggregated results with a tolerance derived from it, pin the grader, and move checkable criteria to code.
      Retrying until green destroys the gate's value. A fixed case set is the simplest way to compare like with like;
      a sampled set can also work if the baseline is scored on the same draw and the tolerance accounts for the
      sampling.

  # ---------------------------------------------------------------- eval.online
  - id: D7-025
    version: 2
    type: single
    subtopic: eval.online
    tags: [obs.tracing]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A ticket-classification service scored 94% offline at launch. Three months later, after the client's launch of
      a new product line, agents report many misroutes, yet the offline score on the original set is still 94%.
      What explains this and what should be added?
    options:
      - text: "Drift: label a sample of live traffic continuously and add newly found failures to the golden set"
        correct: true
        why: Only live sampling sees the new product line's tickets, and failures found there refresh the offline set.
      - text: "The model degraded in production; schedule monthly retraining on the original training and evaluation data to restore quality"
        why: The unchanged offline score points away from a model change, and retraining on the original data would not cover the new tickets anyway.
        misconception: Production decline always means model decay
      - text: "The offline set was too small; double it with more cases drawn from the same original source"
        why: Larger old-distribution data does not contain the new product line, which only appears in recent traffic.
        misconception: More offline data from the same source fixes drift
      - text: "Agent complaints are anecdotal; wait for the quarterly offline re-run before taking any action"
        why: Waiting repeats the same blind spot, since the offline run uses the same set.
        misconception: Offline results outrank field reports
    explanation: |
      Offline evals measure the distribution captured at the time the set was built. Online evaluation samples
      production traffic for labelling or automated scoring, watches the input mix for drift, and promotes
      discovered failures into the offline regression set. A stable offline score makes drift the best-supported
      explanation but does not prove the deployed model and configuration are unchanged; confirm that from
      deployment records.

  - id: D7-026
    version: 1
    type: single
    subtopic: eval.online
    tags: [adoption.change]
    difficulty: 1
    level: analyze
    time_s: 75
    stem: |
      A chat assistant has thumbs-up and thumbs-down buttons. Only 2% of conversations get a rating, mostly
      thumbs-down from frustrated users. A director asks to use the thumbs-up rate as the quality KPI on the
      monthly dashboard. What is the best response?
    options:
      - text: "Use feedback to find cases to review, and measure quality on a graded random sample of all traffic"
        correct: true
        why: Feedback is a biased but valuable signal for triage; unbiased measurement needs random sampling.
      - text: "Report the thumbs-up rate as a trend rather than a level, since the response bias is constant and cancels out in month-on-month change"
        why: Who rates changes with the product, the user mix and the button placement, so the bias moves and the trend can mislead.
        misconception: A constant bias makes a trend trustworthy
      - text: "Reweight the ratings to match the traffic mix by topic and channel, then report the adjusted thumbs-up rate"
        why: Reweighting fixes observed mix differences only; whether a user chooses to rate still depends on the unobserved experience.
        misconception: Post-stratification removes self-selection bias
      - text: "Require a rating before the user can continue, to remove the response bias from the data"
        why: Forced ratings add friction and produce careless answers, which creates a different bias.
        misconception: Mandatory responses give clean data
    explanation: |
      Explicit feedback is sparse and self-selected. Use it to prioritise review and to mine new test cases, and
      measure overall quality with random samples graded by humans or calibrated judges.

  - id: D7-027
    version: 2
    type: multi
    subtopic: eval.online
    tags: [rag.architecture, obs.cost]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A RAG assistant handles 200,000 queries a day for an insurer. There are no reference answers for live traffic.
      Responses take about 4 seconds at p95 against a 5-second latency target, and a judge call takes about
      2 seconds. The team wants to track the hallucination rate over time and find failing responses for review.
      Which approaches are sound for monitoring hallucination in production?
    options:
      - text: Score a random sample of responses asynchronously for whether each claim is supported by the retrieved passages
        correct: true
        why: A reference-free faithfulness check needs only the response and context, and sampling keeps cost bounded.
      - text: Alert on shifts in the rolling unsupported-claim rate and route low-scoring samples to a human review queue
        correct: true
        why: Turns the score into an operational signal and gives reviewers the cases most likely to contain real failures.
      - text: Compute context recall against reference answers for every live query
        why: Recall needs a reference, which does not exist online.
        misconception: Offline metrics can be applied unchanged online
      - text: Run a synchronous judge on all responses before returning them, for every route
        why: A 2-second judge call on top of 4-second responses breaks the 5-second target on every route, and the goal is monitoring, not blocking; reserve inline checks for high-risk routes.
        misconception: Online evaluation must block every response
      - text: Track answer relevancy on a sample and treat a stable high score as evidence that hallucinations are not increasing
        why: Relevancy checks that answers address the question; a fluent, on-topic, unsupported answer scores high, so it cannot detect hallucination.
        misconception: Answer relevancy is a hallucination detector
    explanation: |
      Without live references, monitoring has to be reference-free, and at this volume it has to be affordable:
      sample traffic, score faithfulness against the retrieved context asynchronously, alert on rate changes and send
      suspicious samples to review. Faithfulness measures whether claims are supported by the retrieved passages, not
      whether those passages are true or current, so calibrate it against human review. Inline blocking checks suit
      narrow high-risk routes where the latency budget allows them, not all traffic.
    refs: [https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/faithfulness/]

  - id: D7-028
    version: 1
    type: single
    subtopic: eval.online
    tags: [deploy.delivery, agents.state]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      A new prompt for a ticket-creating agent looks better offline. The client's risk office forbids any
      user-visible change, and any duplicate ticket, until quality is shown on live traffic. Which rollout
      approach fits?
    options:
      - text: "Mirror live requests to the candidate in shadow mode with side-effecting tools stubbed, so users and tickets are untouched"
        correct: true
        why: Gets live-traffic evidence with no user impact and no duplicate tickets.
      - text: "A 5% canary to real users, with the ability to roll back within minutes if errors rise"
        why: A canary is user-visible and its writes can create duplicate tickets, which the risk office forbids.
        misconception: A small canary is risk-free
      - text: "A 50/50 A/B test for one week to obtain a statistically clean comparison on live traffic"
        why: Exposes half of users to the unproven prompt and live side effects.
        misconception: A/B testing is the only rigorous online method
      - text: "Replay last month's logged requests through the candidate and rely on that result for approval"
        why: Useful offline but not live; it misses current traffic, fresh data and drift.
        misconception: Historical replay equals live evaluation
    explanation: |
      Shadow evaluation runs the candidate on real traffic without exposing its output or performing side effects.
      It provides live-distribution evidence first; a canary or A/B test can follow once the risk constraint is met.

  # ---------------------------------------------------------------- numeric
  - id: D7-029
    version: 2
    type: numeric
    subtopic: eval.rag-agent
    tags: [eval.gates]
    competencies: [x.estimation]
    difficulty: 1
    level: apply
    time_s: 90
    stem: |
      A support agent succeeds on any given trial of a task with probability 0.85, independently across trials.
      The release criterion is that all 4 trials of a task succeed (pass^4). What is the probability, in percent, that
      a task meets the criterion?
    answer: {value: 52.2, tolerance: 0.3, tolerance_type: abs, unit: "%"}
    work: |
      pass^k = p^k = 0.85^4 = 0.5220, so 52.2%.
    explanation: |
      pass^k multiplies per-trial success, so it falls quickly with k. A common wrong approach is pass@4 =
      1 - 0.15^4 = 99.95%, which answers a different question (at least one success). Another is reporting the
      per-trial 85% as if it described consistency.

  - id: D7-030
    version: 2
    type: numeric
    subtopic: eval.gates
    tags: [eval.datasets]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 120
    stem: |
      A candidate prompt passes 80 of 100 independent eval cases. Using the normal approximation for a
      proportion, what is the half-width of the 95% confidence interval, in percentage points? Use z = 1.96.
    answer: {value: 7.84, tolerance: 0.3, tolerance_type: abs, unit: "pp"}
    work: |
      p = 0.80, n = 100. Standard error = sqrt(p(1-p)/n) = sqrt(0.16/100) = 0.04. Half-width = 1.96 x 0.04 = 0.0784,
      i.e. 7.84 percentage points (so roughly 72% to 88%).
    explanation: |
      Even at 100 cases the interval spans about 16 points, so a 3- or 4-point difference between two prompts is
      not evidence by itself. Common mistakes: quoting the standard error (4 pp) as if it were the 95% half-width,
      forgetting the square root (1.96 x 0.0016, about 0.3 pp), or forgetting to divide by n (1.96 x sqrt(0.16),
      about 78 pp).

  # ---------------------------------------------------------------- open
  - id: D7-031
    version: 2
    type: open
    subtopic: eval.gates
    tags: [comms.stakeholders, delivery.go-live]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 480
    stem: |
      A regional insurer's VP of Operations is impressed by a demo of your claims-triage assistant and wants to go live
      in three weeks. She asked for "a short note on how we will know it is good enough". Write the message you
      would send. Include what you will measure, what thresholds you propose to gate go-live, what you need from her
      team, and how you will roll out and monitor after go-live.
    rubric:
      - criterion: Bottom line first
        points: 2
        guidance: "2 if the message opens with a clear position the VP can act on, conditional on evidence (for example, go-live in three weeks if the assistant passes an agreed gate on her claims); 1 if the position is present but buried, overly technical, or an unconditional promise of the date; 0 if there is no usable position or it opens with background or a methods lecture."
      - criterion: Concrete measures tied to the business task
        points: 3
        guidance: "3 if it proposes a labelled set drawn from real claims with expert adjudication, task-specific metrics (e.g. correct triage class, recall on high-severity claims) and slice reporting or a second signal such as sampled expert review; 2 if the metrics are concrete but one of these is missing; 1 if only overall accuracy or a generic quality score; 0 if no meaningful measures."
      - criterion: Gate, thresholds and evidence
        points: 3
        guidance: "3 if it proposes thresholds or risk-based acceptance criteria per metric or slice, with a floor on critical cases, a baseline comparison and a rule for a failed or inconclusive result, and recognises that evidence on the critical slice depends on how many cases that slice contains, not on the overall sample; 2 if the gate is actionable but treats the baseline or the uncertainty thinly; 1 if only a vague target or a number with no decision rule; 0 if no gate. Credit any justified thresholds and sample sizes; the figures in the model answer are examples."
      - criterion: Client inputs and feasibility
        points: 2
        guidance: "2 if it names specific inputs (claims to label, reviewer time, an approver) with dates or dependencies inside the three weeks, without assuming availability the VP has not confirmed; 1 if it asks for relevant inputs without specifics or timing; 0 if it asks for nothing."
      - criterion: Rollout and monitoring
        points: 2
        guidance: "2 if it describes a staged or limited initial rollout proportionate to the risk, with live sampling or monitoring, an owner or review cadence, and misses fed back into the test set; 1 if follow-up is mentioned without ownership or a link to risk; 0 if none. Do not deduct here for an uncertainty caveat already scored under the gate."
    model_answer: |
      Bottom line: we can target go-live in three weeks, provided the assistant passes a quality gate on your own
      claims that we agree now. The gate, not the demo, decides.

      What we measure: your team adjudicates 150 recent claims, sampled across claim types and including at least
      50 high-severity ones. We compare the assistant's triage class with those labels and report overall accuracy,
      accuracy by claim type, and recall on high-severity claims. A senior adjuster also blind-reviews 50 outputs.

      Proposed gate: at least 90% overall accuracy, no claim type worse than your current manual triage, and at
      least 96% recall on high-severity claims (48 of 50), with every miss reviewed. If the high-severity bar
      fails, we do not go live, whatever the average. These samples are small: the overall figure is uncertain by
      about 5 points either way, and 50 cases cannot pin down recall precisely, so a borderline result means we
      label more claims before deciding rather than argue about it.

      What I need from you: 150 adjudicated claims and two adjusters for three half-days by the end of week one,
      and a named approver for the gate when we report at the end of week two.

      After go-live: we start with one team, an adjuster on your side reviews a random sample of live claims each
      week, and every miss joins the test set before we widen use.
    max_chars: 2000

  - id: D7-032
    version: 2
    type: open
    subtopic: eval.methods
    tags: [comms.tradeoffs]
    competencies: [x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 540
    stem: |
      Your team's LLM judge says prompt v3 beats v2 by 5 points on helpfulness across 300 cases. The client's
      support leads reviewed 30 of the same cases and say v3 is "wordier, not better". Your engineering manager asks
      for a short written assessment and recommendation before tomorrow's release meeting. Write it.
    rubric:
      - criterion: Clear recommendation up front
        points: 2
        guidance: "2 if it opens with a decision and its reason in one line; holding the release, or shipping only as a limited, separately gated experiment with a rollback condition, both earn full marks when justified by the risk and the evidence; 1 if the decision is buried or not tied to the evidence; 0 if missing or only descriptive."
      - criterion: Evidence-linked explanations
        points: 3
        guidance: "3 if it presents verbosity (length) bias as a hypothesis tied to the 'wordier' complaint and at least one other explanation linked to the facts, such as a rubric that rewards elaboration, leads who value brevity more than the rubric does, or how the 30 cases were chosen, and treats them as hypotheses to test; 2 if verbosity only, or several explanations listed without linking them to the evidence; 1 if only a generic 'the judge may be wrong'; 0 if none. Do not require named biases, such as position or self-preference, that the scenario gives no evidence for."
      - criterion: Specific verification plan
        points: 3
        guidance: "3 if it proposes relating judge scores to length and comparing judge verdicts with the leads' on the 30 shared cases, expanding the blind human-labelled sample, and re-scoring with a revised rubric or a length-controlled comparison (credit equivalent tests); 2 if two of these; 1 if one; 0 if none. A score-length correlation counts as a diagnostic, not as proof that length caused the gain."
      - criterion: Weighs both signals fairly
        points: 2
        guidance: "2 if it treats neither signal as conclusive and reasons about their quality (30 expert cases are few; the judge covers 300 but is unvalidated; how cases were selected and whether reviewers were blind) rather than counting cases; 1 if it dismisses one signal or treats 300 versus 30 as a simple vote; 0 if it ignores one."
      - criterion: Decision rule and next step
        points: 2
        guidance: "2 if it states what result would allow shipping v3 (or confirm keeping v2) and when that will be decided; credit any reasonable, justified criterion, provided an agreement figure is not raw agreement dominated by one verdict; 1 if a timeline without criteria, or criteria without a timeline; 0 if none."
    model_answer: |
      Recommendation: do not ship v3 on the strength of the judge score. Hold until we show that the 5-point gain
      reflects quality rather than length.

      Why: v3's answers are longer, the support leads read them as padding, and LLM judges often reward length.
      That is the leading hypothesis, not the only one: our rubric may reward elaboration the leads do not value,
      and the 30 cases they reviewed may not be typical. Their sample is small and the judge's is large but
      unvalidated, so I treat the judge result as unproven, not disproved.

      Today and tomorrow morning: (1) check how judge score tracks answer length across the 300 cases and, on the 30
      shared cases, compare the judge's verdicts with the leads'; (2) ask the leads to label 70 more cases blind and
      in randomised order, so we have 100; (3) rerun v2 vs v3 with a revised rubric that defines concrete pass/fail
      criteria (correct, complete, concise) and with a length-controlled comparison.

      Decision rule, fixed before we see the results: ship v3 if it still wins on the revised rubric and the
      length-controlled comparison, the judge matches the leads on most cases where they prefer one version, and
      the leads' blind preference is no worse than v2. If the result is still ambiguous, keep v2.

      I'll bring the length analysis and the human agreement numbers to the release meeting.
    max_chars: 2000

  # ---------------------------------------------------------------- audio
  - id: D7-033
    version: 1
    type: audio
    subtopic: eval.online
    tags: [eval.gates, comms.stakeholders]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      A non-technical COO at your client says: "The team told me the assistant passes 92% of its tests. Why do you
      keep talking about monitoring after launch? Isn't 92% good enough?" Answer out loud.
    rubric:
      - criterion: Direct answer in plain language
        points: 2
        guidance: 2 if it answers directly in the first sentences without jargon (92% is a starting point, not a guarantee); 1 if the point is there but jargon-heavy; 0 if it dodges.
      - criterion: Explains why the test score is not enough
        points: 3
        guidance: 3 if it explains that tests cover only the cases we thought of and real traffic changes over time (new products, new wording, new documents), and that averages can hide serious failure types; 2 if one reason; 1 if vague; 0 if missing.
      - criterion: Describes what online monitoring would do
        points: 3
        guidance: 3 if it describes sampling live conversations for review, tracking a quality metric and alerting, and adding found failures to the tests; 2 if two of these; 1 if one; 0 if none.
      - criterion: Ties to business risk and a clear ask
        points: 2
        guidance: 2 if it links to cost of errors and asks for a specific commitment (reviewer time, owner, review cadence); 1 if only one; 0 if neither.
    model_answer: |
      Short answer: 92% is a good start, not a guarantee. It tells us how the assistant did on the questions we
      thought to ask before launch.

      Real customers will ask things we did not predict, and what they ask changes: a new product, a policy update
      or a new way of phrasing. So the same assistant can get worse in the field while the test score stays at 92%.
      Also, the 92% is an average. If the remaining 8% are the high-risk cases, such as refunds or compliance
      questions, that matters more than the headline.

      Monitoring is how we stay honest. Each week we pick a random sample of real conversations, have someone
      review them, and track how many are right. We set an alert if that number drops. Every failure we find goes
      into the test set, so the 92% gets more meaningful over time.

      What I need from you is someone on your side who owns a one-hour weekly review and agrees on what quality we must hold.
      That is a small cost compared with one wrong answer reaching a customer unnoticed.
    
  # ---------------------------------------------------------------- sql
  - id: D7-034
    version: 1
    type: sql
    subtopic: eval.gates
    tags: [data.sql]
    competencies: [x.sql]
    difficulty: 2
    level: apply
    time_s: 420
    stem: |
      Tables `runs(run_id, prompt_version, run_date)` and `results(run_id, case_id, slice, passed)` store eval
      outputs (`passed` is 1 or 0). For each `prompt_version` that has been evaluated in at least 2 distinct runs,
      return `prompt_version`, `runs` (distinct run count), `n_results` (total result rows) and `pass_rate` (sum of
      `passed` over all of that version's result rows divided by the number of those rows, rounded to 3 decimals). Order by `pass_rate` descending, then `prompt_version`.
    sql:
      setup: |
        CREATE TABLE runs(run_id TEXT, prompt_version TEXT, run_date TEXT);
        CREATE TABLE results(run_id TEXT, case_id TEXT, slice TEXT, passed INT);
        INSERT INTO runs VALUES ('r1','v1','2026-09-01'),('r2','v1','2026-09-08'),('r3','v2','2026-09-15'),('r4','v2','2026-09-22'),('r5','v3','2026-10-01');
        INSERT INTO results VALUES
        ('r1','c1','billing',1),('r1','c2','billing',0),('r1','c3','refusal',1),('r1','c4','refusal',1),
        ('r2','c1','billing',1),('r2','c2','billing',1),('r2','c3','refusal',0),('r2','c4','refusal',1),
        ('r3','c1','billing',1),('r3','c2','billing',1),('r3','c3','refusal',1),('r3','c4','refusal',0),
        ('r4','c1','billing',1),('r4','c2','billing',1),('r4','c3','refusal',1),
        ('r5','c1','billing',1),('r5','c2','billing',1),('r5','c3','refusal',1),('r5','c4','refusal',1);
      reference: |
        SELECT r.prompt_version,
               COUNT(DISTINCT r.run_id) AS runs,
               COUNT(*) AS n_results,
               ROUND(SUM(x.passed) * 1.0 / COUNT(*), 3) AS pass_rate
        FROM runs r JOIN results x ON x.run_id = r.run_id
        GROUP BY r.prompt_version
        HAVING COUNT(DISTINCT r.run_id) >= 2
        ORDER BY pass_rate DESC, r.prompt_version
      order_matters: true
      float_round: 3
    explanation: |
      Join runs to results, aggregate per version, and filter groups with HAVING. Multiply by 1.0 so SQLite does not
      do integer division, and count DISTINCT run_id because every run contributes many result rows. The pass rate is
      pooled over all result rows of a version (run r4 has one fewer row), not an average of per-run rates.

  - id: D7-035
    version: 1
    type: sql
    subtopic: eval.gates
    tags: [data.sql, eval.datasets]
    competencies: [x.sql]
    difficulty: 3
    level: analyze
    time_s: 600
    stem: |
      Table `results(run_id, case_id, slice, passed)` holds eval outcomes for runs `'base'` and `'cand'`. A
      regression is a case that passed in `'base'` and failed in `'cand'`. Cases missing from `'cand'` are not
      regressions. Return `case_id` and `slice` for every regression, ordered by `case_id`.
    sql:
      setup: |
        CREATE TABLE results(run_id TEXT, case_id TEXT, slice TEXT, passed INT);
        INSERT INTO results VALUES
        ('base','c1','billing',1),('base','c2','billing',1),('base','c3','refusal',1),('base','c4','refusal',0),
        ('base','c5','refusal',1),('base','c6','billing',0),('base','c7','billing',1),
        ('cand','c1','billing',1),('cand','c2','billing',0),('cand','c3','refusal',0),('cand','c4','refusal',1),
        ('cand','c5','refusal',1),('cand','c6','billing',0),('cand','c8','billing',0);
      reference: |
        SELECT b.case_id, b.slice
        FROM results b
        JOIN results c ON c.case_id = b.case_id AND c.run_id = 'cand'
        WHERE b.run_id = 'base' AND b.passed = 1 AND c.passed = 0
        ORDER BY b.case_id
      order_matters: true
      float_round: 2
    explanation: |
      Self-join the table on `case_id`, one side filtered to each run. An inner join drops cases absent from the
      candidate run, which is the required behaviour; a LEFT JOIN with `passed IS NOT 1` would wrongly flag c7.
