domain: D2
items:
  # ===================== discovery.framing =====================
  - id: D2-001
    version: 2
    type: single
    subtopic: discovery.framing
    competencies: [x.decomposition]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A hospital network's supply-chain director asks you to build 'a chatbot so nurses can find supplies faster'.
      In week one you confirm that the inventory system matches physical counts in spot checks and that every item
      has a shelf location. Nurses still complain loudly about hunting for supplies. What is the best next step?
    options:
      - text: "Shadow nurses across several shifts and time each search from the moment of need to the item in hand"
        correct: true
        why: "Timed observation covers the whole search, inside and outside the system, so it shows where the minutes go. With the data already accurate, a lookup chatbot may not touch the cause."
      - text: "Analyze the inventory system's search and pick logs to see which items and wards generate the most lookups"
        why: "Useful later, but logs cover only the part of a search that happens in the system. The checks so far leave the rest of the journey unexplained: walking, locked rooms, empty bins."
        misconception: "System data shows the whole workflow"
      - text: "Build a thin chatbot over the inventory data and measure whether nurses use it over two weeks"
        why: "If searches are slow for reasons other than lookup, a lookup chatbot cannot help, and low usage would not tell you why."
        misconception: "Building the requested thing is the fastest way to learn"
      - text: "Interview a dozen nurses and their ward managers about why supplies are hard to find, and group the answers"
        why: "Good for gathering complaints and leads, but recalled accounts rarely give the timed, step-by-step picture needed to locate where each search loses time."
        misconception: "Interviews are sufficient discovery"
    explanation: |
      The stated request is a solution, not a problem. Before building, find out what actually happens in the
      workflow. Here the data checks have ruled out one cause without explaining the delay, so the gap is the
      physical journey from need to item in hand, which timed observation measures directly. Interviews and system
      logs remain useful complements: interviews point to where to look, and logs size what happens in the system.
      Triangulating them with observation can overturn the assumed solution entirely.
    refs: [https://www.gov.uk/service-manual/user-research/user-research-in-discovery]

  - id: D2-002
    version: 2
    type: single
    subtopic: discovery.framing
    competencies: [x.decomposition]
    difficulty: 2
    level: apply
    time_s: 75
    stem: |
      An online retailer's operations VP says returns take too long to process and wants AI to fix it. Returns
      arrive by mail, at stores and through third-party marketplace partners. Whatever the channel, each return
      goes through the same steps in order (receipt, inspection, disposition decision, refund, restocking), and the
      system timestamps each step's completion. You are building an issue tree for 'where does the time go?'.
      Which first-level split is mutually exclusive and collectively exhaustive?
    options:
      - text: "Time between consecutive step timestamps, from receipt to restocking"
        correct: true
        why: "Consecutive intervals partition each return's elapsed time: every hour, including waiting and rework, falls into exactly one interval, and together they cover the whole process."
      - text: "Elapsed time per intake channel: mail-in returns and in-store returns"
        why: "Marketplace returns fall into neither branch, so the split is not collectively exhaustive."
        misconception: "A split along a natural dimension is automatically complete"
      - text: "Contributing causes: staffing, tooling, volume spikes, data quality and process design"
        why: "A brainstormed cause list overlaps (tooling and process design) and nothing proves it is complete."
        misconception: "A list of plausible causes is a decomposition"
      - text: "Delay broken down by product category and also by the warehouse site that handled it"
        why: "These are two different cuts of the same returns, so every return appears under both; they are not parts of one split."
        misconception: "Listing several useful dimensions makes a tree"
    explanation: |
      MECE means each element belongs to exactly one branch and no element is left out. Splitting a process into
      the intervals between consecutive timestamped milestones is a dependable way to get this for elapsed time:
      waiting and rework land in the interval where they happen, and nothing is counted twice. Stage names alone
      are not enough when steps can overlap or run in parallel; the boundaries have to be defined. Splits by channel
      or site are only exhaustive if every value is listed; causes belong at the next level, as hypotheses under the
      interval where time is actually lost.
    refs: [https://en.wikipedia.org/wiki/MECE_principle]

  - id: D2-003
    version: 2
    type: multi
    subtopic: discovery.framing
    tags: [comms.stakeholders]
    competencies: [x.decomposition]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      A health insurer's claims adjusters would use your tool daily. Their VP of Claims is buying it, and the CFO
      sponsors it to reduce loss-adjustment expense. Which discovery actions fit this situation?
    options:
      - text: "Capture each group's definition of success separately: minutes per claim, the VP's backlog, the CFO's expense figure"
        correct: true
        why: "Users, buyer and sponsor want different things; a project that tracks only one can succeed on paper and fail with the others."
      - text: "Watch adjusters work live claims instead of relying on the VP's description of their day"
        correct: true
        why: "The people who will use the tool hold the workflow knowledge, and managers' accounts of it are secondhand."
      - text: "Trace how the changes adjusters would actually adopt are expected to move the CFO's expense figure"
        correct: true
        why: "If the sponsor's savings do not follow from work changes the users will take up, the tool can be adopted and still miss the sponsor's outcome."
      - text: "Ask the VP to nominate a few experienced adjusters to review the requirements list, then freeze it"
        why: "Nominees tend to be the manager's trusted voices, and reviewing a list is not seeing the work; friction nobody wrote down never surfaces."
        misconception: "A manager-picked sample counts as user research"
      - text: "Anchor everything on the CFO's expense target, since the sponsor decides whether funding continues"
        why: "A tool that hits the number on paper but that adjusters route around saves nothing; adoption and the sponsor's outcome must be examined together."
        misconception: "The sponsor's metric is the only one that matters"
      - text: "Run a workshop where adjusters vote on the features they want most, and build the top-voted ones"
        why: "Stated wishes are not observed friction, and the top-voted features may have no link to where the sponsor's savings come from."
        misconception: "A voted wish list is discovery output"
    explanation: |
      Users, buyers and sponsors are often different people with different success measures. Good discovery keeps
      them distinct, learns user needs first-hand, and checks the causal link between them: the change in work that
      users will adopt should be what produces the sponsor's outcome, even if the two show up at different steps.

  - id: D2-004
    version: 1
    type: single
    subtopic: discovery.framing
    tags: [comms.stakeholders]
    competencies: [x.decomposition]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A manufacturer's COO asked for an ML model that predicts machine failures, and the contract names it as the
      deliverable. After two weeks on the floor you find that maintenance planners already know which machines are
      fragile. The real losses come from replacement parts taking about three weeks to arrive once a failure is
      called. Sensor history suggests failures can be flagged only two or three days ahead at best. What do you do?
    options:
      - text: "Show the COO the downtime data and propose stocking spares for the fragile machines first, amending the deliverable"
        correct: true
        why: "Floor evidence shows where the money is lost; reframing with the sponsor, not around them, keeps trust and aims effort at the real constraint."
      - text: "Build the predictor as contracted and use its alerts to trigger parts orders, so it also addresses the delay"
        why: "A warning two or three days ahead cannot beat a three-week lead time, so the parts would still arrive after the failure."
        misconception: "A prediction fixes any lead-time problem"
      - text: "Build the predictor as contracted and report the parts finding to the COO in the final report"
        why: "It delivers what was asked while knowingly leaving most of the loss untouched; the sponsor learns the finding too late to act."
        misconception: "Contract wording defines the problem"
      - text: "Take the finding to procurement leadership so the delay is fixed there while you deliver the predictor as contracted"
        why: "It looks constructive but goes around the sponsor, who owns the outcome and the contract, and still delivers a model that leaves the main loss in place."
        misconception: "Fix the root cause with whoever owns it, sponsor or not"
    explanation: |
      The stated deliverable is a hypothesis about how to solve the problem. When observation contradicts it, bring
      the evidence to the sponsor and propose a reframe; do not silently deliver the wrong thing, and do not route
      around the person who owns the outcome. Here the prediction horizon (days) is far shorter than the parts lead
      time (weeks), so a better predictor alone cannot remove the loss, while stocking spares for machines the
      planners already know are fragile can.

  - id: D2-005
    version: 1
    type: single
    subtopic: discovery.framing
    difficulty: 2
    level: apply
    time_s: 70
    stem: |
      A bank's operations head asks for an LLM to summarize recorded customer calls. Agents currently type a
      wrap-up note after each call. You have thirty minutes with her. Which question is most likely to expose the
      underlying problem?
    options:
      - text: "Who reads the wrap-up notes today, and what do they do with them next?"
        correct: true
        why: "It surfaces the decision or action the notes feed, which defines the value and what 'good' means."
      - text: "Which problems from last quarter would automatic summaries have prevented?"
        why: "It presumes summaries are the remedy and invites examples that confirm it, instead of showing what actually goes wrong."
        misconception: "Leading questions are efficient discovery"
      - text: "What accuracy would you need before you trusted an automatic summary?"
        why: "It jumps to an acceptance bar for a solution before the need is understood, and the answer will mirror whatever she imagines."
        misconception: "Acceptance criteria come first"
      - text: "Which compliance teams must approve the use of call recordings?"
        why: "A real constraint worth asking soon, but it does not reveal the problem being solved."
        misconception: "Risk questions come before value questions"
    explanation: |
      Ask about the consuming workflow, not the artifact. The answer reveals who benefits, which action should
      change, and what measure shows it worked. Questions that presuppose the solution, or specify it, get
      answers shaped by the solution.

  - id: D2-006
    version: 1
    type: single
    subtopic: discovery.framing
    tags: [discovery.selection]
    competencies: [x.decomposition]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A subscription-software CEO says: 'Churn is up. Use AI to predict and stop it.' You have two years of billing
      history, product usage logs and support tickets. What is the most useful first analytical step to decide what
      kind of project this is?
    options:
      - text: "Split churned accounts into voluntary cancellations and failed-payment lapses, by tenure cohort, using billing data"
        correct: true
        why: "It breaks the vague problem into non-overlapping parts quickly and cheaply, and may show that much of the churn is a payment-retry problem, not a prediction problem."
      - text: "Train a churn model on every available feature, then review its top predictors for likely causes"
        why: "Feature importance reflects correlation and the data's quirks, and it jumps to a solution before the problem is sized."
        misconception: "A predictive model is a discovery tool"
      - text: "Segment churned accounts by plan, acquisition channel and usage trend in the product logs to see where churn concentrates"
        why: "A sound later step, but it assumes the churn is voluntary and product-driven; if many lapses are failed payments it is built on the wrong population."
        misconception: "Behavioral segmentation is the first cut"
      - text: "Ask customer success for the ten most common churn reasons and rank them by how often they hear each"
        why: "Anecdotes are biased toward memorable calls; the billing data can size the same question exactly."
        misconception: "Frontline anecdote is the best source of cause"
    explanation: |
      Decompose first and size the pieces with data you already have. Voluntary versus involuntary churn, and
      tenure cohorts, can redirect the whole project before any model is built.

  - id: D2-007
    version: 2
    type: multi
    subtopic: discovery.framing
    tags: [discovery.environment]
    competencies: [x.decomposition]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      It is Monday of an engagement that began with 'make our dispatchers more efficient'. By Friday you are to show
      the sponsor, with evidence, where this client's dispatchers lose time. Which activities belong in this first
      week?
    options:
      - text: "Write two or three testable hypotheses about where dispatcher time is lost, each naming the data that would confirm it"
        correct: true
        why: "Hypotheses turn a vague goal into checks you can run, and naming the data shows what to request early."
      - text: "Pull timestamps from the dispatch system to measure how long each step of a job takes today"
        correct: true
        why: "A measured baseline shows where time is spent and later proves any improvement."
      - text: "Sit in on live dispatch shifts and note workarounds such as sticky notes and side spreadsheets"
        correct: true
        why: "Workarounds are evidence of unmet needs that dispatchers rarely mention in interviews."
      - text: "Interview each department head in turn and merge their wishes into a single requirements document"
        why: "It yields a wish list without evidence of where time is lost, and it favors whoever speaks most confidently."
        misconception: "Consolidated requirements are discovery output"
      - text: "Compare the client's dispatch metrics with published industry averages to find the biggest gap"
        why: "Useful context later, but a gap against other operations' averages does not show where in this client's workflow the time goes, which is what Friday needs."
        misconception: "External benchmarks locate the problem"
      - text: "Run a two-day workshop with all stakeholders to map the ideal future dispatch process"
        why: "Designing a future state before the current one is measured builds on assumptions; week one should produce evidence."
        misconception: "Future-state design is where discovery starts"
    explanation: |
      When the first week's job is to locate the problem, it should produce client-specific evidence: hypotheses, a
      measured baseline, and direct observation of the work. Consolidated requirements and future-state designs come
      after the problem is located; external benchmarks can add context but do not locate it.

  # ===================== discovery.selection =====================
  - id: D2-008
    version: 1
    type: single
    subtopic: discovery.selection
    tags: [gov.approvals]
    difficulty: 2
    level: evaluate
    time_s: 120
    stem: |
      At an industrial distributor you have shortlisted four candidate use cases and can start only one:

      1. **Contract clause extraction** for legal review. The General Counsel is the champion and contracts sit in
         one repository. Legal logs review hours, so a baseline exists, and a lawyer checks every output. Savings
         are modest: about 400 contracts a year.
      2. **Network-wide demand forecasting.** Very large potential savings, but data is spread over nine ERPs with
         no common product ID, nobody has measured current forecast accuracy, and the sponsor is an innovation team.
      3. **HR policy Q&A assistant.** The head of HR is enthusiastic and it would be quick to build, but HR cannot
         say what it would change or how success would be measured.
      4. **Automatic customer-refund approval.** High value, accessible data and an enthusiastic CFO, but errors
         pay out money, no human reviews approvals, and the process falls under audit rules.

      Which should go first?
    options:
      - text: "Contract clause extraction: a measurable baseline and a human check make a credible first result likely"
        correct: true
        why: "It has a champion who will act, a baseline in logged hours, available data and a built-in safety net; modest savings are the price of a quick, credible result."
      - text: "Demand forecasting: the size of the prize justifies the data-integration effort, since savings at that scale repay it"
        why: "Without a common product ID, a baseline or a real sponsor, the integration work would consume the engagement before value is shown."
        misconception: "Choose the biggest prize first"
      - text: "HR policy assistant: an engaged owner and a quick build give the earliest visible result"
        why: "Quick and wanted, but with no measurable outcome the result is a demo with nothing to prove."
        misconception: "Easiest to build, with a keen owner, means best first project"
      - text: "Automatic refunds: sponsor strength and data readiness outweigh the audit exposure, which can be managed later"
        why: "Autonomous payouts under audit rules need controls and approvals that lengthen the path; sponsor and data are necessary but not enough."
        misconception: "Sponsorship and data readiness cancel out risk"
    explanation: |
      Pick the first problem on several axes together: value, feasibility, data availability, risk and sponsorship.
      The best first project is not the largest or the easiest. It has a measurable baseline, a champion who will
      act on the result, and an error profile you can safely manage.

  - id: D2-009
    version: 1
    type: single
    subtopic: discovery.selection
    tags: [agents.when]
    difficulty: 2
    level: apply
    time_s: 80
    stem: |
      A client's support team routes inbound email into six queues. Customers choose a product name in a required
      dropdown on the contact form, and the queue follows directly from that field. About 80% of emails name a
      product and are routed correctly; misroutes among them are rare. The other 20% pick 'Other / not sure' and
      land in a triage queue where two people read each email and move it by hand. A manager wants an LLM to
      'make routing smarter'. What do you recommend?
    options:
      - text: "Keep the dropdown lookup for emails that name a product and use an LLM only on the 'Other' emails"
        correct: true
        why: "The rule is exact, free and auditable where it works; the model goes where inputs are open-ended and there is a measurable manual baseline to beat."
      - text: "Drop the dropdown and have an LLM read every email body and route it, so customers do not have to choose"
        why: "It replaces an exact rule that already works on 80% of traffic with a model that adds cost, latency and new errors; the problem is confined to the other 20%."
        misconception: "A fully AI-driven flow is the better product"
      - text: "Leave routing unchanged, because a rule-based flow that mostly works is not a place for AI"
        why: "The 20% residual is free-text interpretation done by two people by hand, which is where a model adds value and can be measured."
        misconception: "If part of a flow is rules, leave the whole flow alone"
      - text: "Run an LLM over every email in shadow mode for a month and switch to it if it beats the dropdown's accuracy"
        why: "Evidence-first sounds rigorous, but the dropdown is already accurate on most traffic, so most of the month measures where there is no headroom."
        misconception: "Testing always pays off regardless of headroom"
    explanation: |
      Check whether AI is needed at all, and where. A deterministic rule that already solves part of the problem
      should stay; spend model effort only on the portion where inputs are genuinely open-ended and a manual
      baseline exists.

  - id: D2-010
    version: 1
    type: single
    subtopic: discovery.selection
    tags: [delivery.scoping]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      A telecom's B2B operations director wants an assistant to 'cut order-to-activation time' and asks for a
      prototype in four weeks. Asked how long activation takes now, she says 'around ten days'. Nobody has measured
      it. The order system stamps each stage, but account managers often key an order in a few days after the
      customer signs. How do you establish the baseline?
    options:
      - text: "Pull stage timestamps for recent months, then trace a sample of orders end to end to see what the stamps miss"
        correct: true
        why: "The data exists and is cheap to extract; checking a sample end to end exposes the days before order entry that the system never records."
      - text: "Accept the director's ten-day estimate and measure again once the assistant has launched"
        why: "A remembered average hides the spread and can embarrass both sides when real data disagrees later."
        misconception: "A stakeholder's estimate is a baseline"
      - text: "Pull stage timestamps for recent months and use order-entry-to-activation durations as the baseline"
        why: "Quick and data-based, but the clock starts at order entry, so the baseline is understated and gains are measured from the wrong start."
        misconception: "System timestamps tell the whole story"
      - text: "Have account managers log every new order by hand for the next four weeks and use that as the baseline"
        why: "It delivers the baseline only at the end of the prototype window, depends on people logging faithfully, and ignores months of existing history."
        misconception: "Purpose-built measurement beats existing data"
    explanation: |
      A measurable baseline must exist before you build, or no result can be shown. Extract what the systems
      already record, then check what the recorded clock leaves out by tracing a sample end to end.

  - id: D2-011
    version: 2
    type: multi
    subtopic: discovery.selection
    tags: [gov.identity]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      You are screening a candidate for the client's first AI project. Which findings, each on its own, should make
      you hesitate to choose it?
    options:
      - text: "The person who would act on the outputs has not agreed to change how they work"
        correct: true
        why: "Without someone committed to act on the output, even accurate results change nothing."
      - text: "No data the client already collects can show whether the outcome improved"
        correct: true
        why: "Without a measurable outcome the project cannot show value, and instrumentation could take longer than building."
      - text: "The needed data lives in systems where access approval typically takes months"
        correct: true
        why: "Access lead time can consume the whole engagement before any build begins."
      - text: "The current process runs on spreadsheets and email rather than a dedicated system"
        why: "That is often a sweet spot: high manual effort, little existing automation, and a low bar for improvement."
        misconception: "Informal tooling signals low value"
      - text: "A known share of today's manual outputs contains errors"
        why: "A known error rate is a baseline to beat and is useful for setting an acceptance target."
        misconception: "Existing errors make the process too risky to automate"
      - text: "Most of the input is scanned documents and free text rather than database fields"
        why: "Unstructured input is a common fit for language models. Scan quality and parsing effort need checking, but the input type alone is not a reason to hesitate."
        misconception: "Messy inputs mean low feasibility"
    explanation: |
      Red flags are missing ownership, no way to measure, and blocked data. Manual, messy or error-prone processes
      are often good candidates because they supply the baseline and the headroom, although messy inputs still need
      a quick check of quality and parsing effort.

  - id: D2-012
    version: 2
    type: single
    subtopic: discovery.selection
    tags: [comms.stakeholders, discovery.environment]
    difficulty: 3
    level: evaluate
    time_s: 120
    stem: |
      You can fund one eight-week effort. Option X is claims-document triage: clean data and a supportive operations
      manager, who cannot approve changes to adjusters' workflow and has no executive backing the work. Option Y is
      the CEO's pricing optimizer: the CEO has promised the board a result in ten weeks, but sales data lives in
      regional spreadsheets whose definitions of 'discount' differ in ways nobody has quantified. Which approach is
      best?
    options:
      - text: "Gate the pricing project on a two-week data check and secure an empowered owner for the claims fallback"
        correct: true
        why: "It uses the sponsor's backing while testing the biggest risk cheaply. Securing someone who can approve workflow changes in parallel makes triage a real fallback, so a failed check costs two weeks, not eight."
      - text: "Choose claims triage, because data readiness predicts delivery better than executive enthusiasm does"
        why: "Without anyone able to approve workflow changes, a working triage tool stalls at adoption, however clean the data."
        misconception: "Technical feasibility outweighs organizational backing"
      - text: "Choose the pricing project and make reconciling the regional data the core work of the eight weeks"
        why: "Committing the whole timebox to data cleanup of unknown scope risks delivering a clean dataset and no optimizer."
        misconception: "Strong sponsorship overcomes poor data"
      - text: "Decline both for now and ask the client to name a claims sponsor and agree discount definitions first"
        why: "Neither gap has to close before work starts: the engagement can test the pricing data itself in two weeks and pursue a claims owner in parallel."
        misconception: "Prerequisites must be complete before starting"
    explanation: |
      Sponsorship and feasibility both matter. When they are split across candidates, bound the risk of the
      sponsored option with a short feasibility gate that has an agreed pass condition. A fallback is only credible
      if it is viable: here that means an owner who can change the adjusters' workflow, arranged while the gate
      runs. If neither path clears its condition, recommending a stop or a change of scope is a legitimate outcome.
    refs: [https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works]

  # ===================== discovery.environment =====================
  - id: D2-013
    version: 1
    type: single
    subtopic: discovery.environment
    tags: [comms.stakeholders, data.modeling]
    competencies: [x.decomposition]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      Two teams at a retail bank give you customer counts for the same pilot: Finance reports 12,400 'active
      customers' and the CRM team reports 15,100. Your use case targets active customers, and the sponsor assumes
      one of the numbers is simply wrong. What is the best way to proceed?
    options:
      - text: "Trace how each team computes 'active', then agree with the sponsor which definition fits the use case"
        correct: true
        why: "The gap is probably definitional, not an error; tracing each calculation shows what is counted and lets you choose deliberately."
      - text: "Use Finance's figure, since it feeds audited reports"
        why: "Audited means consistent with a reporting rule, not right for this use case; a financial definition may exclude customers you want to reach."
        misconception: "The audited number is the correct one"
      - text: "Use the CRM figure, since it is closest to the live customer records the system will read"
        why: "Proximity to the source says nothing about whether the definition matches the use case; CRM 'active' may include dormant records."
        misconception: "Closest to the source means right"
      - text: "Sample a hundred customers, check by hand which are really active, and adopt whichever figure comes closer"
        why: "It needs a definition of 'really active' to judge by, which is the open question; a sample picks a winner without settling what the use case needs."
        misconception: "Sampling settles a definitional gap"
    explanation: |
      In an unfamiliar organization the same word often means different things to different teams. Trace each
      number back to its calculation, find the owner of each definition, and decide with the sponsor which one
      serves the use case, then write it down.

  - id: D2-014
    version: 1
    type: single
    subtopic: discovery.environment
    tags: [gov.identity, comms.stakeholders]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      Your team needs read access to a customer's production claims database. The security review normally takes six
      weeks, and the sponsor wants a working demo in four. What do you do?
    options:
      - text: "File the narrowest access request now and work meanwhile from a small client-approved extract"
        correct: true
        why: "A narrow request is easier to approve, and an approved real-data sample lets design and testing meet real data before access lands."
      - text: "Request broad read access to the whole claims database now so later questions need no new approvals"
        why: "Broad scopes draw stricter and longer review and may be refused; the narrow request is the one most likely to clear early."
        misconception: "Ask once for everything to avoid repeat approvals"
      - text: "Build the whole pipeline on synthetic data and swap in real data once access is granted"
        why: "Real data holds the surprises (nulls, odd formats, code values); finding them in week six instead of week one wrecks the schedule."
        misconception: "Synthetic data is an equivalent substitute for real data"
      - text: "Ask the sponsor to compress the review to two weeks and pause build work until it clears"
        why: "Asking the sponsor to push is reasonable alongside other steps, but halting work turns a delay into idle time."
        misconception: "Escalation alone solves access lead time"
    explanation: |
      Access lead time is a schedule risk to manage from day one: request the minimum, in writing, immediately, and
      keep working on approved data. Real samples expose data surprises early; synthetic data hides them.

  - id: D2-015
    version: 2
    type: multi
    subtopic: discovery.environment
    tags: [gov.audit-compliance]
    difficulty: 1
    level: apply
    time_s: 80
    stem: |
      Before choosing a use case at a freight broker, you build a first-pass inventory of the data sources and access
      paths a solution might depend on, to inform scope and schedule. What belongs in it for each source?
    options:
      - text: "The owner, who approves access, and the typical approval lead time"
        correct: true
        why: "Access lead time and the right approver decide when the work can start."
      - text: "How current the data is and how often it refreshes"
        correct: true
        why: "Staleness decides whether a use case is viable at all, for example live shipment tracking against a nightly feed."
      - text: "Its sensitivity classification and any handling restrictions"
        correct: true
        why: "Restrictions on personal or contractual data shape where the data may go, who may see it, and which models can touch it."
      - text: "A newly written column-level data dictionary wherever none exists"
        why: "Link existing dictionaries where they exist; writing new ones for every source delays the start and mostly documents fields no use case will touch."
        misconception: "Completeness beats relevance in inventories"
      - text: "A target schema that maps each source's fields into one unified model"
        why: "That is design work; doing it for every source before the use case is chosen maps fields that will never be used."
        misconception: "Integration design belongs in the inventory"
      - text: "A full data-quality profile of every source, with null rates per column"
        why: "Valuable for the one or two sources the first use case depends on; across all of them it is weeks of work before you know which matter."
        misconception: "Profile everything before choosing"
    explanation: |
      A first-pass discovery inventory answers who owns the data, how fast access can be granted, how fresh it is
      and what rules govern it. Those facts decide scope and schedule. Note existing documentation where it exists,
      but new dictionaries, profiles and target models are better done for the sources the first use case needs.

  - id: D2-016
    version: 1
    type: single
    subtopic: discovery.environment
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      In a logistics company's 20-year-old scheduling system, shipments with status code 7 behave differently in
      the nightly batch, and nothing documents why. One senior planner knows, and she retires in three weeks; her
      final week is already booked with handover meetings. The batch logic is thousands of lines of undocumented
      procedural code. Your use case depends on shipment status. What do you do first?
    options:
      - text: "Start sessions with her this week on the status codes you use, and check each answer against code and data"
        correct: true
        why: "Her knowledge is the scarcest, perishable asset; targeted sessions capture it and checking against code and data catches memory errors."
      - text: "Spend the first week reading the batch code and data to form hypotheses, then use her remaining time to confirm them"
        why: "Good technique at the wrong time: it burns a third of the window before capturing anything from a source that cannot be recovered."
        misconception: "Arrive fully prepared before using the expert's time"
      - text: "Ask her to write a handover document covering the whole scheduling system before she leaves"
        why: "A broad document is slow to write and unfocused, and unverified claims get baked into your design."
        misconception: "Documentation is the best way to transfer expertise"
      - text: "Have a junior planner shadow her for the three weeks and rely on that person for answers afterward"
        why: "It adds a middleman who learns what she happens to mention, not what your use case needs, and nothing is checked against code or data."
        misconception: "Succession by shadowing transfers the knowledge"
    explanation: |
      Tribal knowledge is perishable. Capture it early and in a focused way, then verify it against the system's
      actual behavior; neither memory nor code archaeology is reliable alone. Preparation is worthwhile only when
      the expert's time is not the scarcest resource.

  - id: D2-017
    version: 1
    type: single
    subtopic: discovery.environment
    tags: [eval.datasets, rag.ingestion]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      Two weeks in, your document-extraction prototype scores very well on 200 documents that client analysts
      hand-picked as 'typical'. The sponsor wants to demo it to the steering group on Friday, three days away, and
      says production documents are 'basically the same'. Analysts can label about 100 documents in that time. What
      do you do before the demo?
    options:
      - text: "Draw about 100 documents at random from production, have analysts label them, and show those results alongside"
        correct: true
        why: "A random production sample reveals the scans, formats and edge cases that curation removed, before the sponsor's expectations harden."
      - text: "Demo the curated results but say in the meeting that production performance is untested, and agree what the demo can claim"
        why: "Honest, but the headline number is what people remember, and a random sample is affordable before Friday."
        misconception: "Caveats neutralize misleading numbers"
      - text: "Ask analysts to add 100 hand-picked 'difficult' documents and report both sets"
        why: "Difficult documents chosen by the same people are still a curated set; they show a range but not the real mix."
        misconception: "Adding hard cases fixes selection bias"
      - text: "Postpone the demo until ingestion handles every production source and format"
        why: "Waiting for full ingestion is slow; a random sample from the repository answers the question now."
        misconception: "Do not show anything until complete"
    explanation: |
      Hand-picked samples overstate performance. Prototyping on real, randomly drawn data early finds the
      problems that matter while they are cheap to fix and before stakeholders anchor on flattering numbers.


  # ===================== delivery.scoping =====================
  - id: D2-018
    version: 1
    type: single
    subtopic: delivery.scoping
    difficulty: 2
    level: apply
    time_s: 70
    stem: |
      After a two-week proof of concept on sample documents, you propose a pilot. The client's COO asks what will be
      different. Which answer is most accurate?
    options:
      - text: "Limited real users work on live data in their normal workflow, judged against pre-agreed metrics"
        correct: true
        why: "Real users, real data and a real workflow are what make a pilot evidence of value, as opposed to evidence of feasibility."
      - text: "A larger proof of concept: more document types and more testers, run by the project team on copied data"
        why: "Breadth on copied data with project-team testers still only demonstrates feasibility; nothing is tested in real work."
        misconception: "A pilot is a bigger proof of concept"
      - text: "The client's IT staff run it on live documents in the client's cloud account and report any problems"
        why: "Real data in the real environment, but not real users in their real workflow, so it says little about value."
        misconception: "Real data in the client's environment is enough"
      - text: "A production release behind a feature flag to every user, with rollback as the safety net"
        why: "That describes a launch; a pilot deliberately limits exposure so you can learn before committing."
        misconception: "Pilot means early production release"
    explanation: |
      A proof of concept answers 'can it work?'. A pilot answers 'does it deliver value in real work?', so it needs
      real users, real data and the real workflow, with success metrics set beforehand.

  - id: D2-019
    version: 1
    type: single
    subtopic: delivery.scoping
    tags: [eval.methods]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      A client wants AI-drafted replies for its support team and says success is 'agents liking it'. You are about
      to start building. Which metric set should you agree on in writing first?
    options:
      - text: "Median first-response time and agent edit rate against baseline, plus a floor on customer satisfaction"
        correct: true
        why: "It ties to the business outcome, measures real use of the drafts, and guards against faster but worse answers."
      - text: "Offline similarity between drafts and past agent replies, plus a latency target for generating a draft"
        why: "It measures resemblance to history, not value; a draft can score well and still be slow to fix or wrong for a new case."
        misconception: "Model-quality metrics define business success"
      - text: "Weekly active agents and share of replies sent from drafts, against a target adoption percentage"
        why: "Usage shows that people open the feature, not that outcomes improved; it can rise while quality falls."
        misconception: "Adoption equals value"
      - text: "Average agent satisfaction on a five-point scale after four weeks, plus drafts generated per agent per day"
        why: "It formalizes 'agents liking it', which is subjective, has no baseline and can be moved without changing outcomes."
        misconception: "User sentiment is an acceptance criterion"
    explanation: |
      Agree success metrics and thresholds before building: an outcome against a baseline, a usage measure close to
      the work, and a guardrail so one number cannot be gamed. Vague satisfaction targets move the goalposts later.

  - id: D2-020
    version: 1
    type: single
    subtopic: delivery.scoping
    tags: [comms.stakeholders]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      You are in week 5 of an 8-week invoice-extraction pilot. The head of operations, who funds the pilot, asks for
      a second language and a new document type, saying 'it should be easy for you'. You have not sized either: the
      new document type may reuse the existing extraction logic or may need a rebuild. The agreed success metric
      covers the current scope. What is the best response?
    options:
      - text: "Size both additions, show her the cost against the date and metric, and let her choose a swap or a deferral"
        correct: true
        why: "It treats her request as legitimate, makes the cost visible, and leaves the trade-off with the person who funds it while protecting the agreed metric and date."
      - text: "Defer both to a follow-on phase and keep the pilot as scoped, since the agreed metric covers only current scope"
        why: "It protects scope but gives her nothing to decide with; unsized, it reads as a refusal, and one of the additions may be cheap."
        misconception: "Scope boundaries are enforced by deferral alone"
      - text: "Add the second language, which is probably cheap, and decline the new document type for this pilot"
        why: "It guesses at the sizing and splits the request without data; if the language is not cheap, you have silently absorbed the risk."
        misconception: "Split the request on a gut feel"
      - text: "Accept both and extend the pilot by a few weeks so the metrics can cover everything"
        why: "Moving the finish line delays the decision the pilot exists to inform and weakens the original success criteria."
        misconception: "The timeline is flexible when the sponsor asks"
    explanation: |
      Handle scope changes with a visible trade: estimate the impact, offer to swap or defer, and keep the original
      success criteria and date intact. Cut scope, not value, and never silently absorb.

  - id: D2-021
    version: 2
    type: multi
    subtopic: delivery.scoping
    tags: [comms.stakeholders]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A six-week pilot is meant to expose 40 real users from the start of week 4. At the end of week 2 the team has
      finished about 40% of the work planned for that launch and, at its current pace, would be ready at the end of
      week 5. Engineers new to this codebase take about a week to become productive. Which responses are sound?
    options:
      - text: "Cut features that do not move the agreed success metric, and hold the date real users first touch it"
        correct: true
        why: "The date for real users is when learning starts; scope tied to the metric is what must survive."
      - text: "Re-order the remaining work so the riskiest assumptions are tested first"
        correct: true
        why: "Risky unknowns surfaced early leave time to react; surfacing them in week 6 leaves none."
      - text: "Tell the sponsor now which scope is at risk and what the options are"
        correct: true
        why: "Early, specific warning preserves trust and gives the sponsor a chance to decide the trade-offs."
      - text: "Ask the sponsor for two more engineers for week 3 so the full planned scope is ready on time"
        why: "They would spend most of week 3 getting productive and take time from the existing team, so they cannot close the gap before week 4; it also skips the prioritization the timebox forces."
        misconception: "Adding people recovers schedule"
      - text: "Slip the real-user start to week 6 to finish the planned features, and keep the end date"
        why: "A week or so of real use cannot show adoption, edge cases or a trend in the metric; the evidence window is what to protect."
        misconception: "Finish the build, then expose users"
      - text: "Keep every feature but use internal testers in place of the 40 users to get quicker feedback"
        why: "Internal testers are not the real users doing real work, so the pilot stops producing evidence of value."
        misconception: "Substituting convenient users preserves the pilot's value"
    explanation: |
      When a forecast shows a milestone will be missed, protect the elements that make the pilot informative: real
      users on a fixed date, a long enough evidence window, and transparency with the sponsor. Everything else is
      negotiable scope. Extra people help only if they can be productive before the date that matters.

  - id: D2-022
    version: 1
    type: single
    subtopic: delivery.scoping
    tags: [gov.audit-compliance]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      A regional bank asks whether an LLM can extract covenant terms from loan agreements accurately enough to
      support credit analysts. Nobody has tried it. Legal forbids sending production loan documents to any external
      model service until a review completes in three months. Which engagement shape fits?
    options:
      - text: "A time-boxed proof of concept on approved redacted or public samples, with the accuracy bar set first"
        correct: true
        why: "The open question is feasibility, which a short test on permitted data answers without breaching the data restriction."
      - text: "A pilot with ten credit analysts on live agreements, running in shadow mode alongside their work"
        why: "Even in shadow mode, live agreements would go to the model service, which legal forbids; and feasibility is still unproven."
        misconception: "Shadow mode sidesteps data restrictions"
      - text: "An MVP integrated with the loan system, covering the main covenant types found in the portfolio"
        why: "Building integration before knowing the extraction can work puts engineering time at risk on an open question."
        misconception: "Build the product to find out whether it works"
      - text: "A pilot on live agreements using an open-weight model hosted inside the bank's network, so nothing leaves it"
        why: "It respects the restriction, but stands up infrastructure and recruits analysts before anyone knows extraction can reach the accuracy needed; a small test answers that first."
        misconception: "Solving the data constraint makes a pilot the right next step"
    explanation: |
      Choose the smallest engagement that answers the open question. Feasibility is a proof-of-concept question; a
      pilot needs real users and real data, and should follow evidence that the approach can work.

  - id: D2-023
    version: 1
    type: numeric
    subtopic: delivery.scoping
    tags: [obs.cost]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 150
    stem: |
      A pilot assistant helps a clinic network's staff prepare insurance pre-authorization requests. The clinics
      handle 3,000 requests a month at 11 minutes of staff time each. The assistant covers 60% of requests and cuts
      handling to 6 minutes for those. The other 40% are prepared as before. Loaded staff cost is $48 per hour, and
      each request the assistant handles costs $0.40 in model and infrastructure fees. What is the net monthly
      saving, in US dollars?
    answer: {value: 6480, tolerance: 50, tolerance_type: abs, unit: "USD"}
    work: |
      Covered requests: 3,000 x 0.6 = 1,800. Minutes saved: 1,800 x (11 - 6) = 9,000 min = 150 h. Labor saving:
      150 x $48 = $7,200. Run cost: 1,800 x $0.40 = $720. Net: $7,200 - $720 = $6,480 per month.
    explanation: |
      Apply savings only to the share the assistant handles. Common errors: applying the 5-minute saving to all
      3,000 requests ($12,000 before costs), ignoring run cost ($7,200), or charging run cost on all 3,000 requests
      ($6,000). Net savings, not gross, are the figure to compare with the pilot's success target.

  # ===================== delivery.go-live =====================
  - id: D2-024
    version: 2
    type: single
    subtopic: delivery.go-live
    tags: [adoption.handoff]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      Nine months ago a document-review assistant beat its targets in a 50-user pilot, and it is still not in
      production. Security review passed, the system-of-record integration works, and accuracy is above target. It
      runs in the vendor team's cloud account on a project budget that ends next quarter, and the client's IT group
      says nobody on their side is assigned to carry its pager. What should be addressed first?
    options:
      - text: "Agree who will own, fund and operate the service in production"
        correct: true
        why: "Every technical gate is clear; the missing element is an owner with budget and an agreed way of running it, without which no one will approve go-live."
      - text: "Move the service into the client's cloud account and security perimeter"
        why: "Possibly part of the eventual operating model, but with no owner and no budget there is nobody to accept, run or pay for it; the move alone unblocks nothing."
        misconception: "Technical migration unblocks launch"
      - text: "Extend the pilot to more users to build a stronger evidence base"
        why: "The pilot already beat its targets, so more evidence extends the wait without removing the actual blocker."
        misconception: "More pilot data will unlock the decision"
      - text: "Run training and a champions programme so reviewers are ready for launch"
        why: "Good for adoption, but launch cannot happen while nobody will run the service, and it spends effort ahead of the decision."
        misconception: "Adoption readiness is the missing step"
    explanation: |
      Pilots often stall after technical success because nobody owns production: budget, on-call, environment and
      accountability. Resolve ownership explicitly, or a successful pilot becomes permanent. Where it runs (the
      client's environment, or a vendor-operated service under an agreed contract) is part of that decision, not a
      substitute for it.

  - id: D2-025
    version: 1
    type: multi
    subtopic: delivery.go-live
    tags: [obs.slo]
    difficulty: 1
    level: apply
    time_s: 80
    stem: |
      A claims-triage assistant is two weeks from go-live at an insurer. Which items should be in place at the
      production readiness review?
    options:
      - text: "A rollback path that has been exercised in staging, not only written down"
        correct: true
        why: "An untested rollback often fails when needed; exercising it proves the time and steps."
      - text: "A named client-side owner with an on-call rotation and a runbook for likely failures"
        correct: true
        why: "Production incidents need a person who is responsible and a documented first response."
      - text: "Alerts on output quality and spend, not only uptime and error rates"
        correct: true
        why: "AI systems can fail silently, returning plausible but wrong answers or running up cost without an error."
      - text: "No known errors left on the offline test set"
        why: "Agreed thresholds are the gate; chasing zero known errors delays launch for little added safety, and rare cases can go to humans."
        misconception: "Readiness means zero known errors"
      - text: "Parity with every behavior of the manual process being replaced"
        why: "Parity is a scoping choice, not a readiness criterion; rare cases can stay with humans."
        misconception: "The new system must replace everything the old one did"
      - text: "Every one of the insurer's claims staff trained and certified before anyone is enabled"
        why: "The first cohort needs training; certifying everyone first defeats a staged rollout and delays learning."
        misconception: "Full training must precede any exposure"
    explanation: |
      Production readiness covers ownership, operability and recovery: a tested rollback, a responsible owner with a
      runbook, and monitoring that catches quality and cost problems, not only crashes.

  - id: D2-026
    version: 2
    type: single
    subtopic: delivery.go-live
    tags: [eval.online]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      An insurer's claims-routing model has run in shadow mode for four weeks on live traffic. It agrees with the
      human routing on 93% of claims, but only on 78% of claims within a week of a regulatory deadline, where a late
      routing triggers penalties. A misrouted claim outside that window is simply re-routed, at the cost of a day's
      delay. The sponsor points out that two human routers agree with each other only 90% of the time overall and
      wants to switch all routing to the model. What do you recommend?
    options:
      - text: "Model-route non-urgent claims, keep all deadline-sensitive claims with humans, and adjudicate disagreements"
        correct: true
        why: "Errors outside the deadline window are cheap to correct, so exposure there is low-risk; adjudicating the disagreements shows whether the model or the humans were wrong before urgent claims are considered."
      - text: "Switch everything over, since overall agreement already exceeds the agreement between two human routers"
        why: "The aggregate is dominated by routine claims and hides the urgent segment, where errors cost money; an overall human figure is no benchmark for that segment, and agreement is not correctness."
        misconception: "An aggregate above the human benchmark is sufficient"
      - text: "Extend shadow mode another month on all claims to get a more precise overall agreement figure"
        why: "More of the same: the data already points to a weak segment, and a tighter overall average neither explains the disagreements nor says who was right."
        misconception: "More shadow data resolves it"
      - text: "Keep all routing with humans until the model reaches 99% agreement overall on every claim type"
        why: "An arbitrary bar not tied to consequences delays the benefit on the large share of claims where errors are cheap to correct."
        misconception: "Wait for near-perfect accuracy"
    explanation: |
      Shadow mode compares the system with current practice on live traffic without consequences, but agreement is
      not correctness: a model and a human can agree on the wrong queue, and a disagreement may be the model
      correcting a human. An overall rate can also hide a weak segment, and an overall human-to-human figure is not
      a benchmark for one segment. Decide exposure by the cost of errors in each segment, and adjudicate a sample of
      disagreements by segment to measure actual error rates before widening.

  - id: D2-027
    version: 2
    type: single
    subtopic: delivery.go-live
    tags: [obs.slo, obs.cost]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      Your support assistant's rollout runs at 5%, 25%, 50% and 100% of agents, and the model is billed per token.
      The gate was defined only as agent edit rate, which remains under target. At 25%, p95 latency has doubled,
      though it is still inside the 6-second ceiling support promised agents, and cost per ticket is about 40% above
      the forecast the sponsor approved. What should you do?
    options:
      - text: "Hold at 25% and agree latency and cost gates with the sponsor before going further"
        correct: true
        why: "The ramp exists to catch problems before full exposure; an incomplete gate should be fixed, not used as a loophole."
      - text: "Proceed, since the only agreed gate passed, and track latency and cost once everyone is at 100%"
        why: "Meeting the letter of an incomplete gate ignores evidence that two other outcomes the sponsor cares about are off."
        misconception: "Passing the stated gate is sufficient"
      - text: "Roll back to 5% until latency and cost return to forecast, then restart the ramp from there"
        why: "Latency is within the promised ceiling and quality is on target, so agents at 25% are not being harmed and the extra cost at that exposure is bounded; holding gives the same protection without losing ramp time."
        misconception: "Any gate miss requires a rollback"
      - text: "Proceed to 50% so the extra traffic shows whether the early-ramp latency and cost settle on their own"
        why: "Per-token billing gives no volume discount that would pull cost per ticket back, and heavier load tends to worsen p95 rather than fix it; ramping doubles exposure before the deviation is explained."
        misconception: "Early-ramp deviations are noise that settles with volume"
    explanation: |
      Progressive rollout is only as good as its gates. Define quality, latency, cost and error thresholds up front;
      when a step exposes a missing one, pause, agree it with the sponsor, and then continue. Roll back when the
      current exposure is causing material harm; hold when a deviation is unexplained but tolerable at the current
      step, and find its cause (traffic mix, prompt length, retries) before widening.

  - id: D2-028
    version: 1
    type: single
    subtopic: delivery.go-live
    tags: [int.resilience, gov.audit-compliance]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      An assistant drafts and submits purchase orders directly into a manufacturer's ERP. The go-live plan's
      rollback section says: 'redeploy the previous container image within 15 minutes'. The business has said an
      hour of degraded or manual purchasing is tolerable, and the plan's trigger section (thresholds and a named
      decider) is complete. What is the most important gap in the rollback plan?
    options:
      - text: "It does not cover finding and correcting the orders the faulty version already submitted"
        correct: true
        why: "Redeploying code does not undo records that already exist in the ERP; those need identification and reversal or review."
      - text: "It lacks a hot-standby copy of the previous model endpoint that could take traffic at once"
        why: "A 15-minute redeploy fits the tolerated hour, and a standby does nothing for orders already written."
        misconception: "Faster failover is the main rollback concern"
      - text: "It has not been timed under peak load, so the 15 minutes may not hold when volume is high"
        why: "A reasonable test, but even a fast redeploy leaves the damage done during the bad window uncorrected."
        misconception: "Rollback quality is about speed"
      - text: "It has no canary stage before full release to limit how many orders a faulty version could send"
        why: "A canary reduces exposure but is a release-control gap, not a hole in the rollback plan itself."
        misconception: "Staged release replaces a data-level recovery plan"
    explanation: |
      Rolling back code is not rolling back effects. When a system writes to other systems, the plan needs a way to
      identify every action taken by the faulty version, tag it, and reverse or review it.

  - id: D2-029
    version: 1
    type: single
    subtopic: delivery.go-live
    difficulty: 2
    level: apply
    time_s: 70
    stem: |
      Before enabling the first 5% cohort of a staged rollout, which decision matters most to have settled?
    options:
      - text: "Numeric thresholds that trigger a pause or rollback, and who has authority to call it"
        correct: true
        why: "When metrics wobble at 2 a.m., pre-agreed triggers and a named decider stop debate and speed the response."
      - text: "Calendar dates for each later step of the ramp, so the remaining cohorts can plan for them"
        why: "Dates are a useful plan but should depend on gates being met; fixed dates push teams to proceed regardless."
        misconception: "A schedule is the control mechanism"
      - text: "Training and help-desk scripts for every cohort, so no group goes live unprepared"
        why: "The first cohort needs support, but the later cohorts' material can follow; it does not govern what happens when the first cohort sees problems."
        misconception: "Enablement is the main launch control"
      - text: "Finance sign-off on the cost forecast at 100% usage, so the full-scale budget is agreed up front"
        why: "Cost matters, but 5% exposure is small and its data refines the forecast; sign-off does not decide how problems are handled."
        misconception: "Budget certainty de-risks the first step"
    explanation: |
      A staged rollout is a control system: it needs measurable gates, explicit rollback triggers and a named decision
      maker, agreed before exposure begins rather than improvised during an incident.

  - id: D2-030
    version: 2
    type: single
    subtopic: delivery.go-live
    tags: [delivery.scoping]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      Your one-week proof of concept is a notebook: prompts pasted into cells, an API key hardcoded, and the current
      conversation held in global variables, so it serves one person at a time when someone runs the cells in order.
      It impressed the sponsor, who now says 'ship it next month' to 60 support agents, who would use it at the same
      time from inside their CRM. What do you propose?
    options:
      - text: "Carry over the prompts, test cases and reusable logic, and build a multi-user service around them"
        correct: true
        why: "The prompts, cases and logic hold what the prototype proved; its single-user execution model and hardcoded secret are what must change to serve concurrent agents."
      - text: "Harden the notebook step by step: move secrets out, add retries and logging, and run it on a schedule"
        why: "Safer and more observable, but a scheduled notebook still runs one session at a time from shared global state, so it cannot serve 60 agents working concurrently from the CRM."
        misconception: "Hardening a prototype fixes its execution model"
      - text: "Wrap the notebook logic in an API as it is and deploy it, then refactor once agents are using it"
        why: "Concurrent requests would share one set of global variables and mix agents' conversations, and the hardcoded key ships too; fixing that after launch puts real users on both."
        misconception: "Ship first, fix later"
      - text: "Run a design phase first: requirements, architecture and a full test plan, before any new code is written"
        why: "With a month to deliver, designing from scratch re-derives what the validated prompts and cases already encode; design the service around what exists."
        misconception: "Prototype work does not reduce design effort"
    explanation: |
      A prototype cannot ship unchanged when its structure contradicts the production requirement: here, one user's
      state in global variables against many concurrent users, plus a hardcoded secret. That does not make it all
      disposable. Prompts, evaluation cases and reusable logic carry over, and the serving path is rebuilt with
      secrets management, error handling, observability and an owner. When a prototype's structure already fits
      the target workload, extracting and hardening it step by step can be the faster route; let the gaps decide.

  # ===================== open and audio decomposition cases =====================
  - id: D2-031
    version: 2
    type: open
    subtopic: discovery.framing
    tags: [discovery.selection]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 540
    stem: |
      The COO of a regional grocery chain (140 stores) tells you: 'We throw away too much fresh food. Use AI to fix
      it.' You have one week of discovery before a steering meeting. Write the decomposition you would bring to that
      meeting: how you would break the problem down, what you would check first and how, and what you would propose
      building first and why.
    rubric:
      - criterion: "Turns the vague request into a measurable problem"
        points: 2
        guidance: "2 if it defines waste in measurable terms (value or weight, by category and cause such as expiry, damage, over-ordering) and asks for a baseline; 1 if it mentions measuring but stays generic; 0 if it accepts 'waste' as is."
      - criterion: "Structured decomposition with a rule against double counting"
        points: 3
        guidance: "3 if it gives a coherent structure (for example where loss is recorded along the flow, then its causes such as over-ordering, handling or late markdown; or another defensible split), says how each loss is attributed so nothing is counted twice, and gives testable hypotheses per branch; 2 if the structure is sensible but attribution is loose or hypotheses are missing; 1 if a flat list of ideas; 0 if it jumps to a solution. Do not require any particular set of categories."
      - criterion: "Evidence plan in the field and in data"
        points: 2
        guidance: "2 if it includes store visits or observation plus specific data pulls (waste logs, orders, sales, shrink) with who to ask; 1 if only one of the two; 0 if neither."
      - criterion: "Chooses what to build first with explicit criteria"
        points: 2
        guidance: "2 if it applies criteria such as value, data availability, feasibility, an owner and risk, and accepts that the first answer may be rules or process, not AI; 1 if a choice with thin reasoning; 0 if no choice."
      - criterion: "Bottom line first and audience-appropriate"
        points: 1
        guidance: "1 if it opens with the recommendation, in language a COO can use; 0 if buried or jargon-heavy."
    model_answer: |
      Bottom line: I'd bring a measured breakdown of where fresh food is lost, and propose one store-level pilot at
      the largest loss point, which may turn out to be ordering accuracy or markdown timing rather than something
      exotic.

      How I'd break it down: follow the food, and count each discarded item once, where it is thrown out: in the
      back room (damaged or spoiled before display) or from the shelf (expired or unsold). Then attribute each loss
      to a primary cause: over-ordering, handling and rotation, or late markdown, with a rule for mixed cases so
      nothing is counted twice. Each cause has a hypothesis, for example 'bakery and produce losses come mostly
      from over-ordering on low-sales days', and I'd also cut waste by category and by store cluster.

      First checks: ask for 12 months of waste logs, orders and sales by category and store; the baseline is waste
      as a percentage of sales, by cause. In parallel I'd spend two days in three stores of different sizes
      watching ordering, receiving and markdown, since logged causes are often wrong (spoilage logged as 'expired').

      What to build first: the branch with the most money, usable data and an owner who can change behaviour. If
      over-ordering dominates, a demand-forecast suggestion into the existing ordering screen, trialled in ten
      stores with a held-out control group. If markdowns are late, a simple rule may beat a model. Success is waste
      percentage down and no rise in empty shelves. I'd leave out store-wide computer vision until the data says
      shelves are the problem.
    max_chars: 2500

  - id: D2-032
    version: 2
    type: open
    subtopic: delivery.scoping
    tags: [discovery.framing, comms.tradeoffs]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 540
    stem: |
      A bank's head of operations says commercial loan onboarding takes too long, and the board expects 'an AI
      solution' by the end of the quarter, ten weeks away. Draft the plan you would send her: what you would find
      out in the first two weeks, what you would scope as the first deliverable, how you would define success, and
      what you would explicitly leave out.
    rubric:
      - criterion: "Opens with a clear position and a realistic framing"
        points: 2
        guidance: "2 if it leads with a proposed first deliverable that can credibly be shown in the quarter and names the risk to the board's expectation; 1 if the position is vague or buried; 0 if it simply agrees to deliver 'an AI solution'."
      - criterion: "First-two-weeks discovery plan"
        points: 2
        guidance: "2 if it covers mapping the onboarding steps with real elapsed times, observing staff, and checking data and access constraints; 1 if it covers one or two of these; 0 if none."
      - criterion: "Scoped first deliverable (pilot-sized, real conditions)"
        points: 3
        guidance: "3 if it proposes a narrow slice (for example document intake and checklist completeness for one loan type) with real users, real documents and the real workflow; 2 if narrow but missing a real-conditions element; 1 if a broad platform; 0 if none."
      - criterion: "Success metrics agreed before building"
        points: 2
        guidance: "2 if it names a baseline-based outcome (for example cycle time, rework rate) plus a quality guardrail, and either a target or how and with whom the target will be agreed once the baseline is measured; 1 if metrics without baseline or guardrail; 0 if none. An invented number is not better than a credible way to set one."
      - criterion: "Explicit exclusions and risks"
        points: 1
        guidance: "1 if it names what is out of scope and at least one dependency or risk (data access, compliance review); 0 if not."
    model_answer: |
      Proposal in one line: by week 10 we can show a pilot, not a bank-wide platform, that cuts onboarding time on
      one loan type, with the broader roll-out sequenced after the board read-out.

      Weeks 1-2: I'll map the onboarding journey from application to booking, measuring elapsed and working time
      for each step from the workflow system's timestamps, sit with onboarding analysts for a few days, and confirm
      which documents, systems and approvals are involved. In parallel we start data-access and compliance
      requests, since those are the longest lead times.

      First deliverable: my working hypothesis is that much of the delay sits in document collection and
      completeness checking. If the data confirms that, I'd scope an assistant that classifies incoming documents,
      extracts the key fields, and flags missing items for one loan type, used by one team of analysts on live
      applications, with a human confirming each result.

      Success, agreed before we build: median days from application to credit-ready file, down from today's
      measured baseline by an agreed amount; rework rate no worse than now; analysts accept most extractions
      unchanged.

      Out of scope: credit decisioning, other loan types, integration beyond the existing workflow tool.
      Risks: access approvals and model-use review; if either slips, I'd tell you in week 3, not week 9.
    max_chars: 2500

  - id: D2-033
    version: 2
    type: open
    subtopic: delivery.go-live
    tags: [adoption.change, eval.online]
    competencies: [x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 540
    stem: |
      An underwriting assistant was piloted for eight weeks with 20 underwriters. Review time per case fell and the
      edit rate stayed within target. The sponsor now wants it live for all 600 underwriters in six weeks. Write the
      readiness and rollout plan you would propose, including what must be true before you start, how you would ramp,
      and who runs it afterward.
    rubric:
      - criterion: "Clear position on the six-week ask"
        points: 2
        guidance: "2 if it says what is achievable in six weeks (for example a ramp that reaches all users only if gates pass) and why; 1 if it agrees or refuses without reasoning; 0 if no position."
      - criterion: "Production readiness prerequisites"
        points: 3
        guidance: "3 if it covers ownership and on-call, a runbook, a tested rollback, monitoring of quality and cost, and security or compliance sign-off; 2 if three or four; 1 if one or two; 0 if none."
      - criterion: "Progressive rollout with explicit gates"
        points: 3
        guidance: "3 if it describes a limited initial exposure (shadow mode, a first cohort or a small percentage) and evidence-based expansion, names the quality, latency and cost guardrails, says who sets and who decides them, and states what pauses or reverses the rollout; thresholds may be agreed before exposure rather than invented, and cohort steps earn the same credit as percentages; 2 if a credible staged rollout with relevant gates but a material decision, evidence or recovery detail is vague; 1 if a big-bang launch with extra support or only generic monitoring; 0 if no meaningful rollout control."
      - criterion: "Pilot-to-production gap addressed"
        points: 2
        guidance: "2 if it notes that the 20 pilot underwriters and their cases may not represent all 600 (case mix, load, attitudes), and plans to check it, for example by comparing case mix, re-testing on harder cases and measuring adoption; 1 if mentioned without a plan; 0 if not."
      - criterion: "Post-launch ownership and handoff"
        points: 1
        guidance: "1 if it names who owns operation after the engagement and how knowledge transfers; 0 if not."
    model_answer: |
      Recommendation: all 600 underwriters in six weeks is possible only as a gated ramp, and the last step should
      be approved by the gates, not by the calendar.

      Before starting (week 1): a named client-side owner for the service and an on-call rotation; a runbook for
      the likely failures; a rollback tested in staging; dashboards and alerts for edit rate, latency, cost per case
      and error rates; and sign-off from security and model-risk, which I'd start today since they have lead times.

      Why not copy the pilot: we don't yet know whether the 20 pilot underwriters and their cases represent all 600.
      At full scale we also get more load, a wider case mix and some sceptics. I'd compare the pilot's case mix
      with the whole book, re-test on a sample of difficult historical cases and add them to the regression set.

      Ramp: week 2, shadow mode alongside the existing process on live cases, comparing outputs; week 3, 10% of
      underwriters; week 4, 30%; week 5, 60%; week 6, 100%. Each step requires edit rate and referral accuracy
      within agreed bounds, p95 latency and cost per case inside the budget, and no unresolved severity-one
      incidents. The sponsor's delegate and I decide at each gate, and any breach pauses the ramp.

      Handover: the client owner runs the weekly review from week 3 with my team shadowing, so by week 6 they hold
      the runbook and change process.
    max_chars: 2500

  - id: D2-034
    version: 1
    type: open
    subtopic: discovery.environment
    tags: [gov.identity, delivery.scoping]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 3
    level: analyze
    time_s: 540
    stem: |
      Day one at a manufacturer. The plant runs a 25-year-old manufacturing execution system with an undocumented
      Oracle schema. Approval for access to the plant network takes about five weeks. Two long-serving engineers
      know the system, and one is mostly unavailable. The sponsor wants a useful prototype in six weeks that
      predicts scrap rates on one production line. Write your plan for the first two weeks, and say what you would
      do about the risks.
    rubric:
      - criterion: "Gives the schedule risk a clear verdict"
        points: 2
        guidance: "2 if it states plainly that the five-week access wait threatens the six-week target and proposes how to manage it with the sponsor; 1 if it notes the delay without consequences; 0 if it ignores it."
      - criterion: "Data and access inventory and early requests"
        points: 2
        guidance: "2 if it files the narrowest access requests on day one and lists sources, owners, approval paths and sensitivity; 1 if only requests or only an inventory; 0 if neither."
      - criterion: "System archaeology approach"
        points: 3
        guidance: "3 if it traces real production events and scrap records through the system with the available engineer, verifies findings against data, and documents only what the use case needs; 2 if it uses the engineers but lacks verification or focus; 1 if it plans a full schema documentation effort; 0 if none."
      - criterion: "Keeps making progress while blocked"
        points: 2
        guidance: "2 if it uses approved sample extracts, exported reports or historical files to prototype on real data, and defines what can be validated before access; 1 if it only suggests synthetic data; 0 if it waits."
      - criterion: "Defines success and scope for the prototype"
        points: 1
        guidance: "1 if it states a measurable target (for example a baseline scrap rate and a prediction-quality threshold on one line) and what is left out; 0 if not."
    model_answer: |
      Headline: the six-week target is at risk because plant-network access takes five weeks. I'd tell the sponsor
      on day one and plan to work around the wait rather than hope it shortens.

      Day 1-2: file the narrowest possible access request (read-only, one line's tables) and ask the sponsor to
      sponsor it. Build an inventory of sources: the MES database, quality-inspection records, maintenance logs,
      any spreadsheets. For each, note the owner, the approver, the lead time and the sensitivity. Ask whether
      anyone can provide an approved extract or existing reports in the meantime.

      Days 3-10: with the available engineer, trace a handful of real scrap events from what operators see on screen
      to the rows behind them, and record what each field means, checking each claim against records. I'd document
      only the tables that scrap prediction needs. In parallel, start on whatever extract we get, so I meet real
      data quirks (missing batches, inconsistent codes) now, not in week five.

      Risks and mitigations: the single knowledge-holder, so I'd record sessions and capture the status codes
      first; data that turns out too thin, which I'd learn in week two, not five; and access slipping further, in
      which case the prototype becomes a backtest on historical data.

      Success: a baseline scrap rate for the line, and a prediction that beats a simple rule at an agreed threshold.
      Out of scope: other lines and any write-back to the MES.
    max_chars: 2500

  - id: D2-035
    version: 2
    type: audio
    subtopic: discovery.framing
    tags: [delivery.scoping]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 2
    level: apply
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      An elevator-maintenance company tells you: 'Help our field technicians fix equipment faster with AI.' Out
      loud: how do you break this down, what is the first thing you would go and find out, and how would the answer
      shape what you do next?
    rubric:
      - criterion: "States an approach before details"
        points: 2
        guidance: "2 if the first sentence gives a clear approach (for example 'I'd first locate where technician time goes'); 1 if it arrives mid-answer; 0 if it only lists ideas."
      - criterion: "Structured breakdown of the job"
        points: 3
        guidance: "3 if it splits the technician's work into clear stages (for example dispatch and travel, diagnosis, parts, repair, documentation) with a metric for time or repeat visits; 2 if reasonable but overlapping or missing a metric; 1 if a list of AI ideas; 0 if none."
      - criterion: "Concrete first discovery action"
        points: 2
        guidance: "2 if it names a concrete first action that would show where technician time goes (for example ride-alongs, a pull of work-order timestamps and repeat-visit rates, or both) and says what it would reveal; 1 if the action is generic (for example 'talk to technicians') or unjustified; 0 if none."
      - criterion: "How the findings decide the next step"
        points: 2
        guidance: "2 if it says which findings would point to which kind of intervention (for example slow diagnosis to diagnostic help, missing parts to stocking, travel to scheduling), ties the choice to the largest measured loss against a baseline, and allows that it may not need AI; 1 if it names a next step or tool without saying what evidence would decide it; 0 if no link from discovery to a decision. Deferring the build choice until the evidence is in earns full credit."
    model_answer: |
      I'd start by finding out where technician time actually goes, before choosing any AI. 'Fix faster' is vague,
      so I'd split a service call into stages: dispatch and travel, diagnosis on site, getting parts, the repair
      itself, and paperwork. For each stage, I'd want a number: average time, and how often a second visit is needed,
      because repeat visits are usually the costliest.

      The first thing I'd do is ride along with technicians on a handful of calls, in different building types, and
      pull a few months of work-order data with timestamps and parts used. Ride-alongs show things the data hides,
      like technicians phoning a colleague to ask about an error code.

      Then I'd pick the stage with the most measurable loss. If diagnosis is the issue, an assistant that searches
      service manuals and past fixes for a given fault code might help, and I'd trial it with a small group, measuring
      time on site and repeat visits. If the loss is mostly parts not being on the truck, the fix may be better
      stocking rules, no AI needed. Either way, I'd agree the target and baseline with the operations lead first.

  - id: D2-036
    version: 2
    type: audio
    subtopic: discovery.selection
    tags: [delivery.scoping, comms.tradeoffs]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      A city transit agency's director wants to 'reduce late buses with AI'. You have two minutes with her. Talk
      through how you would break the problem down, how you would choose what to work on first, and how she would
      know it worked.
    rubric:
      - criterion: "Leads with a position"
        points: 2
        guidance: "2 if it starts with a clear answer (for example 'find where lateness comes from, then pick the cause we can change'); 1 if the position comes late; 0 if absent."
      - criterion: "Decomposes lateness so it can be measured without double counting"
        points: 3
        guidance: "3 if it gives a coherent structure (for example where delay accrues: late pull-out, running time between stops, dwell at stops; or causes such as timetable realism, traffic, vehicle availability and depot operations), says how measured delay is attributed so interacting causes are not counted twice, and how each part would be sized from data the agency has or can collect; 2 if sensible but attribution or sizing is loose; 1 if a list of AI features; 0 if none. Credit any defensible structure; listing these example categories earns nothing by itself."
      - criterion: "Explicit criteria for choosing the first target"
        points: 2
        guidance: "2 if it uses criteria such as size of the effect, data available, who owns the lever, and whether AI is needed; 1 if it picks one without criteria; 0 if none."
      - criterion: "Success measure and baseline"
        points: 2
        guidance: "2 if it names a baseline-based measure such as on-time percentage by route with a time-boxed trial against comparable routes; 1 if the measure is vague; 0 if none."
      - criterion: "Honest about trade-offs or limits"
        points: 1
        guidance: "1 if it acknowledges at least one limit, such as the fact that some causes are outside the agency's control or may not need AI; 0 if not."
    model_answer: |
      My answer is that I'd first find out why buses are late and then work on the cause the agency can change,
      which may not need AI at all.

      I'd split each late trip's delay by where it builds up: leaving the depot late, running time between stops,
      and time spent at stops. Then I'd attribute each piece to one main cause, such as a timetable that's
      unrealistic for the road, traffic and incidents, breakdowns, or depot operations, so no minute is counted
      twice. If the agency has bus GPS and schedule data, which I'd confirm first, I could size each within a few
      weeks as minutes of delay by route and time of day.

      To choose, I'd weigh four things: how much delay the cause explains, whether the data is there, whether
      someone at the agency owns the lever, and whether a model is even needed. For example, if the timetable runs
      tight on a few routes, re-timing them is a scheduling fix. If breakdowns dominate, predicting which vehicles
      are likely to fail could be worth a pilot with the maintenance team.

      Success would be on-time performance, measured as the share of trips within a few minutes of schedule, compared
      against similar routes without the change over a couple of months. Some causes, like weather and incidents,
      are outside the agency's control, so I'd say upfront what we can and can't promise.
