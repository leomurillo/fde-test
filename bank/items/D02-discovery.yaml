domain: D2
items:
  # ===================== discovery.framing =====================
  - id: D2-001
    version: 1
    type: single
    subtopic: discovery.framing
    competencies: [x.decomposition]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A hospital network's supply-chain director asks you to build 'a chatbot so nurses can find supplies faster'.
      In week one you confirm that the inventory system matches physical counts in spot checks and that every item
      has a shelf location. Nurses still complain loudly about hunting for supplies. What is the best next step?
    options:
      - text: "Shadow nurses across several shifts and time each supply search from need to item in hand"
        correct: true
        why: "Observation shows where the time really goes. With accurate inventory data, the stated solution (a lookup chatbot) may not touch the cause."
      - text: "Interview the ward managers and compile a prioritized list of chatbot requirements for sign-off"
        why: "Managers describe the work secondhand, and the list presumes the chatbot is the answer before the problem is understood."
        misconception: "Stakeholder interviews are sufficient discovery"
      - text: "Prototype a chatbot over the inventory data and measure whether nurses adopt it over two weeks"
        why: "If searches are slow for reasons other than lookup (supplies in locked rooms, par levels, restocking cadence), a lookup chatbot cannot help, and the prototype teaches little."
        misconception: "Building the requested thing is the fastest way to learn"
      - text: "Survey every nurse on which supplies are hardest to find and rank the items by frequency"
        why: "Self-reported pain is already abundant; a ranking of items does not reveal the mechanism behind the delays."
        misconception: "More self-reported data substitutes for observed behavior"
    explanation: |
      The stated request is a solution, not a problem. Before building, find out what actually happens in the
      workflow: watching real work surfaces causes that users and managers cannot articulate, and it can overturn
      the assumed solution entirely.

  - id: D2-002
    version: 1
    type: single
    subtopic: discovery.framing
    competencies: [x.decomposition]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      An online retailer's operations VP says returns take too long to process and wants AI to fix it. You are
      building an issue tree for 'where does the time go?'. Which first-level split is mutually exclusive and
      collectively exhaustive?
    options:
      - text: "Elapsed time per stage: receipt, inspection, disposition decision, refund, restocking"
        correct: true
        why: "Every hour of a return falls into exactly one stage, so the branches do not overlap and together cover the whole process."
      - text: "Contributing causes: staffing, tooling, volume spikes, data quality and process design"
        why: "A brainstormed cause list overlaps (tooling and process design) and nothing proves it is complete."
        misconception: "A list of plausible causes is a decomposition"
      - text: "Returns grouped by warehouse site, by product category, and by customer segment type"
        why: "These are three different cuts of the same returns, so every return appears in all three; they are not parts of one split."
        misconception: "Listing several useful dimensions makes a tree"
      - text: "Candidate technical fixes: label OCR, a return-reason classifier, a rules engine and a chatbot"
        why: "It starts from solutions and says nothing about where time is lost, so it cannot be exhaustive about the problem."
        misconception: "Decomposing the solution space instead of the problem"
    explanation: |
      MECE means each element belongs to exactly one branch and no element is left out. Splitting a process along its
      flow is the dependable way to get this, and it yields branches you can measure with timestamps. Causes and
      solutions belong at the next level, as hypotheses under the stage where time is actually lost.
    refs: [https://en.wikipedia.org/wiki/MECE_principle]

  - id: D2-003
    version: 1
    type: multi
    subtopic: discovery.framing
    tags: [comms.stakeholders]
    competencies: [x.decomposition]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      A health insurer's claims adjusters would use your tool daily. Their VP of Claims is buying it, and the CFO
      sponsors it to reduce loss-adjustment expense. Which discovery actions fit this situation?
    options:
      - text: "Record each group's definition of success separately: adjuster minutes per claim, the VP's backlog, the CFO's expense figure"
        correct: true
        why: "Users, buyer and sponsor want different things; a project that tracks only one can succeed on paper and fail with the others."
      - text: "Watch adjusters work live claims instead of relying on the VP's description of their day"
        correct: true
        why: "The people who will use the tool hold the workflow knowledge, and managers' accounts of it are secondhand."
      - text: "Check that the CFO's measurable target and the adjusters' daily friction sit at the same workflow step"
        correct: true
        why: "If the savings come from a step adjusters do not struggle with, adoption will not produce the sponsor's outcome."
      - text: "Treat the VP's requirements list as the user needs, since the VP manages the adjusters"
        why: "Managers set priorities, but their list reflects what they see in reports, not task-level friction."
        misconception: "The buyer is a faithful proxy for the end user"
      - text: "Prioritize the adjusters' wish list over all else, because adoption decides whether value appears"
        why: "Adoption matters, but a tool that delights users and misses the sponsor's target gets cancelled at the next budget review."
        misconception: "End-user satisfaction alone defines success"
      - text: "Merge sponsor and buyer into one stakeholder so the project has a single definition of success"
        why: "They have different incentives; hiding the difference postpones the conflict to the acceptance meeting."
        misconception: "Simplifying stakeholders removes conflict"
    explanation: |
      Users, buyers and sponsors are often different people with different success measures. Good discovery keeps
      them distinct, learns user needs first-hand, and checks that the sponsor's outcome and the users' pain point
      at the same place in the workflow.

  - id: D2-004
    version: 1
    type: single
    subtopic: discovery.framing
    tags: [comms.stakeholders]
    competencies: [x.decomposition]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A manufacturer's COO asked for an ML model that predicts machine failures, and the contract names it as the
      deliverable. After two weeks on the floor you find that maintenance planners already know which machines are
      fragile. The real losses come from replacement parts taking about three weeks to arrive once a failure is
      called. What do you do?
    options:
      - text: "Show the COO the downtime data and propose parts lead time as the first target, predictor later"
        correct: true
        why: "Evidence from the floor shows where the money is lost; reframing with the sponsor, not around them, keeps trust and aims effort at the real constraint."
      - text: "Build the predictor as contracted and mention the parts delay in the final report to the COO"
        why: "It delivers what was asked while knowingly leaving most of the loss untouched; the sponsor learns the finding too late to act."
        misconception: "Contract wording defines the problem"
      - text: "Build the predictor as contracted and, in parallel, a parts-ordering tool, since either could matter"
        why: "Doubles scope on the same timeline without evidence for either, and splits a small team across two bets."
        misconception: "Hedging with parallel builds is cheaper than choosing"
      - text: "Take the parts finding straight to procurement leadership so the delay is fixed outside this project"
        why: "Going around the sponsor damages the relationship and ignores that the COO owns the outcome."
        misconception: "Fix the root cause wherever it lives, whoever owns it"
    explanation: |
      The stated deliverable is a hypothesis about how to solve the problem. When observation contradicts it, bring
      the evidence to the sponsor and propose a reframe; do not silently deliver the wrong thing, and do not
      route around the person who owns the outcome.

  - id: D2-005
    version: 1
    type: single
    subtopic: discovery.framing
    difficulty: 1
    level: apply
    time_s: 60
    stem: |
      A bank's operations head asks for an LLM to summarize recorded customer calls. You have thirty minutes with
      her. Which question is most likely to expose the underlying problem?
    options:
      - text: "Who reads these summaries today, and what do they do next with them?"
        correct: true
        why: "It surfaces the decision or action the summary feeds, which defines the value and what 'good' means."
      - text: "How many calls are recorded each day, and in what audio format?"
        why: "Useful for feasibility and cost, but it says nothing about why summaries matter or who needs them."
        misconception: "Technical sizing is the first discovery question"
      - text: "What should the summary look like, in format and length?"
        why: "It specifies the solution before the need is clear, and the answer will mirror whatever she imagines."
        misconception: "Asking users to specify the output is requirements gathering"
      - text: "Which compliance teams must approve the use of call recordings?"
        why: "A real constraint worth asking later, but it does not reveal the problem being solved."
        misconception: "Risk questions come before value questions"
    explanation: |
      Ask about the consuming workflow, not the artifact. The answer reveals who benefits, which action should
      change, and what measure shows it worked.

  - id: D2-006
    version: 1
    type: single
    subtopic: discovery.framing
    tags: [discovery.selection]
    competencies: [x.decomposition]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A subscription-software CEO says: 'Churn is up. Use AI to predict and stop it.' You have two years of billing
      history, product usage logs and support tickets. What is the most useful first analytical step?
    options:
      - text: "Split churned accounts into voluntary and failed-payment cases, by tenure cohort, from billing data"
        correct: true
        why: "It breaks the vague problem into parts quickly and cheaply and may show that much of the churn is a payment-retry problem, not a prediction problem."
      - text: "Train a churn model on every available feature, then review its top predictors for likely causes"
        why: "Feature importance reflects correlation and the data's quirks, and it jumps to a solution before the problem is sized."
        misconception: "A predictive model is a discovery tool"
      - text: "Ask customer success for their ten most common churn reasons and rank them by how often they hear each"
        why: "Anecdotes are biased toward memorable calls; the billing data can size the same question exactly."
        misconception: "Frontline anecdote is the best source of cause"
      - text: "Send an exit survey to recently churned customers asking why they left, and tally the answers"
        why: "Slow, low response, and stated reasons often differ from behavior; it delays any quantification."
        misconception: "Asking customers directly gives the true cause"
    explanation: |
      Decompose first and size the pieces with data you already have. Voluntary versus involuntary churn, and
      tenure cohorts, can redirect the whole project before any model is built.

  - id: D2-007
    version: 1
    type: multi
    subtopic: discovery.framing
    tags: [discovery.environment]
    competencies: [x.decomposition]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      It is Monday of an engagement that began with 'make our dispatchers more efficient'. Which activities belong
      in the first week of discovery?
    options:
      - text: "Write two or three testable hypotheses about where dispatcher time is lost, naming the data that would confirm each"
        correct: true
        why: "Hypotheses turn a vague goal into checks you can run, and naming the data shows what to request early."
      - text: "Pull timestamps from the dispatch system to measure how long each step of a job takes today"
        correct: true
        why: "A measured baseline shows where time is spent and later proves any improvement."
      - text: "Sit in on live dispatch shifts and note workarounds such as sticky notes and side spreadsheets"
        correct: true
        why: "Workarounds are evidence of unmet needs that dispatchers rarely mention in interviews."
      - text: "Interview each department head in turn and merge their wishes into a single requirements document"
        why: "It yields a wish list without evidence of where time is lost, and it favors whoever speaks most confidently."
        misconception: "Consolidated requirements are discovery output"
      - text: "Draft the target architecture so the sponsor sees concrete output by Friday"
        why: "A design produced before the problem is understood is fiction; the sponsor needs findings, not diagrams."
        misconception: "Visible artifacts show progress"
      - text: "Choose the model vendor and start provisioning so infrastructure is off the critical path"
        why: "Provisioning for an unknown solution commits budget early, and the first-week unknown is the problem itself."
        misconception: "Start building in parallel to save time"
    explanation: |
      Week one of discovery should produce evidence: hypotheses, a measured baseline, and direct observation of the
      work. Requirements documents, architectures and vendor choices come after the problem is located.

  # ===================== discovery.selection =====================
  - id: D2-008
    version: 1
    type: single
    subtopic: discovery.selection
    tags: [gov.approvals]
    difficulty: 2
    level: evaluate
    time_s: 120
    stem: |
      At an industrial distributor you have shortlisted four candidate use cases and can start only one:

      1. **Contract clause extraction** for legal review. The General Counsel is the champion, contracts sit in one
         repository, and legal already logs review hours. A lawyer checks every output.
      2. **Network-wide demand forecasting.** Very large potential savings, but data is spread over nine ERPs with
         no common product ID, nobody has measured current forecast accuracy, and the sponsor is an innovation team.
      3. **HR policy Q&A assistant.** Easy to build, no clear owner, and HR cannot say what it would change.
      4. **Automatic customer-refund approval.** High value, accessible data, enthusiastic CFO, but errors pay out
         money and fall under audit rules.

      Which should go first?
    options:
      - text: "Contract clause extraction: owned, measurable, and every output passes a human check"
        correct: true
        why: "It has a champion who will act, a baseline in logged hours, available data and a built-in safety net, so a quick, credible result is likely."
      - text: "Demand forecasting: the size of the prize justifies the data-integration effort"
        why: "Without a common product ID, a baseline or a real sponsor, the integration work would consume the engagement before value is shown."
        misconception: "Choose the biggest prize first"
      - text: "HR policy assistant: lowest effort, so the team can show results quickly"
        why: "Quick to build but with no owner or measurable outcome, the result is a demo nobody has reason to adopt."
        misconception: "Easiest to build means best first project"
      - text: "Automatic refunds: strong sponsor and accessible data outweigh the audit exposure"
        why: "Autonomous payouts under audit rules need controls and approvals that lengthen the path; sponsor and data are necessary but not enough."
        misconception: "Sponsorship and data readiness cancel out risk"
    explanation: |
      Pick the first problem on several axes together: value, feasibility, data availability, risk and sponsorship.
      The best first project is not the largest or the easiest. It has a measurable baseline, a champion who will
      act on the result, and an error profile you can safely manage.

  - id: D2-009
    version: 1
    type: single
    subtopic: discovery.selection
    tags: [agents.when]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A client's support team routes inbound email into six queues. Customers must choose one of six product names
      in a required dropdown on the contact form, and the queue follows directly from that field. Misroutes are
      rare. A manager wants an LLM classifier to 'make routing smarter'. What do you recommend?
    options:
      - text: "Keep routing as a lookup on the dropdown value and put LLM effort where inputs genuinely vary"
        correct: true
        why: "The rule is exact, free and auditable, and with rare misroutes there is little headroom for a model to improve on."
      - text: "Add an LLM classifier on the email body that overrides the dropdown when the two disagree"
        why: "With misroutes already rare, an override mostly adds new errors, latency and per-email cost."
        misconception: "AI always improves a decision"
      - text: "Fine-tune a small classifier on historical tickets for cheap, fast routing"
        why: "Cheaper than an LLM, yet it still replaces a perfect-by-construction rule with a model that must be trained and monitored."
        misconception: "A smaller model removes the cost of unnecessary AI"
      - text: "Run the LLM in shadow for a month and switch routing if it beats the dropdown's accuracy"
        why: "Evidence-first sounds rigorous, but the ceiling is the small misroute rate, so the month of effort cannot repay itself."
        misconception: "Testing always pays off regardless of headroom"
    explanation: |
      Check whether AI is needed at all. When a deterministic rule already solves the problem, a model adds cost
      and failure modes. Spend the effort where inputs are open-ended.

  - id: D2-010
    version: 1
    type: single
    subtopic: discovery.selection
    tags: [delivery.scoping]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      An accounts-payable director wants an assistant to 'cut invoice approval time' and asks for a prototype in
      four weeks. Asked how long approvals take now, she says 'around five days'. Nobody has measured it, though
      the workflow tool stamps every approval step. How do you proceed?
    options:
      - text: "Pull approval timestamps from the workflow tool for recent months and use that as the baseline"
        correct: true
        why: "The data exists, costs little to extract, and gives a defensible before-and-after comparison."
      - text: "Accept the director's five-day estimate as the baseline and measure again once the assistant has launched"
        why: "A remembered average hides the spread and can embarrass both sides when real data disagrees later."
        misconception: "A stakeholder's estimate is a baseline"
      - text: "Use a published industry benchmark for invoice approval cycle time as the comparison point for results"
        why: "Benchmarks reflect other companies' processes and mixes of invoices; the client will rightly question their relevance."
        misconception: "External benchmarks substitute for the client's own data"
      - text: "Skip a baseline and survey approvers after the pilot on how much faster things feel"
        why: "Perceived speed is not measured speed and gives the sponsor nothing quantitative to defend."
        misconception: "User perception is sufficient evidence of improvement"
    explanation: |
      A measurable baseline must exist before you build, or no result can be shown. When the system already records
      timestamps, extracting them is cheap and it replaces recollection with a distribution.

  - id: D2-011
    version: 1
    type: multi
    subtopic: discovery.selection
    tags: [gov.identity]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      You are screening a candidate for the client's first AI project. Which findings should make you hesitate?
    options:
      - text: "The person who would act on the outputs has not agreed to change how they work"
        correct: true
        why: "Without someone committed to act on the output, even accurate results change nothing."
      - text: "No data the client already collects can show whether the outcome improved"
        correct: true
        why: "Without a measurable outcome the project cannot show value, and instrumentation could take longer than building."
      - text: "The needed data lives in systems where access approval typically takes months"
        correct: true
        why: "Access lead time can consume the whole engagement before any build begins."
      - text: "The current process runs on spreadsheets and email rather than a dedicated system"
        why: "That is often a sweet spot: high manual effort, little existing automation, and a low bar for improvement."
        misconception: "Informal tooling signals low value"
      - text: "A known share of today's manual outputs contains errors"
        why: "A known error rate is a baseline to beat and is useful for setting an acceptance target."
        misconception: "Existing errors make the process too risky to automate"
      - text: "A small fraction of cases need escalation to a senior specialist"
        why: "Routing hard cases to people is a standard design pattern, not a reason to avoid the project."
        misconception: "Any exception path disqualifies automation"
    explanation: |
      Red flags are missing ownership, no way to measure, and blocked data. Manual, messy or error-prone processes
      are often the best candidates because they supply the baseline and the headroom.

  - id: D2-012
    version: 1
    type: single
    subtopic: discovery.selection
    tags: [comms.stakeholders, discovery.environment]
    difficulty: 3
    level: evaluate
    time_s: 120
    stem: |
      You can fund one eight-week effort. Option X is claims-document triage: clean data and a supportive operations
      manager, but no executive sponsor. Option Y is the CEO's priority, a pricing optimizer: the sponsor is strong,
      but sales data lives in regional spreadsheets with inconsistent definitions of 'discount'. Which approach is
      best?
    options:
      - text: "Start with the CEO's project behind a two-week data feasibility check, with claims triage as fallback"
        correct: true
        why: "It uses the sponsor's backing while testing the biggest risk cheaply, and the fallback means a failed check costs two weeks, not eight."
      - text: "Choose claims triage, because data readiness predicts delivery better than executive enthusiasm does"
        why: "Without an executive sponsor, funding, cross-team access and adoption stall at the first obstacle, even when the data is clean."
        misconception: "Technical feasibility outweighs organizational backing"
      - text: "Choose the pricing project and plan to clean the regional data as the core work of the eight weeks"
        why: "Committing the whole timebox to data cleanup with unknown scope risks delivering a clean dataset and no optimizer."
        misconception: "Strong sponsorship overcomes poor data"
      - text: "Decline both until the client fixes its discount definitions and names a sponsor for claims triage"
        why: "Gatekeeping delays value; the engagement can test feasibility itself in a short time."
        misconception: "Prerequisites must be complete before starting"
    explanation: |
      Sponsorship and feasibility both matter. When they are split across candidates, bound the risk of the
      sponsored option with a short, explicit feasibility gate and keep a credible fallback ready.

  # ===================== discovery.environment =====================
  - id: D2-013
    version: 1
    type: single
    subtopic: discovery.environment
    competencies: [x.ai-assisted]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      You are onboarding at a utility whose billing database holds about 400 tables with names like `T_CUST_X2` and
      `ACCT_MSTR_OLD`. There is no data dictionary, and the original DBA left years ago. The first use case needs
      billing-dispute data. What is the most reliable way to build understanding?
    options:
      - text: "Trace several real disputes from the clerk's screens to the rows they touch, and document only that path"
        correct: true
        why: "Following real records ties unclear names to known business meaning and builds knowledge exactly where the use case needs it."
      - text: "Auto-generate an entity-relationship diagram of all tables and have the client's team confirm it"
        why: "A diagram shows structure, not meaning; cryptic names stay cryptic, and busy reviewers confirm what they can recognize."
        misconception: "Documenting everything first is thorough discovery"
      - text: "Ask an LLM to infer each column's meaning from names and sample values, then use those definitions"
        why: "Plausible guesses can be wrong in costly ways, such as sign conventions or status codes, and need verification against known records."
        misconception: "Model-inferred semantics are reliable without checking"
      - text: "Ask the client to produce a data dictionary before work begins"
        why: "The knowledge to write it left with the DBA, so the request stalls the project and the client cannot deliver it."
        misconception: "The client must prepare documentation"
    explanation: |
      System archaeology works best by tracing known business events through the system, checking against what users
      see, and documenting only the slice you need. AI can propose hypotheses, but each definition must be verified
      against a known record.

  - id: D2-014
    version: 1
    type: single
    subtopic: discovery.environment
    tags: [gov.identity, comms.stakeholders]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      Your team needs read access to a customer's production claims database. The security review normally takes six
      weeks, and the sponsor wants a working demo in four. What do you do?
    options:
      - text: "File the narrowest-scope access request now and work in the meantime from a small client-approved extract"
        correct: true
        why: "A narrow request is easier to approve, and an approved real-data sample lets design and testing meet real data before access lands."
      - text: "Ask a client engineer to export the tables under their own credentials and share them with the team"
        why: "It bypasses the controls the review exists to enforce and exposes both the engineer and the project to a policy breach."
        misconception: "A friendly insider can shortcut formal access"
      - text: "Build the whole pipeline on synthetic data and swap in real data once access is granted"
        why: "Real data holds the surprises (nulls, odd formats, code values); finding them in week six instead of week one wrecks the schedule."
        misconception: "Synthetic data is an equivalent substitute for real data"
      - text: "Ask the sponsor to compress the review to two weeks and pause build work until it clears"
        why: "Asking the sponsor to push is reasonable alongside other steps, but halting work turns a delay into idle time."
        misconception: "Escalation alone solves access lead time"
    explanation: |
      Access lead time is a schedule risk to manage from day one: request the minimum, in writing, immediately, and
      keep working on approved data. Real samples expose data surprises early; synthetic data hides them.

  - id: D2-015
    version: 1
    type: multi
    subtopic: discovery.environment
    tags: [gov.audit-compliance]
    difficulty: 1
    level: apply
    time_s: 80
    stem: |
      Before designing a solution at a freight broker, you build an inventory of the data sources and access paths
      it will depend on. What should you capture for each source?
    options:
      - text: "The owner, who approves access, and the typical approval lead time"
        correct: true
        why: "Access lead time and the right approver decide when the work can start."
      - text: "How current the data is and how often it refreshes"
        correct: true
        why: "Staleness decides whether a use case is viable at all, for example live shipment tracking against a nightly feed."
      - text: "Its sensitivity classification and any handling restrictions"
        correct: true
        why: "Restrictions on personal or contractual data shape where the data may go, who may see it, and which models can touch it."
      - text: "A complete list of every table and column, so nothing is missed"
        why: "Exhaustive cataloguing costs weeks, and most of it is irrelevant to the first use case."
        misconception: "Completeness beats relevance in inventories"
      - text: "Which team's preferred tooling vendor sits behind the source"
        why: "Vendor preferences matter later for integration choices but do not decide feasibility or timeline now."
        misconception: "Technology lineage is the key attribute"
      - text: "The projected data growth over the next five years"
        why: "Long-range growth is a capacity-planning input for production, not a discovery gating question."
        misconception: "Scale planning belongs in discovery"
    explanation: |
      A discovery inventory answers who owns the data, how fast access can be granted, how fresh it is and what
      rules govern it. Those facts decide scope and schedule; exhaustive catalogues do not.

  - id: D2-016
    version: 1
    type: single
    subtopic: discovery.environment
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      In a logistics company's 20-year-old scheduling system, shipments with status code 7 behave differently in
      the nightly batch, and nothing documents why. One senior planner knows, and she retires in three weeks. Your
      use case depends on shipment status. What do you do first?
    options:
      - text: "Book targeted sessions with her now on the status codes you use and verify each against code and data"
        correct: true
        why: "Her knowledge is the scarcest, perishable asset; targeted sessions capture it and verification against code and data catches memory errors."
      - text: "Ask her to write a handover document covering the whole scheduling system before she retires next month"
        why: "A broad document is slow to write and unfocused, and unverified claims get baked into your design."
        misconception: "Documentation is the best way to transfer expertise"
      - text: "Carry on building and bring questions to her whenever they come up in testing or in review sessions"
        why: "Testing surfaces questions late, and some will arrive after she has left."
        misconception: "Learn on demand"
      - text: "Infer the behavior from batch code and historical data, keeping her as a last resort for the gaps"
        why: "Code archaeology is sound but slow; skipping the cheapest source on a three-week clock wastes time that cannot be recovered."
        misconception: "Code and data are more reliable than people"
    explanation: |
      Tribal knowledge is perishable. Capture it early and in a focused way, then verify it against the system's
      actual behavior; neither memory nor code archaeology is reliable alone.

  - id: D2-017
    version: 1
    type: single
    subtopic: discovery.environment
    tags: [eval.datasets, rag.ingestion]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      Two weeks in, your document-extraction prototype scores very well on 200 documents that client analysts
      hand-picked as 'typical'. The sponsor wants to demo it to the steering group on Friday and says production
      documents are 'basically the same'. What do you do before the demo?
    options:
      - text: "Run it on a random sample from the production repository and show those results alongside"
        correct: true
        why: "A random production sample reveals the scans, formats and edge cases that curation removed, before the sponsor's expectations harden."
      - text: "Demo the curated results, with a clear 'preliminary' label on every slide that shows a metric"
        why: "Executives remember the headline number; the label does not stop expectations from anchoring on it."
        misconception: "Caveats neutralize misleading numbers"
      - text: "Ask the analysts to hand-pick a larger set of 2,000 documents for more robust results"
        why: "A larger curated set has the same selection bias and only looks more robust."
        misconception: "More samples fix bias"
      - text: "Postpone the demo until ingestion handles every production source and format"
        why: "Waiting for full ingestion is slow; a random sample from the repository answers the question now."
        misconception: "Do not show anything until complete"
    explanation: |
      Hand-picked samples overstate performance. Prototyping on real, randomly drawn data early finds the
      problems that matter while they are cheap to fix and before stakeholders anchor on flattering numbers.


  # ===================== delivery.scoping =====================
  - id: D2-018
    version: 1
    type: single
    subtopic: delivery.scoping
    difficulty: 1
    level: recall
    time_s: 60
    stem: |
      After a two-week proof of concept on sample documents, you propose a pilot. The client's COO asks what will be
      different. Which answer is most accurate?
    options:
      - text: "Limited real users work on live data in their normal workflow, judged against pre-agreed metrics"
        correct: true
        why: "Real users, real data and a real workflow are what make a pilot evidence of value, as opposed to evidence of feasibility."
      - text: "It is the proof of concept polished further, with more document types and a better interface for demos"
        why: "Polish and breadth on sample data still only demonstrate feasibility; nothing about it is tested in real work."
        misconception: "A pilot is a bigger proof of concept"
      - text: "It is a feature-complete release to every user, with a feature flag as the safety net for problems"
        why: "That describes a launch; a pilot deliberately limits exposure so you can learn before committing."
        misconception: "Pilot means early production release"
      - text: "It is the same demo moved into the client's cloud account with their IT team observing it"
        why: "Moving the environment changes where it runs, not whether real users and live data validate the value."
        misconception: "Deploying in the client's environment makes it a pilot"
    explanation: |
      A proof of concept answers 'can it work?'. A pilot answers 'does it deliver value in real work?', so it needs
      real users, real data and the real workflow, with success metrics set beforehand.

  - id: D2-019
    version: 1
    type: single
    subtopic: delivery.scoping
    tags: [eval.methods]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      A client wants AI-drafted replies for its support team and says success is 'agents liking it'. You are about
      to start building. Which metric set should you agree on in writing first?
    options:
      - text: "Median first-response time and agent edit rate against baseline, plus a satisfaction floor"
        correct: true
        why: "It ties to the business outcome, measures real use of the drafts, and guards against faster but worse answers."
      - text: "An offline similarity score between drafts and past agent replies, with a target threshold"
        why: "It measures resemblance to history, not value; a draft can score well and still be slow to fix or wrong for a new case."
        misconception: "Model-quality metrics define business success"
      - text: "Weekly active agents using the drafting feature, against a target adoption percentage"
        why: "Usage shows that people open the feature, not that outcomes improved; it can rise while quality falls."
        misconception: "Adoption equals value"
      - text: "A satisfaction survey of agents after four weeks, with a target average score on a five-point scale"
        why: "It formalizes 'agents liking it', which is subjective, has no baseline, and is easy to move without changing outcomes."
        misconception: "User sentiment is an acceptance criterion"
    explanation: |
      Agree success metrics and thresholds before building: an outcome against a baseline, a usage measure close to
      the work, and a guardrail so one number cannot be gamed. Vague satisfaction targets move the goalposts later.

  - id: D2-020
    version: 1
    type: single
    subtopic: delivery.scoping
    tags: [comms.stakeholders]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      You are in week 5 of an 8-week invoice-extraction pilot. The head of operations, who funds the pilot, asks for
      a second language and a new document type, saying 'it should be easy for you'. The agreed success metric
      covers the current scope. What is the best response?
    options:
      - text: "Log a change request, size its impact, and offer to swap it for current scope or defer it"
        correct: true
        why: "It treats her request as legitimate, makes the cost visible, and protects the agreed metric and date."
      - text: "Accept it and add engineers to absorb the work, since the funder's goodwill matters most"
        why: "Late additions to a small team slow it down, and the agreed result is put at risk to please one person."
        misconception: "Adding people absorbs scope"
      - text: "Decline, citing the signed scope, and suggest she raise it again after the pilot launches"
        why: "A flat refusal damages the relationship with the funder, and she may have a real need worth planning for."
        misconception: "Scope boundaries are enforced by refusal"
      - text: "Accept it and extend the pilot by a few weeks so the metrics can cover everything"
        why: "Moving the finish line delays the decision the pilot exists to inform and weakens the original success criteria."
        misconception: "The timeline is flexible when the sponsor asks"
    explanation: |
      Handle scope changes with a visible trade: estimate the impact, offer to swap or defer, and keep the original
      success criteria and date intact. Cut scope, not value, and never silently absorb.

  - id: D2-021
    version: 1
    type: multi
    subtopic: delivery.scoping
    tags: [comms.stakeholders]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A six-week pilot is meant to expose 40 real users from the start of week 4. At the end of week 2 the team has
      finished about 40% of the planned work. Which responses are sound?
    options:
      - text: "Cut features that do not move the agreed success metric, and hold the date real users first touch it"
        correct: true
        why: "The date for real users is when learning starts; scope tied to the metric is what must survive."
      - text: "Re-order the remaining work so the riskiest assumptions are tested first"
        correct: true
        why: "Risky unknowns surfaced early leave time to react; surfacing them in week 6 leaves none."
      - text: "Tell the sponsor now which scope is at risk and what the options are"
        correct: true
        why: "Early, specific warning preserves trust and gives the sponsor a chance to decide the trade-offs."
      - text: "Extend the timebox by a month so the full planned scope fits"
        why: "Extension delays the decision and invites further scope growth; the timebox is the discipline that forces prioritization."
        misconception: "Time boxes should flex to fit scope"
      - text: "Pause output evaluation for now to save time and restore it before the pilot ends"
        why: "Evaluation tells you whether the pilot is working; deferring it removes feedback exactly when you need it."
        misconception: "Testing is overhead that can be postponed"
      - text: "Keep every feature but use internal testers in place of the 40 users to get quicker feedback"
        why: "Internal testers are not the real users doing real work, so the pilot stops producing evidence of value."
        misconception: "Substituting convenient users preserves the pilot's value"
    explanation: |
      When behind, protect the elements that make the pilot informative: real users on a fixed date, evaluation, and
      transparency with the sponsor. Everything else is negotiable scope.

  - id: D2-022
    version: 1
    type: single
    subtopic: delivery.scoping
    tags: [gov.audit-compliance]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      A regional bank asks whether an LLM can extract covenant terms from loan agreements accurately enough to
      support credit analysts. Nobody has tried it. Legal forbids sending production loan documents to any external
      model service until a review completes in three months. Which engagement shape fits?
    options:
      - text: "A time-boxed proof of concept on approved, redacted samples, with the accuracy bar set first"
        correct: true
        why: "The open question is feasibility, which a short test on permitted data answers without breaching the data restriction."
      - text: "A pilot with ten credit analysts on live agreements, running in shadow mode alongside their work"
        why: "Even in shadow mode, live agreements would go to the model service, which legal forbids; and feasibility is still unproven."
        misconception: "Shadow mode sidesteps data restrictions"
      - text: "An MVP integrated with the loan system, covering the main covenant types found in the portfolio"
        why: "Building integration before knowing the extraction can work puts engineering time at risk on an open question."
        misconception: "Build the product to find out whether it works"
      - text: "Wait for the legal review to finish, then run a full pilot with analysts in one step"
        why: "Three idle months, and the review itself would benefit from evidence about what the test showed."
        misconception: "Do nothing until all constraints clear"
    explanation: |
      Choose the smallest engagement that answers the open question. Feasibility is a proof-of-concept question; a
      pilot needs real users and real data, which constraints here forbid for now.

  - id: D2-023
    version: 1
    type: numeric
    subtopic: delivery.scoping
    tags: [obs.cost]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 150
    stem: |
      A pilot assistant helps process supplier invoices. The client handles 3,000 invoices a month at 11 minutes of
      staff time each. The assistant covers 60% of invoices and cuts handling to 6 minutes for those. The other
      40% are processed as before. Loaded staff cost is $48 per hour, and each invoice the assistant handles costs
      $0.40 in model and infrastructure fees. What is the net monthly saving, in US dollars?
    answer: {value: 6480, tolerance: 50, tolerance_type: abs, unit: "USD"}
    work: |
      Covered invoices: 3,000 x 0.6 = 1,800. Minutes saved: 1,800 x (11 - 6) = 9,000 min = 150 h. Labor saving:
      150 x $48 = $7,200. Run cost: 1,800 x $0.40 = $720. Net: $7,200 - $720 = $6,480 per month.
    explanation: |
      Apply savings only to the share the assistant handles. Common errors: applying the 5-minute saving to all
      3,000 invoices ($12,000 before costs), ignoring run cost ($7,200), or charging run cost on all 3,000 invoices
      ($6,000). Net savings, not gross, are the figure to compare with the pilot's success target.

  # ===================== delivery.go-live =====================
  - id: D2-024
    version: 1
    type: single
    subtopic: delivery.go-live
    tags: [adoption.handoff]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      Nine months ago a document-review assistant beat its targets in a 50-user pilot, and it is still not in
      production. Security review passed, the system-of-record integration works, and accuracy is above target. It
      runs in the vendor team's cloud account on a project budget that ends next quarter, and the client's IT group
      says nobody on their side is assigned to carry its pager. What should be addressed first?
    options:
      - text: "Agree who owns and funds running it in the client's environment after go-live"
        correct: true
        why: "Every technical gate is clear; the missing element is an owner with budget, without which no one will approve go-live."
      - text: "Extend the pilot to more users to build a stronger evidence base"
        why: "The pilot already beat its targets, so more evidence extends the wait without removing the actual blocker."
        misconception: "More pilot data will unlock the decision"
      - text: "Re-run evaluation on a larger test set to raise confidence in accuracy"
        why: "Accuracy is not in question; the stem shows the targets were met."
        misconception: "Pilot purgatory is an accuracy problem"
      - text: "Add the features pilot users have asked for so adoption is higher at launch"
        why: "Feature work delays go-live without addressing ownership, and the real risk is that nobody will run it."
        misconception: "A more polished product will get approved"
    explanation: |
      Pilots often stall after technical success because nobody owns production: budget, on-call, environment and
      accountability. Resolve ownership explicitly, or a successful pilot becomes permanent.

  - id: D2-025
    version: 1
    type: multi
    subtopic: delivery.go-live
    tags: [obs.slo]
    difficulty: 1
    level: apply
    time_s: 80
    stem: |
      A claims-triage assistant is two weeks from go-live at an insurer. Which items should be in place at the
      production readiness review?
    options:
      - text: "A rollback path that has been exercised in staging, not only written down"
        correct: true
        why: "An untested rollback often fails when needed; exercising it proves the time and steps."
      - text: "A named client-side owner with an on-call rotation and a runbook for likely failures"
        correct: true
        why: "Production incidents need a person who is responsible and a documented first response."
      - text: "Alerts on output quality and spend, not only uptime and error rates"
        correct: true
        why: "AI systems can fail silently, returning plausible but wrong answers or running up cost without an error."
      - text: "A perfect score on the offline test set"
        why: "Agreed thresholds are the gate; a perfect score is unrealistic and a poor reason to delay."
        misconception: "Readiness means zero known errors"
      - text: "Parity with every behavior of the manual process being replaced"
        why: "Parity is a scoping choice, not a readiness criterion; rare cases can stay with humans."
        misconception: "The new system must replace everything the old one did"
      - text: "A written rationale for each prompt revision made during the build"
        why: "Helpful for maintainers but not a launch gate; the system can run safely without it."
        misconception: "Documentation completeness gates launch"
    explanation: |
      Production readiness covers ownership, operability and recovery: a tested rollback, a responsible owner with a
      runbook, and monitoring that catches quality and cost problems, not only crashes.

  - id: D2-026
    version: 1
    type: single
    subtopic: delivery.go-live
    tags: [eval.online]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      An insurer wants a model to route incoming claims to specialist teams. Mistakes delay time-sensitive claims
      that carry regulatory deadlines. You have validated the model offline on last year's claims. What is the best
      first exposure to production traffic?
    options:
      - text: "Run it in shadow mode, logging its routing next to the humans' decisions without acting on it"
        correct: true
        why: "Live traffic reveals drift and odd inputs at no risk to deadlines, and the logged comparison gives an agreement rate."
      - text: "Let it route 5% of live claims, with staff checking each routing result shortly after it is sent"
        why: "A wrong route still delays a time-sensitive claim before anyone checks it, even if the cohort is small."
        misconception: "A small percentage limits the consequences enough"
      - text: "Release it to one low-volume specialty queue and have a lead review its results every day"
        why: "A queue limits volume but not the consequences per claim; errors there still miss deadlines."
        misconception: "Narrow scope is the same as no impact"
      - text: "Hold off until the offline test set covers every claim type and every regional office"
        why: "A bigger offline set cannot reveal live drift, and delaying live exposure postpones learning."
        misconception: "Offline coverage substitutes for production evidence"
    explanation: |
      Shadow mode compares the system with current practice on live traffic without consequences. Use it first
      when errors are costly, then move to a small cohort with action enabled once agreement is understood.

  - id: D2-027
    version: 1
    type: single
    subtopic: delivery.go-live
    tags: [obs.slo, obs.cost]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      Your support assistant's rollout runs at 5%, 25%, 50% and 100% of agents. The gate was defined only as agent
      edit rate, which remains under target. At 25%, p95 latency has doubled and cost per ticket is about 40% above
      the forecast the sponsor approved. What should you do?
    options:
      - text: "Hold at 25%, add latency and cost thresholds as gates with the sponsor, and fix or accept the gap"
        correct: true
        why: "The ramp exists to catch problems before full exposure; incomplete gates should be fixed, not used as a loophole."
      - text: "Proceed, since the only agreed gate passed, and track latency and cost once everyone is at 100%"
        why: "Meeting the letter of an incomplete gate ignores evidence that two other outcomes the sponsor cares about are off."
        misconception: "Passing the stated gate is sufficient"
      - text: "Roll back to 5% until latency and cost return to the forecast, then restart the ramp from there"
        why: "Nothing suggests harm at 25%, so a full step back costs a lot of ramp time; holding gives the same safety."
        misconception: "Any gate miss requires a rollback"
      - text: "Proceed to 50% for more traffic data, since cost per ticket usually falls as usage grows at scale"
        why: "Model cost per ticket scales roughly linearly with usage, so volume brings no discount; latency may worsen with load."
        misconception: "Scale lowers unit cost the way it does for fixed-cost software"
    explanation: |
      Progressive rollout is only as good as its gates. Define quality, latency, cost and error thresholds up front;
      when a step exposes a missing one, pause, agree it with the sponsor, and then continue.

  - id: D2-028
    version: 1
    type: single
    subtopic: delivery.go-live
    tags: [int.resilience, gov.audit-compliance]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      An assistant drafts and submits purchase orders directly into a manufacturer's ERP. The go-live plan's
      rollback section says: 'redeploy the previous container image within 15 minutes'. What is the most important
      gap in that rollback plan?
    options:
      - text: "It does not cover finding and correcting the orders the faulty version already submitted"
        correct: true
        why: "Redeploying code does not undo records that already exist in the ERP; those need identification and reversal or review."
      - text: "It lacks a hot-standby copy of the previous model endpoint that could take traffic at once"
        why: "A 15-minute redeploy is acceptable for this workload, and a standby does nothing for orders already written."
        misconception: "Faster failover is the main rollback concern"
      - text: "It has not been timed under peak load, so the 15 minutes may not hold when volume is high"
        why: "A reasonable test, but timing the redeploy still leaves the damage done during the bad window uncorrected."
        misconception: "Rollback quality is about speed"
      - text: "It has no canary stage before full release to limit how many orders a faulty version could send"
        why: "A canary reduces exposure but is a release-control gap, not a hole in the rollback plan itself."
        misconception: "Staged release replaces a data-level recovery plan"
    explanation: |
      Rolling back code is not rolling back effects. When a system writes to other systems, the plan needs a way to
      identify every action taken by the faulty version, tag it, and reverse or review it.

  - id: D2-029
    version: 1
    type: single
    subtopic: delivery.go-live
    difficulty: 1
    level: apply
    time_s: 70
    stem: |
      Before enabling the first 5% cohort of a staged rollout, which decision matters most to have settled?
    options:
      - text: "Numeric thresholds that trigger a pause or rollback, and who has authority to call it"
        correct: true
        why: "When metrics wobble at 2 a.m., pre-agreed triggers and a named decider stop debate and speed the response."
      - text: "The calendar dates on which each later step of the ramp will take place for the remaining cohorts"
        why: "Dates are a useful plan but should depend on gates being met; fixed dates push teams to proceed regardless."
        misconception: "A schedule is the control mechanism"
      - text: "The communication plan that announces the assistant to all users and explains how to use it"
        why: "Important for adoption, but it does not govern what happens when the first cohort sees problems."
        misconception: "Communication is the main launch control"
      - text: "The v2 feature roadmap, shared so that users know which improvements are coming next"
        why: "It sets expectations for later but gives no protection while the first cohort is exposed."
        misconception: "Roadmap clarity de-risks launch"
    explanation: |
      A staged rollout is a control system: it needs measurable gates, explicit rollback triggers and a named decision
      maker, agreed before exposure begins rather than improvised during an incident.

  - id: D2-030
    version: 1
    type: single
    subtopic: delivery.go-live
    tags: [delivery.scoping]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      Your one-week proof of concept, a notebook calling a model with prompts pasted in and an API key hardcoded,
      impressed the sponsor, who now says 'ship it next month'. What do you propose?
    options:
      - text: "Treat the notebook as a learning artifact: keep the prompts and test cases, rebuild the serving path"
        correct: true
        why: "Prompts and test cases carry the learning; the code was built for speed, not for secrets, retries, monitoring or support."
      - text: "Harden the notebook step by step: move secrets out, add retries and logging, and schedule it as a job"
        why: "Incremental hardening of a throwaway script yields a fragile system that is hard to test, observe and hand off."
        misconception: "Production quality can be reached by patching a prototype"
      - text: "Wrap the notebook logic in an API now and deploy it, then refactor once real users are on it"
        why: "Deferring structure to after launch turns shortcuts into permanent debt, with real users depending on them."
        misconception: "Ship first, fix later"
      - text: "Discard everything and run a design phase before writing any further code for the project"
        why: "Throws away validated prompts, data insights and test cases, and delays the sponsor with no new learning."
        misconception: "Prototype work has no reusable value"
    explanation: |
      The first version is disposable, but what it taught you is not. Carry forward prompts, evaluation cases and
      findings, and build the production path with proper secrets, error handling, observability and ownership.

  # ===================== open and audio decomposition cases =====================
  - id: D2-031
    version: 1
    type: open
    subtopic: discovery.framing
    tags: [discovery.selection]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 540
    stem: |
      The COO of a regional grocery chain (140 stores) tells you: 'We throw away too much fresh food. Use AI to fix
      it.' You have one week of discovery before a steering meeting. Write the decomposition you would bring to that
      meeting: how you would break the problem down, what you would check first and how, and what you would propose
      building first and why.
    rubric:
      - criterion: "Turns the vague request into a measurable problem"
        points: 2
        guidance: "2 if it defines waste in measurable terms (value or weight, by category and cause such as expiry, damage, over-ordering) and asks for a baseline; 1 if it mentions measuring but stays generic; 0 if it accepts 'waste' as is."
      - criterion: "Structured, non-overlapping decomposition"
        points: 3
        guidance: "3 if it splits along the flow (forecasting and ordering, receiving and storage, display and markdown, store operations) or another clean MECE structure, with hypotheses per branch; 2 if the split is sensible but loose or lacks hypotheses; 1 if a flat list of ideas; 0 if it jumps to a solution."
      - criterion: "Evidence plan in the field and in data"
        points: 2
        guidance: "2 if it includes store visits or observation plus specific data pulls (waste logs, orders, sales, shrink) with who to ask; 1 if only one of the two; 0 if neither."
      - criterion: "Chooses what to build first with explicit criteria"
        points: 2
        guidance: "2 if it applies criteria such as value, data availability, feasibility, an owner and risk, and accepts that the first answer may be rules or process, not AI; 1 if a choice with thin reasoning; 0 if no choice."
      - criterion: "Bottom line first and audience-appropriate"
        points: 1
        guidance: "1 if it opens with the recommendation, in language a COO can use; 0 if buried or jargon-heavy."
    model_answer: |
      Bottom line: I'd bring a measured breakdown of where fresh food is lost, and propose one store-level pilot at
      the largest loss point, which may turn out to be ordering accuracy or markdown timing rather than something
      exotic.

      How I'd break it down: follow the food. Loss happens at forecasting and ordering (too much arrives), receiving
      and storage (spoilage or damage in the back), display and markdown (items expire on shelf), and store
      execution (rotation, handling). Each branch has a hypothesis, for example 'bakery and produce losses come
      mostly from over-ordering on low-sales days', and I'd also cut waste by category and by store cluster.

      First checks: ask for 12 months of waste logs, orders and sales by category and store; the baseline is waste
      as a percentage of sales, by cause. In parallel I'd spend two days in three stores of different sizes
      watching ordering, receiving and markdown, since logged causes are often wrong (spoilage logged as 'expired').

      What to build first: the branch with the most money, usable data and an owner who can change behaviour. If
      over-ordering dominates, a demand-forecast suggestion into the existing ordering screen, trialled in ten
      stores with a held-out control group. If markdowns are late, a simple rule may beat a model. Success is waste
      percentage down and no rise in empty shelves. I'd leave out store-wide computer vision until the data says
      shelves are the problem.
    max_chars: 2500

  - id: D2-032
    version: 1
    type: open
    subtopic: delivery.scoping
    tags: [discovery.framing, comms.tradeoffs]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 540
    stem: |
      A bank's head of operations says commercial loan onboarding takes too long, and the board expects 'an AI
      solution' by the end of the quarter, ten weeks away. Draft the plan you would send her: what you would find
      out in the first two weeks, what you would scope as the first deliverable, how you would define success, and
      what you would explicitly leave out.
    rubric:
      - criterion: "Opens with a clear position and a realistic framing"
        points: 2
        guidance: "2 if it leads with a proposed first deliverable that can credibly be shown in the quarter and names the risk to the board's expectation; 1 if the position is vague or buried; 0 if it simply agrees to deliver 'an AI solution'."
      - criterion: "First-two-weeks discovery plan"
        points: 2
        guidance: "2 if it covers mapping the onboarding steps with real elapsed times, observing staff, and checking data and access constraints; 1 if only one; 0 if none."
      - criterion: "Scoped first deliverable (pilot-sized, real conditions)"
        points: 3
        guidance: "3 if it proposes a narrow slice (for example document intake and checklist completeness for one loan type) with real users, real documents and the real workflow; 2 if narrow but missing a real-conditions element; 1 if a broad platform; 0 if none."
      - criterion: "Success metrics agreed before building"
        points: 2
        guidance: "2 if it names a baseline-based outcome (for example cycle time, rework rate) plus a quality guardrail and a threshold; 1 if metrics without baseline or guardrail; 0 if none."
      - criterion: "Explicit exclusions and risks"
        points: 1
        guidance: "1 if it names what is out of scope and at least one dependency or risk (data access, compliance review); 0 if not."
    model_answer: |
      Proposal in one line: by week 10 we can show a pilot, not a bank-wide platform, that cuts onboarding time on
      one loan type, with the broader roll-out sequenced after the board read-out.

      Weeks 1-2: I'll map the onboarding journey from application to booking, measuring elapsed and working time
      for each step from the workflow system's timestamps, sit with onboarding analysts for a few days, and confirm
      which documents, systems and approvals are involved. In parallel we start data-access and compliance
      requests, since those are the longest lead times.

      First deliverable: most delay in these processes sits in document collection and completeness checking. If the
      data confirms that, I'd scope an assistant that classifies incoming documents, extracts the key fields, and
      flags missing items for one loan type, used by one team of analysts on live applications, with a human
      confirming each result.

      Success, agreed before we build: median days from application to credit-ready file, down from today's
      measured baseline by an agreed amount; rework rate no worse than now; analysts accept most extractions
      unchanged.

      Out of scope: credit decisioning, other loan types, integration beyond the existing workflow tool.
      Risks: access approvals and model-use review; if either slips, I'd tell you in week 3, not week 9.
    max_chars: 2500

  - id: D2-033
    version: 1
    type: open
    subtopic: delivery.go-live
    tags: [adoption.change, eval.online]
    competencies: [x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 540
    stem: |
      An underwriting assistant was piloted for eight weeks with 20 underwriters. Review time per case fell and the
      edit rate stayed within target. The sponsor now wants it live for all 600 underwriters in six weeks. Write the
      readiness and rollout plan you would propose, including what must be true before you start, how you would ramp,
      and who runs it afterward.
    rubric:
      - criterion: "Clear position on the six-week ask"
        points: 2
        guidance: "2 if it says what is achievable in six weeks (for example a ramp that reaches all users only if gates pass) and why; 1 if it agrees or refuses without reasoning; 0 if no position."
      - criterion: "Production readiness prerequisites"
        points: 3
        guidance: "3 if it covers ownership and on-call, a runbook, a tested rollback, monitoring of quality and cost, and security or compliance sign-off; 2 if three or four; 1 if one or two; 0 if none."
      - criterion: "Progressive rollout with explicit gates"
        points: 3
        guidance: "3 if it describes shadow or limited cohorts and percentage steps with numeric thresholds for quality, latency and cost and a named decider; 2 if steps but vague gates; 1 if a big-bang with extra support; 0 if none."
      - criterion: "Pilot-to-production gap addressed"
        points: 2
        guidance: "2 if it notes that 20 volunteers differ from 600 (case mix, load, resistance) and plans for it, for example by sampling harder cases and measuring adoption; 1 if mentioned without a plan; 0 if not."
      - criterion: "Post-launch ownership and handoff"
        points: 1
        guidance: "1 if it names who owns operation after the engagement and how knowledge transfers; 0 if not."
    model_answer: |
      Recommendation: all 600 underwriters in six weeks is possible only as a gated ramp, and the last step should
      be approved by the gates, not by the calendar.

      Before starting (week 1): a named client-side owner for the service and an on-call rotation; a runbook for
      the likely failures; a rollback tested in staging; dashboards and alerts for edit rate, latency, cost per case
      and error rates; and sign-off from security and model-risk, which I'd start today since they have lead times.

      Why not copy the pilot: 20 volunteers are early adopters working typical cases. At 600 we get harder case mix,
      more load and some sceptics. I'd re-test on a sample of difficult historical cases and add them to the
      regression set.

      Ramp: week 2, shadow mode alongside the existing process on live cases, comparing outputs; week 3, 10% of
      underwriters; week 4, 30%; week 5, 60%; week 6, 100%. Each step requires edit rate and referral accuracy
      within agreed bounds, p95 latency and cost per case inside the budget, and no unresolved severity-one
      incidents. The sponsor's delegate and I decide at each gate, and any breach pauses the ramp.

      Handover: the client owner runs the weekly review from week 3 with my team shadowing, so by week 6 they hold
      the runbook and change process.
    max_chars: 2500

  - id: D2-034
    version: 1
    type: open
    subtopic: discovery.environment
    tags: [gov.identity, delivery.scoping]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 3
    level: analyze
    time_s: 540
    stem: |
      Day one at a manufacturer. The plant runs a 25-year-old manufacturing execution system with an undocumented
      Oracle schema. Approval for access to the plant network takes about five weeks. Two long-serving engineers
      know the system, and one is mostly unavailable. The sponsor wants a useful prototype in six weeks that
      predicts scrap rates on one production line. Write your plan for the first two weeks, and say what you would
      do about the risks.
    rubric:
      - criterion: "Gives the schedule risk a clear verdict"
        points: 2
        guidance: "2 if it states plainly that the five-week access wait threatens the six-week target and proposes how to manage it with the sponsor; 1 if it notes the delay without consequences; 0 if it ignores it."
      - criterion: "Data and access inventory and early requests"
        points: 2
        guidance: "2 if it files the narrowest access requests on day one and lists sources, owners, approval paths and sensitivity; 1 if only requests or only an inventory; 0 if neither."
      - criterion: "System archaeology approach"
        points: 3
        guidance: "3 if it traces real production events and scrap records through the system with the available engineer, verifies findings against data, and documents only what the use case needs; 2 if it uses the engineers but lacks verification or focus; 1 if it plans a full schema documentation effort; 0 if none."
      - criterion: "Keeps making progress while blocked"
        points: 2
        guidance: "2 if it uses approved sample extracts, exported reports or historical files to prototype on real data, and defines what can be validated before access; 1 if it only suggests synthetic data; 0 if it waits."
      - criterion: "Defines success and scope for the prototype"
        points: 1
        guidance: "1 if it states a measurable target (for example a baseline scrap rate and a prediction-quality threshold on one line) and what is left out; 0 if not."
    model_answer: |
      Headline: the six-week target is at risk because plant-network access takes five weeks. I'd tell the sponsor
      on day one and plan to work around the wait rather than hope it shortens.

      Day 1-2: file the narrowest possible access request (read-only, one line's tables) and ask the sponsor to
      sponsor it. Build an inventory of sources: the MES database, quality-inspection records, maintenance logs,
      any spreadsheets. For each, note the owner, the approver, the lead time and the sensitivity. Ask whether
      anyone can provide an approved extract or existing reports in the meantime.

      Days 3-10: with the available engineer, trace a handful of real scrap events from what operators see on screen
      to the rows behind them, and record what each field means, checking each claim against records. I'd document
      only the tables that scrap prediction needs. In parallel, start on whatever extract we get, so I meet real
      data quirks (missing batches, inconsistent codes) now, not in week five.

      Risks and mitigations: the single knowledge-holder, so I'd record sessions and capture the status codes
      first; data that turns out too thin, which I'd learn in week two, not five; and access slipping further, in
      which case the prototype becomes a backtest on historical data.

      Success: a baseline scrap rate for the line, and a prediction that beats a simple rule at an agreed threshold.
      Out of scope: other lines and any write-back to the MES.
    max_chars: 2500

  - id: D2-035
    version: 1
    type: audio
    subtopic: discovery.framing
    tags: [delivery.scoping]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 2
    level: apply
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      An elevator-maintenance company tells you: 'Help our field technicians fix equipment faster with AI.' Out
      loud: how do you break this down, and what is the first thing you would go and find out?
    rubric:
      - criterion: "States an approach before details"
        points: 2
        guidance: "2 if the first sentence gives a clear approach (for example 'I'd first locate where technician time goes'); 1 if it arrives mid-answer; 0 if it only lists ideas."
      - criterion: "Structured breakdown of the job"
        points: 3
        guidance: "3 if it splits the technician's work into clear stages (for example dispatch and travel, diagnosis, parts, repair, documentation) with a metric for time or repeat visits; 2 if reasonable but overlapping or missing a metric; 1 if a list of AI ideas; 0 if none."
      - criterion: "Concrete first discovery action"
        points: 2
        guidance: "2 if it names ride-alongs or observation plus a data pull (work orders, timestamps, repeat-visit rates); 1 if only interviews or only data; 0 if neither."
      - criterion: "What might be built first and why"
        points: 2
        guidance: "2 if it links the likely first build to the biggest measured loss, with a baseline, and notes it may not need AI; 1 if it picks a tool without criteria; 0 if no choice."
    model_answer: |
      I'd start by finding out where technician time actually goes, before choosing any AI. 'Fix faster' is vague,
      so I'd split a service call into stages: dispatch and travel, diagnosis on site, getting parts, the repair
      itself, and paperwork. For each stage, I'd want a number: average time, and how often a second visit is needed,
      because repeat visits are usually the costliest.

      The first thing I'd do is ride along with technicians on a handful of calls, in different building types, and
      pull a few months of work-order data with timestamps and parts used. Ride-alongs show things the data hides,
      like technicians phoning a colleague to ask about an error code.

      Then I'd pick the stage with the most measurable loss. If diagnosis is the issue, an assistant that searches
      service manuals and past fixes for a given fault code might help, and I'd trial it with a small group, measuring
      time on site and repeat visits. If the loss is mostly parts not being on the truck, the fix may be better
      stocking rules, no AI needed. Either way, I'd agree the target and baseline with the operations lead first.

  - id: D2-036
    version: 1
    type: audio
    subtopic: discovery.selection
    tags: [delivery.scoping, comms.tradeoffs]
    competencies: [x.decomposition, x.written-comms]
    difficulty: 3
    level: evaluate
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      A city transit agency's director wants to 'reduce late buses with AI'. You have two minutes with her. Talk
      through how you would break the problem down, how you would choose what to work on first, and how she would
      know it worked.
    rubric:
      - criterion: "Leads with a position"
        points: 2
        guidance: "2 if it starts with a clear answer (for example 'find where lateness comes from, then pick the cause we can change'); 1 if the position comes late; 0 if absent."
      - criterion: "Decomposes the problem into non-overlapping causes"
        points: 3
        guidance: "3 if it separates causes along a clean structure (for example scheduling and timetable design, road conditions and traffic, vehicle availability and breakdowns, dwell time at stops, driver and depot operations) and says how to size each from existing data; 2 if sensible but overlapping or unsized; 1 if a list of AI features; 0 if none."
      - criterion: "Explicit criteria for choosing the first target"
        points: 2
        guidance: "2 if it uses criteria such as size of the effect, data available, who owns the lever, and whether AI is needed; 1 if it picks one without criteria; 0 if none."
      - criterion: "Success measure and baseline"
        points: 2
        guidance: "2 if it names a baseline-based measure such as on-time percentage by route with a time-boxed trial against comparable routes; 1 if the measure is vague; 0 if none."
      - criterion: "Honest about trade-offs or limits"
        points: 1
        guidance: "1 if it acknowledges at least one limit, such as the fact that some causes are outside the agency's control or may not need AI; 0 if not."
    model_answer: |
      My answer is that I'd first find out why buses are late and then work on the cause the agency can change,
      which may not need AI at all.

      I'd split lateness into causes that don't overlap: timetable design that's unrealistic for the road, traffic and
      incidents, vehicle availability and breakdowns, time spent at stops, and depot or driver operations such as
      late pull-outs. The agency already has GPS and schedule data, so within a few weeks I could size each cause as
      minutes of delay by route and time of day.

      To choose, I'd weigh four things: how much delay the cause explains, whether the data is there, whether
      someone at the agency owns the lever, and whether a model is even needed. For example, if the timetable runs
      tight on a few routes, re-timing them is a scheduling fix. If breakdowns dominate, predicting which vehicles
      are likely to fail could be worth a pilot with the maintenance team.

      Success would be on-time performance, measured as the share of trips within a few minutes of schedule, compared
      against similar routes without the change over a couple of months. Some causes, like weather and incidents,
      are outside the agency's control, so I'd say upfront what we can and can't promise.
