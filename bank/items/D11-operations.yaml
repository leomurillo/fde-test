  - id: D11-023
    version: 1
    type: open
    subtopic: obs.cost
    tags: [comms.stakeholders, agents.state]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 540
    stem: |
      Monday morning: over the weekend a retry loop in your deployed agent burned about $18,000 in model spend for a
      single tenant. The client's CFO and CTO are on the thread and the CFO is angry. Write the message you would
      send, covering what happened, what you are changing and what you need from them.
    rubric:
      - criterion: Opens with impact and ownership
        points: 2
        guidance: 2 if the first lines state the amount, the cause category and that the team owns the fix; 1 if the facts are there but buried or defensive; 0 if it opens with excuses or jargon.
      - criterion: Plain-language cause
        points: 2
        guidance: 2 if it explains that a failing tool call made the agent retry without a limit and there was no spend cap or alert; 1 if vague ("a bug"); 0 if absent or blaming the provider.
      - criterion: Concrete controls with owners and dates
        points: 3
        guidance: 3 if it lists per-run step and cost caps, per-tenant spend limits that halt work, alerts and a kill switch, each with an owner or date; 2 if controls are named without dates; 1 if only monitoring; 0 if none.
      - criterion: Financial and follow-up handling
        points: 2
        guidance: 2 if it addresses the cost (credit or review with the provider, how the tenant is treated) and promises a written post-incident review by a date; 1 if one; 0 if neither.
      - criterion: Tone and audience fit
        points: 1
        guidance: 1 if calm, direct and appropriate for a CFO and CTO, with no blame; 0 otherwise.
    model_answer: |
      Subject: Weekend overspend ($18k) - what happened and what we are changing

      We are responsible for this. Between Saturday 02:00 and Monday 06:00 one agent run on the Acme tenant retried
      a failing ERP call without any limit and spent about $18,000. It is stopped, and no customer data was involved.

      Cause: the ERP lookup began returning errors and the agent kept retrying. We had no per-run limit on steps or
      cost, and our spend alerts reported daily rather than as it happened, so nobody was paged.

      What we are changing (owners and dates):
      1. Per-run caps on steps, tokens and cost that stop the run: Tuesday.
      2. Per-tenant spend limits that pause work automatically, with an alert at 50% and 80%: Thursday.
      3. A kill switch your operations team can use and a paging alert on abnormal spend rate: next Monday.
      4. Failed tool calls will use bounded retries with backoff and escalate to a human.

      Money: we are reviewing the provider usage with them and will propose how to handle the cost in our call tomorrow.
      
      Next steps: a short written post-incident review by Friday. From you: the on-call contact for after-hours escalation and
      agreement on a monthly budget per tenant.
    max_chars: 2000

  - id: D11-024
    version: 1
    type: open
    subtopic: obs.tracing
    tags: [obs.slo, gov.audit-compliance]
    competencies: [x.decomposition]
    difficulty: 3
    level: evaluate
    time_s: 540
    stem: |
      You are deploying a multi-tenant agent platform for an insurer. Leadership asks what you will monitor before
      go-live. Constraints: prompts contain personal data, the on-call team is small, and the CFO wants cost per tenant.
      Describe your observability design and the alerts you would page on.
    rubric:
      - criterion: Structured telemetry across the run
        points: 3
        guidance: 3 if it describes traces with spans per model and tool call, metrics, and structured logs correlated by IDs, with token usage, model and tenant on the data; 2 if traces and metrics but thin on attributes; 1 if generic logging; 0 if none.
      - criterion: Privacy handling
        points: 2
        guidance: 2 if message content is off or redacted by default, with controlled access to any retained content; 1 if mentioned without mechanism; 0 if ignored.
      - criterion: Cost attribution and limits
        points: 2
        guidance: 2 if cost per tenant and feature comes from token records and there are budget caps with alerts; 1 if reporting only; 0 if absent.
      - criterion: SLOs and paging discipline
        points: 3
        guidance: 3 if it defines separate availability, latency and sampled quality objectives and pages only on user-impacting or fast-burn conditions, with runbooks; 2 if SLOs without paging discipline; 1 if a flat list of alerts; 0 if none.
    model_answer: |
      Design in four layers.

      Telemetry: OpenTelemetry traces with one span per model call and tool call, using GenAI conventions for model
      and token usage, plus tenant, feature and run ID on every span. Metrics for request rate, errors, latency and
      tokens; structured logs carry the trace ID.

      Privacy: prompt and output content is not captured by default. A redacting pipeline plus an opt-in, access-controlled
      store holds content for debugging, with short retention. Spans keep references, not text.

      Cost: spend per tenant, feature and model computed from recorded tokens and a price table, with per-run caps
      on steps and cost, per-tenant limits that halt work, and a daily review of the top spenders.

      SLOs: availability, time-to-first-token p95, and a quality SLI from weekly sampled, graded conversations. Page
      only on fast error-budget burn (for example 14x over one hour), safety incidents and cost-rate spikes;
      everything else creates tickets. Each page links to a runbook with a kill switch for retrieval and tools.
      
      Before go-live: a game day where we break a tool, spike cost and verify that the alerts fire.
    max_chars: 2000

