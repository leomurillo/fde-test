    rubric:
      - criterion: Leads with status and impact
        points: 2
        guidance: 2 if it starts with what is happening, the scope (about 300 conversations) and that the feature is disabled; 1 if facts are present but disorganised; 0 if it starts with technical detail.
      - criterion: Honest about what is unknown
        points: 2
        guidance: 2 if it clearly separates what is known from what is unknown, without speculating about the cause; 1 if partially; 0 if it guesses or hides uncertainty.
      - criterion: Actions in progress
        points: 3
        guidance: 3 if it covers containment, evidence preservation, identifying affected customers from logs and the plan to correct their information; 2 if two of these; 1 if one; 0 if none.
      - criterion: Next update and asks
        points: 3
