  # ---------------------------------------------------------------- sql
  - id: D11-026
    version: 1
    type: sql
    subtopic: obs.cost
    tags: [data.sql]
    competencies: [x.sql]
    difficulty: 2
    level: apply
    time_s: 480
    stem: |
      Tables `llm_calls(call_id, tenant_id, model, input_tokens, output_tokens)` and
      `prices(model, in_per_mtok, out_per_mtok)` (USD per million tokens). For each tenant return `tenant_id`,
      `cost_usd` (total cost over all its calls, rounded to 4 decimals) and `share_pct` (its percentage of the
      total cost across all tenants, rounded to 1 decimal). Order by `cost_usd` descending, then `tenant_id`.
    sql:
      setup: |
        CREATE TABLE llm_calls(call_id INT, tenant_id TEXT, model TEXT, input_tokens INT, output_tokens INT);
        CREATE TABLE prices(model TEXT, in_per_mtok REAL, out_per_mtok REAL);
        INSERT INTO prices VALUES ('small',0.5,2.0),('large',3.0,15.0);
        INSERT INTO llm_calls VALUES
        (1,'acme','large',12000,800),(2,'acme','small',5000,300),(3,'acme','large',9000,500),
        (4,'globex','small',20000,1500),(5,'globex','small',18000,1200),
        (6,'initech','large',30000,2500),(7,'initech','large',25000,2000),(8,'initech','small',4000,100),
        (9,'umbrella','small',1000,100);
      reference: |
        WITH t AS (
          SELECT c.tenant_id,
                 SUM(c.input_tokens * p.in_per_mtok + c.output_tokens * p.out_per_mtok) / 1000000.0 AS cost
          FROM llm_calls c JOIN prices p ON p.model = c.model
          GROUP BY c.tenant_id
        )
        SELECT tenant_id,
               ROUND(cost, 4) AS cost_usd,
               ROUND(100.0 * cost / SUM(cost) OVER (), 1) AS share_pct
        FROM t
        ORDER BY cost DESC, tenant_id
      order_matters: true
      float_round: 4
    explanation: |
      Join to prices on model, aggregate cost per tenant in a CTE, then use a window `SUM(cost) OVER ()` for the
      grand total so the share can be computed in the same pass. Dividing by 1,000,000.0 avoids integer division.

  - id: D11-027
    version: 1
    type: sql
    subtopic: obs.slo
    tags: [data.sql, obs.tracing]
    competencies: [x.sql]
    difficulty: 3
    level: analyze
    time_s: 600
    stem: |
      Table `llm_calls(call_id, model, latency_ms, status)`. For each `model`, compute the nearest-rank p95
      latency using only calls with `status = 'ok'`. Per model, sort those latencies ascending (rank 1 is the
      smallest), let n be the number of those calls, and take the value at rank `(95 * n + 99) / 100` (integer
      division, no interpolation). Return `model`, `n` and `p95_ms`, ordered by `model`.
    sql:
      setup: |
        CREATE TABLE llm_calls(call_id INT, model TEXT, latency_ms INT, status TEXT);
        INSERT INTO llm_calls VALUES
        (1,'small',210,'ok'),(2,'small',250,'ok'),(3,'small',230,'ok'),(4,'small',900,'ok'),(5,'small',240,'ok'),
        (6,'small',260,'ok'),(7,'small',220,'ok'),(8,'small',270,'ok'),(9,'small',215,'ok'),(10,'small',225,'ok'),
        (11,'small',235,'ok'),(12,'small',245,'ok'),(13,'small',255,'ok'),(14,'small',265,'ok'),(15,'small',275,'ok'),
        (16,'small',285,'ok'),(17,'small',295,'ok'),(18,'small',305,'ok'),(19,'small',315,'ok'),(20,'small',325,'ok'),
        (21,'small',5000,'error'),
        (22,'large',1200,'ok'),(23,'large',1500,'ok'),(24,'large',1100,'ok'),(25,'large',4000,'ok'),
        (26,'large',1300,'ok'),(27,'large',1400,'ok'),(28,'large',1250,'ok'),(29,'large',1350,'ok'),
        (30,'large',9000,'timeout');
      reference: |
        WITH ranked AS (
          SELECT model, latency_ms,
                 ROW_NUMBER() OVER (PARTITION BY model ORDER BY latency_ms) AS rn,
                 COUNT(*) OVER (PARTITION BY model) AS n
          FROM llm_calls
          WHERE status = 'ok'
        )
        SELECT model, n, latency_ms AS p95_ms
        FROM ranked
        WHERE rn = (95 * n + 99) / 100
        ORDER BY model
      order_matters: true
      float_round: 2
    explanation: |
      Filter to successful calls before ranking, then number rows per model with `ROW_NUMBER()` and count rows per
      model with a window `COUNT(*)`. Nearest-rank p95 is the row whose rank equals `ceil(0.95 n)`; integer
      arithmetic `(95 * n + 99) / 100` computes the ceiling without a math function.

  - id: D11-028
    version: 1
    type: sql
    subtopic: obs.troubleshooting
    tags: [data.sql, agents.tools-mcp]
    competencies: [x.sql]
    difficulty: 2
    level: apply
    time_s: 480
    stem: |
      Table `tool_calls(run_id, tool_name, status, error_type)` records agent tool invocations; `status` is `'ok'` or
      `'error'`. Considering only tools with at least 5 calls, return the 3 tools with the highest failure rate:
      `tool_name`, `calls`, `failures` and `failure_rate` (failures divided by calls, rounded to 3 decimals).
      Order by `failure_rate` descending, then `tool_name`.
    sql:
      setup: |
        CREATE TABLE tool_calls(run_id TEXT, tool_name TEXT, status TEXT, error_type TEXT);
        INSERT INTO tool_calls VALUES
        ('r1','search_kb','ok',NULL),('r2','search_kb','ok',NULL),('r3','search_kb','error','timeout'),('r4','search_kb','ok',NULL),('r5','search_kb','ok',NULL),('r6','search_kb','ok',NULL),
        ('r1','create_ticket','error','http_500'),('r2','create_ticket','error','http_500'),('r3','create_ticket','ok',NULL),('r4','create_ticket','error','timeout'),('r5','create_ticket','ok',NULL),('r6','create_ticket','error','http_500'),
        ('r1','get_customer','ok',NULL),('r2','get_customer','error','auth'),('r3','get_customer','error','auth'),('r4','get_customer','ok',NULL),('r5','get_customer','ok',NULL),('r6','get_customer','ok',NULL),('r7','get_customer','ok',NULL),
        ('r1','send_email','error','http_500'),('r2','send_email','error','http_500'),('r3','send_email','error','http_500'),
        ('r1','calc_refund','ok',NULL),('r2','calc_refund','ok',NULL),('r3','calc_refund','ok',NULL),('r4','calc_refund','ok',NULL),('r5','calc_refund','error','validation');
      reference: |
        SELECT tool_name,
               COUNT(*) AS calls,
               SUM(CASE WHEN status = 'error' THEN 1 ELSE 0 END) AS failures,
               ROUND(1.0 * SUM(CASE WHEN status = 'error' THEN 1 ELSE 0 END) / COUNT(*), 3) AS failure_rate
        FROM tool_calls
        GROUP BY tool_name
        HAVING COUNT(*) >= 5
        ORDER BY failure_rate DESC, tool_name
        LIMIT 3
      order_matters: true
      float_round: 3
    explanation: |
      Group by tool, use conditional aggregation for failures and `HAVING` for the minimum-volume filter, which
      keeps a three-call tool such as `send_email` from topping the list on thin evidence. Multiply by 1.0 to avoid
      integer division.
