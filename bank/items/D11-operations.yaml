domain: D11
items:
  # ---------------------------------------------------------------- obs.tracing
  - id: D11-001
    version: 1
    type: single
    subtopic: obs.tracing
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A procurement agent at a manufacturer sometimes takes 40 seconds to answer. The only telemetry today is
      API-gateway request logs and CPU graphs, so nobody can say whether the time goes to the model, the ERP lookup
      or retries. What instrumentation answers the question most directly?
    options:
      - text: "One trace per run, with a span per model and tool call recording model, tokens and latency, so the slow step shows"
        correct: true
        why: The span tree shows which step consumed the 40 seconds and how many steps ran.
      - text: "Request-level latency histograms per endpoint, with an alert when p95 exceeds the target for five consecutive minutes"
        why: Shows that requests are slow, but not which step inside the run is responsible.
        misconception: Aggregate latency metrics are enough to locate a slow step
      - text: "Verbose INFO logs containing the full prompt and response of every model call, searchable by request ID"
        why: Unstructured logs lack timing relationships between steps and put sensitive content into the log store.
        misconception: More logging of content equals more observability
      - text: Auto-instrumented HTTP server and database spans only, since these cover the whole request path
        why: "Misses the agent's own structure: which model call, which tool and how many loop iterations."
        misconception: Generic APM spans capture what matters in LLM workflows
    explanation: |
      Agent behaviour is a tree of model and tool calls. A trace with one span per call, annotated with model, token
      counts and latency, shows where time and cost go. Metrics show that something is slow; traces show where.
    refs: [https://opentelemetry.io/docs/specs/semconv/gen-ai/]

  - id: D11-002
    version: 1
    type: single
    subtopic: obs.tracing
    tags: [obs.cost, int.enterprise-devex]
    difficulty: 2
    level: evaluate
    time_s: 90
    stem: |
      Three product teams at a client use three different LLM frameworks, and each records token usage under its own
      custom field. The platform lead wants cross-team cost and latency dashboards. The client already collects
      OpenTelemetry traces from its other services, and its security team will not approve another SaaS product that
      receives prompts. What is the best approach?
    options:
      - text: Emit OpenTelemetry's GenAI telemetry for operation, model and token usage from every team, pinned to one convention version
        correct: true
        why: A vendor-neutral standard that the existing OTel pipeline already ingests, so all teams land in one schema without custom mapping or a new data processor.
      - text: Move all three teams onto whichever framework has the best built-in tracing, so dashboards share one native schema
        why: Forces three rewrites and ties the platform to one framework to solve what a telemetry convention solves without code changes in the apps.
        misconception: Standardising on one framework is the way to standardise telemetry
      - text: Adopt a specialised LLM-observability SaaS and have each team install its SDK for prompts, traces and cost
        why: Creates a second telemetry pipeline beside the OTel one, and sends prompts to a vendor the security team will not approve.
        misconception: A purpose-built LLM tool is always the better telemetry choice
      - text: Publish a shared log-field schema on the internal wiki and ask each team to map its own keys onto it
        why: A convention that depends on each team's discipline drifts; nothing enforces it and no backend understands it natively.
        misconception: Documented naming conventions are as good as a shared standard
    explanation: |
      OpenTelemetry's GenAI semantic conventions define shared attribute names for operations, models and token
      usage, so telemetry from different frameworks lands in one schema in the backend the client already runs. The
      conventions are still marked as in development and have moved repositories, so pin the version you emit and
      plan upgrades; do not hard-code expectations about individual attribute names.
    refs: [https://opentelemetry.io/docs/specs/semconv/gen-ai/]

  - id: D11-003
    version: 1
    type: multi
    subtopic: obs.tracing
    tags: [gov.audit-compliance]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      A hospital group wants full traces of its clinical-documentation assistant for debugging, but prompts and
      outputs contain patient data. Which practices resolve the tension?
    options:
      - text: Leave message content off spans by default, and enable capture per environment with redaction before export
        correct: true
        why: Content is the sensitive and bulky part, so it should be opt-in, scoped and scrubbed.
      - text: Always record metadata such as model, token counts, tool names, latency and a content identifier
        correct: true
        why: Most diagnosis needs structure and timing, not text, and none of that is sensitive.
      - text: Keep full message bodies, when needed, in an access-controlled store and put only a reference on the span
        correct: true
        why: Authorised engineers can still replay a case, and the general telemetry backend stays free of patient data.
      - text: Log everything in production and rely on the observability vendor's retention settings for compliance
        why: Retention settings do not fix who can read the data or where it is stored.
        misconception: A retention window is the same as a privacy control
      - text: Hash every prompt and response so nothing readable is stored anywhere, including the debug store
        why: Hashes support matching but not inspection or replay, which removes the main debugging value.
        misconception: Hashing preserves debuggability
      - text: Turn tracing off in production and debug from staging with synthetic data only
        why: Production-only failures, such as real data shapes and permissions, become undiagnosable.
        misconception: Telemetry and privacy are mutually exclusive
    explanation: |
      Separate the structure of a run (always safe to keep) from its content (sensitive, opt-in). Redact before
      export, keep any retained content in a restricted store referenced from the trace, and avoid options that
      either leak data or make failures impossible to inspect.
    refs: [https://opentelemetry.io/docs/specs/semconv/gen-ai/]

  - id: D11-004
    version: 1
    type: single
    subtopic: obs.tracing
    tags: [int.async]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A webhook handler enqueues documents, and workers process them with several LLM calls. Traces break at the
      queue: the handler's trace ends at enqueue and each worker starts a separate trace, so no one can follow a
      request end to end. What fixes this?
    options:
      - text: Propagate W3C trace context in the message headers and start the worker's spans as children of it
        correct: true
        why: The context travels with the message, so handler and worker spans join one trace across the async hop.
      - text: Log the request ID on every line and join log lines by ID in the search tool during incidents
        why: Gives a manual join without span timing or hierarchy, so it does not show where latency accrues.
        misconception: A shared ID in logs is equivalent to a distributed trace
      - text: Start a fresh trace in the worker and match it to the webhook trace by timestamp proximity
        why: Timestamp matching is ambiguous under concurrency and breaks whenever the queue backs up.
        misconception: Time proximity can reconstruct causality
      - text: Run the worker in-process with the webhook handler so that one trace covers the whole request
        why: Removes the reason for the queue, such as retries, backpressure and isolation, to fix a telemetry problem.
        misconception: Simplify the architecture to simplify tracing
    explanation: |
      Asynchronous hops need explicit context propagation: inject the trace context into the message and extract it in
      the consumer, creating child or linked spans. Otherwise each side produces an isolated trace.

  - id: D11-005
    version: 1
    type: single
    subtopic: obs.tracing
    tags: [obs.troubleshooting, llm.failure-modes]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      A compliance agent produced a wrong filing summary for one customer last Tuesday. Rerunning the same request
      today gives a correct answer. The client wants the root cause, and the failure cannot be seen again on demand.
      What should the tracing design capture so such runs can be reproduced?
    options:
      - text: "Capture each step's model version, parameters, inputs and tool results, then replay with recorded tool outputs"
        correct: true
        why: Nondeterminism comes from the model and the world; recorded inputs and tool outputs let you hold the world fixed.
      - text: "Store only the final answer and the user's rating, then sample many more runs until the failure shows up again"
        why: Without step data you can see that it failed but not why, and rare failures may not recur on demand.
        misconception: Enough re-sampling reproduces any failure
      - text: "Re-run the user's original request today at temperature 0 in the staging environment and compare it with production's"
        why: Retrieved documents and tool results have changed since Tuesday, so the re-run is a different experiment.
        misconception: Temperature 0 makes a run reproducible
      - text: Fix a random seed on every model call so that a failing run can later be reproduced exactly
        why: Seeds are best-effort at most and do not freeze the retrieved context or tool outputs.
        misconception: A seed makes LLM runs deterministic
    explanation: |
      To reproduce a nondeterministic agent failure, record what it saw: exact model identifier and parameters, the
      assembled prompt, retrieved context and every tool result. Replay with tool calls stubbed from the recording
      to isolate whether the fault lies in the model or in the data.

  # ---------------------------------------------------------------- obs.troubleshooting
  - id: D11-006
    version: 1
    type: single
    subtopic: obs.troubleshooting
    tags: [gov.identity, rag.retrieval]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      A RAG assistant for a law firm answers "I could not find anything" to about 40% of questions in production but
      behaves in staging, which has the same document snapshot. Failures cluster among associates; partners are
      rarely affected. Staging queries run under a service account with full read access, while production
      passes each user's identity to the search filter. What do you check first?
    options:
      - text: Replay failing queries in staging under the same user identity and inspect what the permission filter removes
        correct: true
        why: The clustering by user role and the identity difference point at document-level trimming that staging never exercises.
      - text: "Compare the model alias and snapshot in the two environments, since a silent change could explain weaker answers"
        why: A weaker model would produce poor answers, not systematic "nothing found" responses concentrated on one user group.
        misconception: Any production-only symptom is a model-version issue
      - text: "Rebuild the production index from scratch and re-run ingestion for the whole document set"
        why: Same snapshot in both environments and partner queries succeed, so the index content is not the common cause.
        misconception: Missing results mean a broken index
      - text: Lower the production similarity threshold to staging's more permissive default
        why: Plausible config drift, but it would not split cleanly by user role; check the identity path first.
        misconception: Retrieval thresholds explain every empty result
    explanation: |
      Prod-versus-staging differences often live in data, permissions, configuration or model version. Use the
      shape of the symptom (who is affected, which queries) to pick the layer, then reproduce under the production
      identity before changing anything.

  - id: D11-007
    version: 1
    type: single
    subtopic: obs.troubleshooting
    tags: [llm.structured-tools, llm.failure-modes]
    difficulty: 3
    level: analyze
    time_s: 100
    stem: |
      Since Tuesday, 5% of an order-extraction service's responses fail JSON parsing. Nothing was deployed; prompts
      and code are unchanged, and traces record model name, finish reason, input length and tenant. What is the best
      first diagnostic step?
    options:
      - text: "Segment failing and passing traces by model version, finish reason, input length and tenant"
        correct: true
        why: Finds what separates failures from successes (for example truncation, a snapshot change or one tenant's inputs) before acting.
      - text: Add a JSON-repair step with two retries on parse failure, which will push the error rate near zero
        why: Masks the symptom and adds cost; the cause stays unknown and may worsen.
        misconception: Retry and repair is root-cause analysis
      - text: "Open a high-severity ticket with the provider and hold further changes until their root-cause analysis arrives"
        why: May be justified later, but without evidence of a provider-side change it delays your own diagnosis.
        misconception: Unexplained behaviour is the provider's responsibility
      - text: "Add a stricter instruction to return valid JSON to the system prompt and ship it as a hotfix"
        why: An untested prompt change on a system that did not change; it risks new regressions and does not explain the shift.
        misconception: Prompt wording fixes every formatting error
    explanation: |
      When behaviour changes without a deploy, look for what changed around the system: provider model snapshots,
      traffic mix, input length, truncation by token limits. Segment good versus bad runs on every recorded
      dimension; the discriminating variable tells you which layer to fix.

  - id: D11-008
    version: 1
    type: multi
    subtopic: obs.troubleshooting
    tags: [deploy.delivery]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      An agent passes every check in staging but misbehaves in production at a client site. Which differences
      between the environments are most worth checking?
    options:
      - text: Corpus content, volume and the access controls applied to documents
        correct: true
        why: Real data is larger, messier and permission-filtered, and staging snapshots rarely reproduce this.
      - text: Rate-limit tiers, timeouts and retry settings for the model provider and downstream APIs
        correct: true
        why: Load and quotas in production trigger throttling and timeouts that staging traffic never reaches.
      - text: Whether a floating model alias resolves to the same snapshot, with the same default parameters
        correct: true
        why: Aliases can move independently per environment or region, silently changing behaviour.
      - text: The cloud region and hardware generation serving the model, which usually explains differences in answer quality
        why: Hosted models are designed to behave the same across regions; differences in data, identity, limits and model version matter far more.
        misconception: Infrastructure differences are the usual cause of behaviour changes
      - text: The prompt templates, which cannot differ because they are stored in version control
        why: Environment configuration, feature flags and templating inputs can still change the final prompt.
        misconception: Version control guarantees identical effective prompts
      - text: Sampling randomness, which makes some failures expected and not worth investigating
        why: Randomness can hide a systematic fault; a pattern that appears only in production needs a cause.
        misconception: Nondeterminism excuses unexplained failures
    explanation: |
      Typical drivers of prod-versus-staging gaps are data (volume, quality, permissions), configuration (limits,
      timeouts, flags), identity and model version. Check these before blaming randomness or minor runtime versions.

  # ---------------------------------------------------------------- obs.cost
  - id: D11-009
    version: 1
    type: single
    subtopic: obs.cost
    tags: [role.economics]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A client's monthly LLM bill has tripled. All features and tenants share one provider API key, and finance
      wants per-tenant chargeback. What should you put in place?
    options:
      - text: "Tag each model call at the gateway with tenant, feature and run ID, and price it from recorded token usage"
        correct: true
        why: Gives attribution along every dimension finance needs, from data captured at call time.
      - text: Issue a separate provider API key per feature and read each key's spend from the provider console
        why: Splits by feature only, not tenant, and multiplies keys to rotate and secure.
        misconception: One API key per cost centre is sufficient attribution
      - text: Allocate the invoice to tenants in proportion to request counts from the load-balancer logs
        why: Ignores that requests differ hugely in tokens and model used, so heavy tenants are undercharged.
        misconception: Request count is a proxy for cost
      - text: "Move the highest-volume features to a cheaper model first and check whether the bill returns to normal levels"
        why: Optimising before knowing where the cost comes from may cut the wrong feature and hurt quality.
        misconception: Act on cost before measuring it
    explanation: |
      Cost attribution needs per-call records with token counts and identifiers for tenant, feature and run, priced
      against the model used. With that you can answer who and what drives spend before deciding what to optimise.

  - id: D11-010
    version: 1
    type: single
    subtopic: obs.cost
    tags: [llm.fundamentals]
    difficulty: 3
    level: analyze
    time_s: 100
    stem: |
      Two internal services share the same 6,000-token instruction prefix. Service A sends 40 requests in a
      two-minute burst, a few seconds apart, then is idle for an hour. Service B receives one request about every 10
      minutes, around the clock. The provider charges 25% more than the normal input price to write a prefix to the
      prompt cache and 90% less to read it, and entries expire after 5 minutes without a hit. After caching was
      enabled for both, one service's bill fell and the other's rose. Which service's bill rose, and why?
    options:
      - text: Service B, because each request finds the entry expired, so it pays the write premium every time and never gets a discounted read
        correct: true
        why: Reuse within the 5-minute lifetime is what pays for the premium; with 10-minute gaps nothing is ever read.
      - text: Service A, because the hour-long idle gap forces a new cache write at every burst and those premiums outweigh the savings
        why: One write per burst is followed by about 39 discounted reads, so the burst saves money overall.
        misconception: Idle time between bursts makes caching unprofitable
      - text: Service A, because the burst ends after two minutes, so the entry written at its start has expired before the later requests arrive
        why: The entry lives 5 minutes from its last hit and requests arrive seconds apart, so every request after the first reads from the cache.
        misconception: Cache entries expire on a fixed timer from the first write
      - text: Caching cannot raise either bill, since the 90% read discount always outweighs the 25% write premium; the rise must come from traffic growth
        why: The discount only applies to reads; a prefix that is written but never read costs 25% more than no caching.
        misconception: The read discount always offsets the write premium
    explanation: |
      Prompt caching is a bet on reuse. Writes cost a premium, reads are heavily discounted, and entries expire after
      a short period without hits. Traffic that arrives in bursts, or at least once per lifetime, profits; sparse,
      evenly spaced traffic with gaps longer than the lifetime pays the premium and never collects the discount.
      Measure cache read and write tokens per route before and after enabling it.
    refs: [https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching]

  - id: D11-011
    version: 1
    type: single
    subtopic: obs.cost
    tags: [llm.prompting, eval.gates]
    difficulty: 2
    level: evaluate
    time_s: 100
    stem: |
      A contract-summary feature costs more than forecast. Each request has about 7,000 input tokens, mostly a fixed
      clause library already served from the prompt cache, and about 1,100 output tokens. Output tokens are priced at
      five times the input rate. Reviewers say the summaries open by restating the request and end with generic
      caveats; the useful content is about 350 tokens. Which change best cuts cost without hurting the product?
    options:
      - text: Instruct for a fixed summary structure with no restatement or boilerplate, verify on the golden set, and keep a max-token limit as a backstop
        correct: true
        why: Output tokens dominate the bill (1,100 x 5 against 7,000 cached reads), and the waste is in what is generated, so shaping the output removes it without cutting content.
      - text: Set the maximum output tokens to about 400 so that every summary is cut off at the length of its useful content
        why: The padding is at the start and end, so a hard cut removes the end of the real content and can truncate mid-sentence; length must be controlled by instruction.
        misconception: A max-token cap is how you control output length
      - text: Shrink the clause library in the cached prefix to cut the number of input tokens sent with every request
        why: Cached input is the cheap part of the bill; shortening it saves little and may remove clauses the summaries need.
        misconception: Input tokens are the main cost driver
      - text: Send all requests to the next smaller model in the family and keep the prompt exactly as it is today
        why: Does not remove the wasted output tokens, and quality on legal text is unverified; the saving is bought with an unmeasured risk.
        misconception: A cheaper model is the first lever for any cost problem
    explanation: |
      Cost levers differ by token type. Cached input is cheap; output is priced higher and is often padded. Control
      output length by instructing for the structure you want, then verify quality on the golden set. A max-token
      limit is a safety net that truncates, not a way to make answers concise.

  - id: D11-012
    version: 1
    type: single
    subtopic: obs.cost
    tags: [agents.state, gov.guardrails]
    difficulty: 1
    level: apply
    time_s: 80
    stem: |
      Over a weekend, an agent stuck in a tool-retry loop spent about $4,000 for one tenant before anyone noticed.
      Which control would have stopped it?
    options:
      - text: Per-run caps on steps, tokens and cost in the harness, plus per-tenant spend limits that halt work
        correct: true
        why: Stops the loop at the source and bounds each tenant's exposure automatically, without a human present.
      - text: "Send finance a daily spend summary and add a dashboard, so anomalies are noticed the next working morning"
        why: Alerts report after the money is spent and depend on someone reading them over a weekend.
        misconception: Reporting is a control
      - text: Set a hard monthly spend cap on the provider account so that total spend can never exceed budget
        why: A single runaway tenant exhausts the cap and takes every other tenant down with it.
        misconception: An account-wide cap is sufficient protection
      - text: "Reduce the maximum output tokens on every model call to a low fixed ceiling"
        why: The cost came from the number of iterations, not the size of one call.
        misconception: Per-call limits bound per-run cost
    explanation: |
      Budget circuit breakers belong where work is scheduled: cap steps, tokens and spend per run, and per tenant
      or feature, with automatic halt and alert. Dashboards and provider-wide caps are complements, not substitutes.

  # ---------------------------------------------------------------- obs.slo
  - id: D11-013
    version: 1
    type: single
    subtopic: obs.slo
    tags: [eval.online]
    difficulty: 1
    level: analyze
    time_s: 80
    stem: |
      A knowledge assistant met its 99.9% availability objective all quarter. Yet after a faulty index rebuild it gave
      wrong answers for three days, users complained, and every dashboard stayed green. What is the right change
      to the objectives?
    options:
      - text: Add a quality SLO measured on sampled, graded responses next to availability and latency
        correct: true
        why: Wrong answers delivered quickly with HTTP 200 are invisible to uptime metrics; sampled grading makes them visible.
      - text: Tighten the availability target to 99.99% so that any degradation of the service shows up as a breach
        why: Availability counts successful responses, not correct ones; a higher target stays green during bad answers.
        misconception: Higher uptime targets catch quality regressions
      - text: Count empty, fallback and schema-invalid responses as failures in the availability SLI, so a degraded answer burns the error budget
        why: Stricter success checks catch visibly broken responses, but a well-formed, confident wrong answer still counts as a success.
        misconception: A stricter definition of success detects wrong answers
      - text: "Rely on the quarterly CSAT survey and the support-ticket backlog to catch quality problems"
        why: A quarterly signal detects a three-day incident months after the fact.
        misconception: Lagging satisfaction scores are an adequate quality monitor
    explanation: |
      AI systems need separate objectives for availability, latency and quality. Quality SLIs come from sampled and
      graded production traffic, which is what lets an error budget cover wrong-but-fast answers.

  - id: D11-014
    version: 1
    type: multi
    subtopic: obs.slo
    tags: [eval.online]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      You are defining service level indicators for a streaming customer-support assistant. Which are good SLIs?
    options:
      - text: p95 time to first token for streamed answers, measured at the client edge
        correct: true
        why: Tail latency to first visible output is what users feel in a streamed interface.
      - text: Share of sampled responses rated grounded by calibrated reviewers or a validated judge
        correct: true
        why: A user-facing quality measure that can carry a target and an error budget.
      - text: Fraction of tool calls that complete successfully within their timeout
        correct: true
        why: Tool failures cause visible task failures and are measurable from traces.
      - text: Mean end-to-end latency across all requests in a rolling hour
        why: Means hide the slow tail that frustrated users experience.
        misconception: Average latency represents user experience
      - text: GPU utilisation of the inference fleet serving the model
        why: A resource metric that explains causes, not a user outcome; it also does not exist for a hosted API.
        misconception: Resource saturation metrics are SLIs
      - text: Average output tokens per response for each day
        why: Describes response size and cost, not whether users got a timely or correct answer.
        misconception: Volume metrics indicate service quality
    explanation: |
      Good SLIs describe what users experience: tail latency, correctness and task completion. Resource and volume
      metrics are useful for diagnosis and capacity but are not objectives to promise.

  - id: D11-015
    version: 1
    type: single
    subtopic: obs.slo
    tags: [int.resilience, deploy.delivery]
    difficulty: 2
    level: evaluate
    time_s: 90
    stem: |
      A service has a 99.5% monthly success-rate SLO. A model-provider outage in week one consumed 70% of the
      month's error budget. A prompt rework and a model upgrade are scheduled for next week. What does an
      error-budget policy say to do?
    options:
      - text: Slow risky launches such as prompt or model changes, and invest in fallback and retry behaviour
        correct: true
        why: With little budget left, further risk is deferred and effort goes into resilience to similar outages.
      - text: Claim the provider's SLA credit and carry on with the launch plan, as the outage was outside the team's control
        why: Credits compensate money, not users; the budget is spent regardless of whose fault it was.
        misconception: Blame-shifting to a vendor resets the budget
      - text: Exclude the outage from the SLI this month, since users cannot hold the team responsible for a provider
        why: Users experienced the failures; excluding them hides a dependency risk the team can mitigate.
        misconception: Dependency failures should not count against your SLO
      - text: "Relax the target to 99% for the rest of the month and recalculate the remaining budget"
        why: Moving the goalposts after a miss removes the signal the budget exists to provide.
        misconception: SLOs can be adjusted to fit results
    explanation: |
      An error budget links reliability to release decisions: when it is mostly spent, favour work that reduces risk
      over feature launches. Provider outages count if users see them, and mitigation (fallback providers, retries,
      graceful degradation) is the team's job.

  - id: D11-016
    version: 1
    type: single
    subtopic: obs.slo
    tags: [gov.guardrails, gov.audit-compliance]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      At 2 a.m. the on-call engineer sees a customer report that the assistant quoted excerpts from another
      tenant's documents. Traces show a retrieval filter was bypassed after yesterday's release. What is the right
      first move?
    options:
      - text: "Disable the retrieval path or roll back yesterday's release, whichever is faster, and keep all logs and traces"
        correct: true
        why: Contain the exposure now; evidence is preserved so impact and cause can be established afterwards.
      - text: Reproduce the bug in staging first so that the fix is verified before touching production
        why: Leaves a live data exposure running while a fix is developed.
        misconception: Verify before acting, even when harm is ongoing
      - text: Roll the model back to the previous version, as model changes are the most frequent trigger of regressions
        why: The trace points at a retrieval filter, not the model; a rollback would not stop the leak.
        misconception: Model change is the default suspect
      - text: Notify every affected customer first so that they hear about it from you before they notice themselves
        why: Notification matters, but sending it before containment and scope known risks inaccurate statements.
        misconception: Communication comes before containment
    explanation: |
      Incident response order: stabilise and contain (disable the faulty path), preserve evidence, assess impact,
      communicate with accurate facts, fix the root cause, and hold a blameless review that produces tests and
      runbook updates.

  # ---------------------------------------------------------------- numeric
  - id: D11-017
    version: 2
    type: numeric
    subtopic: obs.cost
    tags: [llm.fundamentals]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 150
    stem: |
      A multi-tenant assistant attaches the same 8,000-token knowledge block to every call. When a call finds the
      block in the cache, the block is billed at 10% of the normal input rate. When it does not, the call pays 125%
      of the normal input rate to store it again. Small tenants send sparse traffic, so their cached block often
      expires before the next call. Looking only at the cost of this block, what is the lowest cache hit rate, in
      percent, at which caching costs no more than not caching at all? Answer to one decimal place.
    answer: {value: 21.7, tolerance: 0.5, tolerance_type: abs, unit: "%"}
    work: |
      Take the normal input rate as 1 per token. Without caching the block costs 8,000 × 1.00 = 8,000 units; a hit costs
      8,000 × 0.10 = 800; a miss costs 8,000 × 1.25 = 10,000.\
      With hit rate h: 800·h + 10,000·(1 − h) = 8,000, so 2,000 = 9,200·h and h = 0.2174, i.e. 21.7%.\
      (Same result from the ratios: (1.25 − 1) / (1.25 − 0.10) = 0.25 / 1.15.)
    explanation: |
      Every miss pays a write premium, so caching loses money below a break-even hit rate; at fleet level this is
      decided per tenant or feature from measured hit rates, not assumed from the read discount. Common wrong
      methods: ignoring the read price (0.25 / 1.25 gives 20.0%), dividing the premium by 0.9 (27.8%), or treating
      the 25% write premium as the break-even rate itself. Tenants whose measured hit rate sits below the break-even
      are better served by turning caching off.

  - id: D11-018
    version: 2
    type: numeric
    subtopic: obs.cost
    tags: [int.resilience]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 150
    stem: |
      A multi-tenant platform gives each tenant a daily model budget of $230, and a spend circuit breaker blocks the
      tenant's calls once the day's spend reaches it. A typical request has 4,000 input tokens and 600 output tokens,
      at $2.50 per million input tokens and $10.00 per million output tokens. 15% of requests fail and are retried
      once; every attempt, including the failed one, is billed in full. How many requests can a tenant make in a day
      before the breaker trips?
    answer: {value: 12500, tolerance: 0.01, tolerance_type: rel, unit: "requests"}
    work: |
      Cost per attempt: input 4,000 × $2.50/M = $0.0100; output 600 × $10/M = $0.0060; total $0.0160.\
      Attempts per request: 1 + 0.15 = 1.15, so expected cost per request = 1.15 × $0.0160 = $0.0184.\
      Requests before the budget is spent: $230 / $0.0184 = 12,500.
    explanation: |
      A budget breaker has to count what the provider bills, which includes retries. Common wrong methods: ignoring
      retries ($230 / $0.016 = 14,375), leaving out output tokens (20,000), or treating the 15% of failed requests
      as free (about 12,219). Setting the breaker from real per-attempt cost, and alerting before it trips, keeps
      one tenant's retry storm from spending the fleet's budget.

  - id: D11-019
    version: 1
    type: numeric
    subtopic: obs.tracing
    tags: [agents.patterns]
    competencies: [x.estimation]
    difficulty: 2
    level: analyze
    time_s: 150
    stem: |
      A trace shows an agent run with 5 sequential model calls of 1.8 s each. Between them it runs four tool calls:
      tool A (0.6 s) then tool B (0.6 s) in sequence, followed by tools C (0.9 s) and D (0.7 s) running
      concurrently. Ignoring all other overhead, what is the end-to-end latency of the run, in seconds?
    answer: {value: 11.1, tolerance: 0.05, tolerance_type: abs, unit: "s"}
    work: |
      Model calls: 5 x 1.8 = 9.0 s. Tools A and B in sequence: 0.6 + 0.6 = 1.2 s. Tools C and D in parallel: max(0.9, 0.7) = 0.9 s.
      Total 9.0 + 1.2 + 0.9 = 11.1 s.
    explanation: |
      Critical-path latency adds sequential steps and takes the maximum of parallel ones. Summing every tool call
      gives 11.8 s and overstates the run; this is the arithmetic a trace waterfall shows visually.

  - id: D11-020
    version: 1
    type: numeric
    subtopic: obs.slo
    competencies: [x.estimation]
    difficulty: 3
    level: analyze
    time_s: 150
    stem: |
      A service has a 99.5% success-rate SLO over a 30-day window and expects 2,400,000 requests in the window. On
      day 12, 9,100 requests have failed. Burn rate is the fraction of error budget consumed divided by the fraction
      of the window elapsed. What is the burn rate, rounded to one decimal?
    answer: {value: 1.9, tolerance: 0.05, tolerance_type: abs}
    work: |
      Budget = 0.5% x 2,400,000 = 12,000 failed requests. Consumed fraction = 9,100 / 12,000 = 0.758. Elapsed
      fraction = 12 / 30 = 0.40. Burn rate = 0.758 / 0.40 = 1.9.
    explanation: |
      A burn rate above 1 means the budget runs out before the window ends (here around day 16 of 30). Quoting the 76%
      consumed alone ignores how far into the window you are; the same 76% on day 25 would be burn rate 0.9.

  - id: D11-021
    version: 1
    type: numeric
    subtopic: obs.slo
    tags: [int.resilience]
    competencies: [x.estimation]
    difficulty: 2
    level: analyze
    time_s: 150
    stem: |
      A request needs three layers in series: an API gateway (99.95% available), the model layer, and a vector
      database (99.95%). The model layer uses a primary provider at 99.9% with an independent fallback provider at
      99.5%. Assume that all components fail independently and that failover is instant and perfect, so the model layer
      fails only if both providers are down. What is the composite availability, in percent, rounded to two decimals?
    answer: {value: 99.9, tolerance: 0.01, tolerance_type: abs, unit: "%"}
    work: |
      Model layer = 1 - (0.001 x 0.005) = 0.999995. Composite = 0.9995 x 0.999995 x 0.9995 = 0.998995, i.e. 99.90%.
    explanation: |
      Serial dependencies multiply; redundant ones multiply failure probabilities. Without the fallback the product
      is 0.9995 x 0.999 x 0.9995 = 99.80%. Taking the average of the three availabilities (about 99.8%) or the
      minimum are common wrong shortcuts. Real failover is imperfect and failures are rarely fully independent, which is why this figure is an upper bound.

  - id: D11-022
    version: 2
    type: numeric
    subtopic: obs.cost
    tags: [int.async, llm.model-selection]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 120
    stem: |
      A platform processes 3,000,000 documents a month, each with 1,500 input tokens and 200 output tokens. Prices
      are $1.00 per million input tokens and $5.00 per million output tokens. 60% of the documents are not
      time-sensitive and run through asynchronous batch processing, which costs 50% less for both input and output;
      the other 40% run interactively at standard prices. What is the monthly model cost, in USD?
    answer: {value: 5250, tolerance: 25, tolerance_type: abs, unit: "USD"}
    work: |
      Standard cost per document: input 1,500 × $1/M = $0.0015; output 200 × $5/M = $0.0010; total $0.0025.\
      Batch documents: 1,800,000 × $0.0025 × 0.5 = $2,250. Interactive documents: 1,200,000 × $0.0025 = $3,000.\
      Total $5,250 (against $7,500 if everything ran interactively).
    explanation: |
      Apply the discount only to the share that can wait, and to both input and output. Common wrong methods:
      discounting every document ($3,750), swapping the shares so that 40% is batched ($6,000), or leaving out
      output tokens ($3,150). Batch suits work that can wait for completion within a window; splitting traffic by
      urgency is a fleet-level cost lever.

