domain: D1
items:
  # ---------------------------------------------------------------- role.definition
  - id: D1-001
    version: 2
    type: single
    subtopic: role.definition
    tags: [adoption.change]
    difficulty: 2
    level: evaluate
    time_s: 90
    stem: |
      A vendor's forward deployed engineer ships a claims-triage assistant on schedule, and every line item in the
      statement of work is accepted. Six weeks later only 8% of adjusters use it and the old spreadsheet is still
      the system of record. The sponsor asks whether the engagement has succeeded. Which answer best reflects what
      an FDE is accountable for?
    options:
      - text: "Not yet: the FDE owes better claims handling in the adjusters' real workflow, so the next work is finding out why they are not using it"
        correct: true
        why: Acceptance shows the work was delivered, not that claims handling improved. 8% usage is a strong warning that the result is not there yet, so the FDE checks the agreed measure and finds out what keeps adjusters away.
      - text: "Yes as contracted: every accepted deliverable meets the statement of work, and adoption is a change programme for the client's operations leaders, with the FDE supporting on request"
        why: Treats the contract as the finish line. The sponsor's question is about the outcome, and the FDE role exists to own the gap between delivered and used.
        misconception: Delivering to the specification is the same as succeeding
      - text: "Not yet: the FDE is measured on triage accuracy, so the priority is another round of evaluation and tuning to lift it before looking at adoption"
        why: Accuracy is an input. Adjusters may avoid the tool for workflow, trust or integration reasons that a better model does not fix.
        misconception: A model quality metric is the business outcome
      - text: "Partly: the FDE is accountable for a production-grade system that runs reliably, while business results like handling time depend on factors outside engineering's control"
        why: Production quality is necessary, but the role also works on what engineering can influence beyond the system, such as workflow fit, and reports the business result even where it shares control with the customer.
        misconception: Engineering ownership stops at a healthy production system
    explanation: |
      The distinguishing feature of the FDE role, in Palantir's model and elsewhere, is accountability for the outcome in
      the customer's real environment rather than for a feature list. Meeting acceptance criteria is a milestone, not
      evidence that the claims process changed. Low usage does not prove the opposite on its own either: who the users
      are and how many claims flow through the assistant matter. It is a warning that calls for measuring against the
      agreed goal and investigating, which is why post-launch usage review belongs to the FDE's job.

  - id: D1-002
    version: 1
    type: single
    subtopic: role.definition
    tags: [comms.stakeholders]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      On a logistics engagement the vendor has embedded one Delta-style forward deployed engineer and one Echo-style
      deployment strategist. The engineer now spends most days in operations meetings negotiating what to automate,
      and integration work is slipping. Which reallocation fits the two roles best?
    options:
      - text: The strategist leads problem definition and success measures with operations; the engineer builds and joins only the calls where feasibility shapes priorities
        correct: true
        why: Echo is the problem-owning, operations-facing role and Delta is the builder. This frees build time while keeping the engineer in the trade-off decisions that depend on feasibility.
      - text: The strategist writes requirements from the operations meetings, and the engineer works only from that document with no direct operations contact
        why: Protects build time but turns the engineer into a ticket taker. Feasibility and design trade-offs get decided without the person who knows what is cheap or hard.
        misconception: Separating definition from building completely makes both more efficient
      - text: The engineer keeps owning problem definition, since the builder is best placed to judge feasibility, and the vendor adds a second engineer for integration
        why: Adds capacity but leaves the cause untouched. The engineer remains the bottleneck for every operations conversation, and the strategist role goes unused.
        misconception: Slipping delivery is a capacity problem, not a role-allocation problem
      - text: Problem definition moves to the vendor's platform product managers, so priorities stay consistent across customers
        why: Platform teams optimise one capability for many customers and sit far from this customer's operations, which is the opposite of what the definition work needs.
        misconception: Dev and Delta engineers differ only in seniority, not in orientation
    explanation: |
      Palantir distinguishes Devs (one capability, many customers) from Deltas (forward deployed engineers: one customer,
      many capabilities), and pairs Deltas with Echo-style strategists who own the operational problem. Splitting
      problem ownership from building protects both, provided the builder stays in the decisions that depend on feasibility.
      Pooling definition at HQ would break proximity to the customer.
    refs: [https://blog.palantir.com/dev-versus-delta-demystifying-engineering-roles-at-palantir-ad44c2a6e87]

  - id: D1-003
    version: 2
    type: single
    subtopic: role.definition
    difficulty: 1
    level: apply
    time_s: 60
    stem: |
      The founder of a model-API startup asks why the company should employ engineers who work inside customer
      accounts: "Our API is documented and the model is strong, so customers can integrate it themselves." Which
      response best explains the logic behind forward deployed engineering?
    options:
      - text: Value is gated by the last mile of messy data, legacy integrations, permissions and workflow change inside each account
        correct: true
        why: The founder grants that the model is strong. What stands between it and value is the deployment work inside each account, and that gap is the FDE's territory.
      - text: Enterprise buyers want a named engineer accountable to them, so the embedded role mostly exists to satisfy procurement and vendor-risk requirements
        why: Accountability matters to buyers, but it is a consequence of the work, not the reason for it. The reason is that the integration and workflow work is hard and nobody else is placed to do it.
        misconception: The role exists to reassure buyers
      - text: Raw model capability is not yet reliable on specialised enterprise tasks unless it is fine-tuned on each customer's data, which takes engineers inside the account
        why: Fine-tuning is occasionally useful, but the founder's point is that the model is strong; the remaining gaps are data access, integration and process, which fine-tuning does not close.
        misconception: The deployment gap is mainly a model-quality gap
      - text: Embedded engineers are the vendor's best source of product feedback, so customer deployments are mainly a way to fund research into what to build
        why: Field-to-product feedback is a real benefit, but the role exists because customers need working outcomes. Treating deployments as paid research gets the priority backwards.
        misconception: The point of FDE work is learning for the vendor, not results for the customer
    explanation: |
      AI labs and vendors revived the forward deployed model because a capable model does not by itself produce
      enterprise value. Data access, integration, security review and process change stand in between, and someone has
      to close that gap inside the customer's environment.

  - id: D1-004
    version: 1
    type: multi
    subtopic: role.definition
    tags: [delivery.go-live]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      Which practices are consistent with being accountable for the outcome in the customer's environment, rather
      than for a list of features?
    options:
      - text: Agree a baseline and a target for the business metric with the sponsor before building starts
        correct: true
        why: Without an agreed baseline there is no way to show the outcome moved.
      - text: Watch end users in their real workflow after launch and change the system based on what blocks them
        correct: true
        why: Outcome ownership continues past go-live and is informed by observed behaviour, not only by tickets.
      - text: Keep reviewing usage and errors after launch until the target is met or deliberately revised with the sponsor
        correct: true
        why: Closes the loop between what shipped and what changed in the business.
      - text: Treat acceptance of the agreed specification as the point where responsibility passes to the customer's operations team, with later requests handled as new work
        why: Keeps scope tidy but measures completion by compliance with a document, which can be met while the outcome is missed.
        misconception: Scope discipline equals accountability
      - text: Report only on metrics the FDE's team fully controls, such as latency, uptime and accuracy, so that accountability stays fair
        why: Fair-sounding but it excludes the thing the sponsor bought. Outcome owners report the business metric and explain what moves it, including what they do not control.
        misconception: You can only be held accountable for what you fully control
      - text: Log data-quality problems as customer dependencies and leave their resolution to the customer's IT team, to keep engineering on its own deliverables
        why: Recording the dependency is right, but outcome owners help unblock it with evidence and options rather than waiting on it.
        misconception: Anything outside our codebase is outside our responsibility
    explanation: |
      Outcome accountability shows up as agreed baselines, observation of real usage, and ownership that continues after
      launch. Spec compliance, reporting only controllable metrics and handing blockers back are each reasonable locally
      but let the outcome slip between teams.

  - id: D1-005
    version: 2
    type: single
    subtopic: role.definition
    tags: [adoption.change, comms.stakeholders]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      An insurer's refund-approval assistant works: model quality, data and integration are all sound. Cycle time
      barely improves, because an internal policy requires three sequential manual sign-offs and passes each completed
      sign-off to the next approver in a once-daily compliance batch. The FDE's timestamps show each approver acts
      within an hour of receiving a case; most of the elapsed time is cases waiting for the next batch. What should the
      FDE do?
    options:
      - text: Take the wait-time breakdown to the sponsor and the policy's owner, with a redesigned hand-off for them to decide on
        correct: true
        why: The delay sits in a control the FDE cannot change alone. Evidence plus a concrete option, put to the people who own the decision, is how an outcome owner moves it.
      - text: Have the assistant submit all three sign-off requests in parallel, which removes the hand-off waits without touching the written policy
        why: The policy requires the sign-offs in sequence. Re-ordering them in software changes the control without its owner's consent, and creates an audit problem.
        misconception: A technical workaround can substitute for a process decision
      - text: Ask the three approvers to commit to a same-hour response on every case, within the existing policy
        why: Reasonable in general, but the timestamps show approvers already act within an hour of receiving a case. The wait is in the daily batch between steps, which the approvers do not control.
        misconception: Slow approvers are the cause of slow approvals
      - text: Record cycle time as blocked by an external policy in the final report, because approval rules are a business matter outside what engineering can change
        why: Correct that the FDE cannot change the policy, wrong to stop. The stated goal, cycle time, has not moved and the sponsor has not been shown why.
        misconception: Process problems are out of scope for an engineer
    explanation: |
      Outcome accountability includes influence over non-code blockers. Separate the time spent working on a case from
      the time it spends waiting: here the reviews are quick and the delay is a hand-off the policy imposes, so neither
      faster approvers nor a software workaround fixes it legitimately. The FDE does not rewrite policy, but is expected
      to surface the cause with evidence and a concrete proposal for the people who own the decision.

  # ---------------------------------------------------------------- role.adjacent
  - id: D1-006
    version: 3
    type: single
    subtopic: role.adjacent
    tags: [delivery.scoping]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A presales demo of a demand-forecasting service has won over a retailer, and they want it in production. The
      service must:

      - run every night on real store data;
      - be supported for six months;
      - produce a business impact that the sponsor will measure.

      Which role should lead delivery, and why?
    options:
      - text: A forward deployed engineer, because the work is production code in the retailer's environment, owned to a result the sponsor will measure
        correct: true
        why: Production code, customer environment and outcome ownership are the discriminators, and all three are present.
      - text: The solutions engineer, who built the demo and can extend it into the pilot while staying the technical contact for the six months
        why: Solutions engineers typically support the sale with demos and proofs of concept, then hand off; they are not usually accountable for a supported production run.
        misconception: The person who built the demo should own delivery
      - text: A solutions architect, who designs how the forecasting service fits the retailer's systems and oversees delivery by the retailer's developers
        why: As described, the architect designs and oversees while the retailer's developers write the code, so the role neither builds and runs the service nor answers for the measured result.
        misconception: Fitting into the landscape is a design task, not a delivery task
      - text: A professional-services team, scoped and billed against defined pilot deliverables with a support period at the end
        why: Deliverables-based engagements can meet scope without the sponsor's measured result being achieved.
        misconception: Services and FDE roles differ only by title
    explanation: |
      Useful discriminators among customer-facing technical roles are who writes the production code, where it lives, who
      owns the result, and how the work is priced. Compare the responsibilities each option describes, not the titles:
      here the solutions engineer would stretch a presales demo while acting as a contact, the architect advises while
      others build, and the services team answers for deliverables. Only the FDE option combines production code in the
      retailer's environment with the measured result. An architect or services team contracted to build, run and
      answer for that result would compete on the same terms.

  - id: D1-007
    version: 1
    type: single
    subtopic: role.adjacent
    tags: [rag.ingestion, adoption.change]
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      A customer success manager sees low usage of a document-QA assistant at three accounts. Users say answers on
      scanned contracts "can't be trusted", and the cause is poor text extraction in the deployment's ingestion step.
      How should the work divide between the customer success manager and the FDE?
    options:
      - text: The manager brings the usage evidence and keeps the three customers informed; the FDE fixes extraction in each deployment
        correct: true
        why: Each role does what it is built for. The FDE changes code and configuration in the deployment; the manager owns the account relationship.
      - text: The manager raises a defect with the platform team, because ingestion quality should be fixed once for every customer, and the FDE waits for the fix
        why: Fixing once for everyone is the right long-term aim, but a deployment-level ingestion problem can be fixed now by someone with access. Waiting on a roadmap delays value at all three accounts.
        misconception: All defects belong in the product backlog
      - text: The manager runs sessions on phrasing questions and checking sources to rebuild trust, and extraction is revisited if complaints continue
        why: Training can help with secondary habits, but the stated cause is extraction quality, and no amount of coaching fixes unreadable inputs.
        misconception: Low trust is mainly a user-education problem
      - text: The FDE joins the customer-health calls and leads them, so the customers hear the diagnosis from the engineer who will fix it
        why: Puts relationship management on the engineer and delays the fix, while the manager's commercial and relationship function goes unused.
        misconception: Combining roles removes handoff friction
    explanation: |
      Customer success owns relationship, renewal and adoption health, usually without changing code. The FDE changes the
      system in the customer's environment. The seam works best when evidence flows one way and fixes flow back.

  - id: D1-008
    version: 2
    type: multi
    subtopic: role.adjacent
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      A CIO asks how an FDE from the product vendor differs from a systems-integrator consultant on the same programme.
      Which distinctions are fair?
    options:
      - text: The FDE builds on the vendor's platform, and lessons from the work are fed back to improve the product
        correct: true
        why: Field-to-product feedback is a defining feature; integrator deliverables usually stay with the client.
      - text: In the usual engagement models, the FDE is judged on a business outcome in production and the consultant on scope delivered
        correct: true
        why: Vendors typically staff FDEs against an agreed outcome, while integrator contracts are typically for a defined scope or time. The success measure drives behaviour after go-live; an integrator contracted on outcomes would narrow this gap.
      - text: The FDE writes production code, while consultants mainly produce documents, designs and recommendations
        why: Integrator consultants and engineers write plenty of production code; the claim is out of date.
        misconception: Consultants do not build
      - text: The FDE's time is bundled into the licence fee, so it costs less than the integrator's day rate on the same programme
        why: Pricing structures vary on both sides. A bundled fee is not cheaper by nature, and it is not what distinguishes the roles.
        misconception: Embedded vendor staff are a free add-on to the product
      - text: The FDE works inside the client's environment under the client's change controls, while the consultant delivers from the integrator's own environment
        why: Integrator teams also work in client environments under client controls. Where the work happens does not separate the roles.
        misconception: Physical or environmental presence defines the role
    explanation: |
      Neither location nor "who codes" separates the roles. What does: where the code lives and whether learning
      returns to a product. The success measure usually differs too, outcome versus delivered scope, but that comes
      from the engagement model rather than the title, so compare the contracts actually on offer.

  - id: D1-009
    version: 1
    type: single
    subtopic: role.adjacent
    tags: [role.economics, comms.stakeholders]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      Three months into a good engagement, a customer's VP asks the vendor's FDE to take tickets from the VP's own
      engineering backlog for six months: internal dashboards, a data migration, some scripting. Most items do not use
      the vendor's product. The VP offers to pay the FDE's full day rate. The vendor has few FDEs, other accounts
      are waiting for one, and its engagement policy staffs FDEs only against outcomes that run on the product.
      How should the vendor respond?
    options:
      - text: Offer a scoped outcome covering the items that connect to the product, and decline the rest of the open-ended backlog
        correct: true
        why: Keeps the FDE on outcome work tied to the product while still helping where it makes sense.
      - text: Accept the whole backlog at the full day rate, since the revenue exceeds the FDE's cost and the work deepens a relationship that is going well
        why: Profitable on paper but turns the FDE into contract staff, with no productization, no outcome link and no capacity for the waiting accounts.
        misconception: Any billable work at full rate is good work
      - text: Accept a capped share, two days a week for six months at the full rate, and protect the remaining time for the outcome work
        why: Limits the damage, but the capped days still break the outcomes-on-the-product policy, and the scarce FDE is not available to other accounts.
        misconception: A cap makes staff augmentation acceptable
      - text: Accept the backlog only after the original outcome is delivered, and track both in one plan
        why: Sequencing helps, but the open-ended backlog still breaks the outcomes-on-the-product policy and the plan has no end.
        misconception: Capacity problems can be solved by sequencing alone
    explanation: |
      Staff augmentation drifts away from what makes an FDE valuable: a defined outcome, work built on the product, and
      learning that feeds back. A good response protects those while staying helpful: reframe into scoped outcomes.

  # ---------------------------------------------------------------- role.productization
  - id: D1-010
    version: 1
    type: single
    subtopic: role.productization
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      Three customers each need a different field mapping for incoming PDFs. The FDE's shared codebase already contains
      `if customer_id == "acme"` rules for the first two. The third customer has just asked. What is the best change?
    options:
      - text: Move the mapping rules into per-customer configuration that the core code reads, and migrate the first two customers
        correct: true
        why: Three similar cases make the pattern clear. Configuration keeps one code path and lets the next customer be onboarded without a code change.
      - text: Give each customer its own module in the same repository, loaded by customer id, so rules are separated and reviewable
        why: Tidier than inline conditionals, but every new customer is still a code change, review and deploy. The variation belongs in data, not in code.
        misconception: Organising customer-specific code is the same as removing it
      - text: Add a third branch on the customer identifier and generalise later, once the pattern has settled
        why: The pattern has already repeated; adding another special case increases the cost of the later refactor.
        misconception: Wait for more evidence before generalising
      - text: Have an LLM infer each customer's field mapping from sample documents at ingestion time, so no per-customer rules are needed
        why: Over-built for three known mappings, and it replaces explicit, testable rules with a non-deterministic step in a data path that must be auditable.
        misconception: Generalise to the maximum once you generalise
    explanation: |
      Prefer configuration over customisation, and do not fork per customer. After a pattern has repeated about three
      times it is worth generalising, but only as far as the evidence supports.

  - id: D1-011
    version: 2
    type: single
    subtopic: role.productization
    difficulty: 2
    level: analyze
    time_s: 90
    stem: |
      Two customers asked for an audit-trail export that the FDE built twice as one-offs. A third customer now asks
      for it. The export touches how every customer's event data is stored, so product owns the design: core features
      are agreed with product before implementation starts, and the platform team reviews core changes. The platform
      team is busy, and the FDE could write a generalised version for core this week. What is the best course of action?
    options:
      - text: Deliver the third customer with the existing build, and give product the evidence for making it a core feature
        correct: true
        why: Serves the customer now, and leaves the roadmap call with the owner of the roadmap, backed by three data points.
      - text: Write a generalised version for core this week and submit it for review, since the FDE who built it twice knows the requirement best
        why: A pull request is a reviewable proposal, not a merge, but it starts a storage-level design before product has agreed whether and how the feature should exist, and hands the busy platform team an unplanned review.
        misconception: Knowing the requirement best entitles the field to start the core design
      - text: Tell the third customer to wait until the platform team has built it as a core feature
        why: Customer value is delayed for something the FDE can deliver now with existing work.
        misconception: Platform purity beats customer outcomes
      - text: Deliver the third as another one-off and raise it with product only after a fourth or fifth request, since three is still a small sample
        why: Three independent requests are already enough to start a conversation, which costs little; waiting multiplies one-off maintenance.
        misconception: Generalisation needs a much larger sample
    explanation: |
      A common rule of thumb treats the third occurrence as the time to discuss generalising: a prompt for a
      conversation with the owner, not a mandate to build. The FDE's role is to bring the evidence; product decides
      priority and design. Meanwhile the customer still gets value from the existing implementation.

  - id: D1-012
    version: 2
    type: single
    subtopic: role.productization
    tags: [role.economics]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      An AI vendor's FDE team reports hours to reach production per new customer over four quarters: 610, 590, 600,
      605. Deployments were of comparable scope each quarter, and revenue has grown only as fast as FDE headcount.
      How should a leader read this?
    options:
      - text: Flat hours on comparable scope warn that no delivery leverage is visible, so find which work repeats and whether it can be reused
        correct: true
        why: On comparable scope, effort per deployment should fall as assets accumulate; a flat line with headcount-linear revenue looks like a services business. The figures do not show why, so inspect repeated work and reuse before adding headcount or accepting that model.
      - text: A flat effort level shows a predictable, mature delivery process, which is what a good operating model should produce
        why: Predictability is good, but on comparable scope a flat effort curve means no leverage is building up from one deployment to the next.
        misconception: Stability implies health
      - text: Add more FDEs and let them specialise by industry, since specialists should bring hours per deployment down without further product investment
        why: Specialisation may help, but it adds headcount to the same model before anyone has checked what work repeats. Without reuse, effort per deployment is likely to stay flat.
        misconception: More specialised people substitute for reusable assets
      - text: Raise per-deployment prices to protect margin, because the effort per customer cannot be reduced
        why: Pricing may help margin short-term but assumes the conclusion. It leaves the structural issue untouched.
        misconception: Margin is a pricing problem only
    explanation: |
      Per-customer customisation effort should fall over time as reusable assets and product features absorb repeated
      work. If it does not, headcount scales linearly with revenue, which is how professional services behave. Treat
      the flat line as a signal, not a diagnosis: check what work repeats, what is reused, and how the deployment mix and
      support load have changed, then decide whether to invest in productization or accept services economics.

  - id: D1-013
    version: 1
    type: multi
    subtopic: role.productization
    tags: [eval.datasets, rag.ingestion]
    difficulty: 2
    level: apply
    time_s: 100
    stem: |
      After four similar healthcare-scheduling deployments, a team wants to extract reusable field assets. Which are
      good candidates?
    options:
      - text: A connector for the common scheduling system with customer settings held in configuration
        correct: true
        why: The integration repeats across customers; configuration absorbs the differences.
      - text: An evaluation harness with an anonymised starter test set covering the failure types seen so far
        correct: true
        why: Gives the next deployment a head start on quality measurement without exposing customer data.
      - text: A written library of recurring failure modes, with symptoms and known fixes
        correct: true
        why: Cheap to create and directly shortens diagnosis on the next deployment.
      - text: The first customer's production prompts and cases, copied as the starting point for each new customer
        why: Couples customers to each other's data and wording, and may breach confidentiality.
        misconception: Copying a working deployment is reuse
      - text: The scripts used to reshape one customer's export during a one-time migration
        why: One-off by nature; few later deployments will need them.
        misconception: Anything that worked once is a reusable asset
      - text: Each customer's custom scheduling rules, gathered into one shared module so the team can find and reuse them
        why: A catalogue of customisations is not reuse. The rules differ by customer, so each deployment still needs its own code; the reusable part is the mechanism that lets them be configured.
        misconception: Collecting customisations in one place makes them reusable
    explanation: |
      Productizable field assets are those that recur and are separable from one customer: connectors with configuration,
      evaluation sets and harnesses, and failure-mode knowledge. One-off scripts, copied customer data and a catalogue of
      per-customer rules are reuse in appearance only.

  - id: D1-014
    version: 2
    type: single
    subtopic: role.productization
    tags: [comms.tradeoffs]
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      An FDE's feature requests keep stalling in the product backlog, labelled "anecdotal". The same gap has hit
      several deployments. Which approach is most likely to move one of them forward?
    options:
      - text: Show how many deployments hit the gap, what the workaround costs in engineer-days, and a proposed fix
        correct: true
        why: Frequency and cost turn an anecdote into a prioritisation input, and a proposed shape lowers the effort to say yes.
      - text: Build the fix as a working extension in one deployment and demo it to the product team
        why: A working demo shows feasibility, but the objection is that the need is anecdotal. One demo does not show how often or how expensively the gap occurs.
        misconception: A working prototype settles the argument
      - text: Collect quotes from the users at the affected customers describing how the gap hurts them
        why: Vivid, but individual stories are exactly what the label "anecdotal" dismisses. Product needs frequency and cost to rank it against other work.
        misconception: Qualitative stories persuade better than counts
      - text: Ask the customer's executive sponsor to lobby the vendor's product leadership directly about the missing capability
        why: May get attention once, but it goes around prioritisation without answering the objection. Pressure from one sponsor still says nothing about how often the gap occurs or what it costs.
        misconception: Escalation through the customer is the fastest route
    explanation: |
      Field-to-product feedback works when it is evidence-based and prioritisation-ready: how often, how costly, and
      what a good fix looks like. The product team decides; the FDE makes the decision easy.

  - id: D1-015
    version: 2
    type: single
    subtopic: role.productization
    tags: [comms.stakeholders, delivery.scoping]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A strategic customer, worth several times the average contract, needs a behaviour that the platform's
      configuration cannot express. A proper core change would take about three months, but their renewal decision
      is in five weeks. Core releases go to every customer and each core change needs a full review cycle. The
      platform has a supported extension point. What should the FDE do?
    options:
      - text: Build it on the supported extension point, isolated from core, with an owner and a review date agreed with product
        correct: true
        why: Meets the deadline without touching the core. The owner and review keep the extension maintained and make a deliberate call on whether it stays, moves into core or is retired.
      - text: Fork the platform for this customer so that nothing blocks the renewal, and merge the changes back to the core when time allows
        why: Fast, but forks rarely merge back, and this one would carry core fixes forever.
        misconception: A fork is an acceptable temporary measure
      - text: Decline customer-specific code and offer the roadmap date for the core change, because exceptions for large customers erode the platform
        why: Principled but ignores a supported extension point and a material commercial risk.
        misconception: Product purity overrides commercial context
      - text: Patch core behind a feature flag enabled for this customer only, and widen it to others once it has proven stable
        why: The customer-specific path ships to every customer, cannot clear the review cycle in five weeks, and flags added under deadline tend to outlive it.
        misconception: A flag makes a core hack safe
    explanation: |
      Customisation is a spectrum: configuration, then supported extension, then core change. A maintained extension
      on a supported interface can be the right long-term home for a customer-specific need; it is not a fork. When
      time forces the choice, record the decision, limit its reach, and give it an owner, a compatibility commitment
      and a review against agreed criteria for keeping it, moving it into core if other customers need it, or retiring
      it. That governance is what stops it drifting into a fork by another name.

  # ---------------------------------------------------------------- role.economics
  - id: D1-016
    version: 1
    type: single
    subtopic: role.economics
    tags: [discovery.environment, delivery.scoping]
    difficulty: 2
    level: analyze
    time_s: 100
    stem: |
      An AI vendor is bidding to automate a bank's document processing. The vendor has not seen the documents or the
      source systems, and data quality is unknown. The bank asks for one fixed price for the full rollout. Which
      commercial structure best balances the risks?
    options:
      - text: A short paid pilot with capped scope, then a fixed or outcome-based price once data quality is known
        correct: true
        why: Prices the unknown only after it has been measured, and shares the discovery risk instead of burying it in the quote.
      - text: One fixed price for the full rollout, with a contingency buffer sized for the unknowns
        why: Puts all overrun risk on the vendor for facts nobody has seen, and a buffer big enough to be safe prices the bid out.
        misconception: Contingency can price any amount of uncertainty
      - text: A per-document price for the whole rollout agreed now, with accuracy service levels the vendor must meet
        why: Looks like an outcome link, but the per-document price and accuracy promise both depend on document quality and variety that nobody has seen yet.
        misconception: Unit pricing removes the need to know the inputs
      - text: Time and materials for the whole programme at a rate card, with a non-binding estimate
        why: Moves all uncertainty to the bank, which asked for cost certainty and will usually refuse an open-ended commitment.
        misconception: Time and materials is the only honest model under uncertainty
    explanation: |
      Pricing models allocate risk: fixed price puts delivery overrun on the vendor, time and materials puts it on the
      customer, outcome-based puts adoption and performance risk on the vendor. When the unknowns are large, buy
      information first with a bounded engagement and price the rest afterwards.

  - id: D1-017
    version: 1
    type: single
    subtopic: role.economics
    tags: [obs.cost]
    difficulty: 1
    level: apply
    time_s: 75
    stem: |
      A vendor pitches an AI document-processing service to a customer whose accounts-payable team handles invoices
      manually. Which basis gives the most defensible return-on-investment claim?
    options:
      - text: Today's fully loaded cost per invoice, including rework and exceptions, against the new run cost with exceptions still handled by people
        correct: true
        why: Compares like with like against the real baseline, and includes the human work that remains.
      - text: Minutes saved per invoice in the pilot, times annual volume, times the loaded hourly rate, presented as the annual saving
        why: Saved minutes are not saved money unless capacity is removed or redeployed, and the figure ignores the run cost and the exceptions that still need people.
        misconception: Time saved equals money saved
      - text: Clerk salaries multiplied by the share of invoices the AI handles, to show how much headcount could be removed from the team over the first year
        why: Ignores exceptions, rework and management overhead, and frames the case as layoffs, which invites resistance.
        misconception: ROI equals headcount reduction
      - text: The system's benefits against its total spend, treating the current process as free since the staff are already employed
        why: The current process has a real cost. Treating it as zero removes the baseline from the claim.
        misconception: Sunk labour is not a cost to compare against
    explanation: |
      ROI is judged against the customer's real baseline: what the current process costs, including exceptions, rework
      and errors, versus the new total cost of operation including the work humans still do.

  - id: D1-018
    version: 2
    type: multi
    subtopic: role.economics
    tags: [obs.cost]
    difficulty: 3
    level: evaluate
    time_s: 110
    stem: |
      A customer is deciding whether to build an internal document-extraction capability, buy a vendor product, or
      partner with an FDE-led vendor team. Which belong in a fair total-cost-of-ownership comparison?
    options:
      - text: Ongoing evaluation, monitoring and prompt or model maintenance labour after launch
        correct: true
        why: A recurring cost for the life of the capability, since quality drifts and models change, and how much of it the customer carries differs by option.
      - text: Integration and change-management effort on the customer side, beyond the vendor's fee
        correct: true
        why: Real cost to the customer, and it differs by option.
      - text: The cost and effort of switching away later, such as data export and re-implementation
        correct: true
        why: Lock-in is a cost that varies sharply between build, buy and partner.
      - text: Money already spent on the exploratory pilot, charged evenly across the three options
        why: Sunk costs are the same whichever option is picked and should not affect the comparison.
        misconception: Past spending belongs in the forward decision
      - text: Year-one licence or build price only, because later years depend on usage that cannot be forecast
        why: Uncertain is not zero. A comparison over the capability's life has to estimate later-year run and staffing costs, which is where the options differ most.
        misconception: Costs that are hard to forecast can be left out
      - text: The revenue uplift expected from faster document turnaround, with the same uplift counted for each option
        why: Benefits belong in the ROI case. A cost comparison counts costs, and a benefit identical across options cannot change the ranking.
        misconception: TCO and ROI are the same calculation
    explanation: |
      TCO covers the whole life of the capability: run costs, people, integration, change and exit. Sunk costs, a
      first-year-only view and benefits counted as if they were costs all distort a build, buy or partner decision.

  - id: D1-019
    version: 2
    type: single
    subtopic: role.economics
    tags: [delivery.scoping, role.productization]
    difficulty: 3
    level: evaluate
    time_s: 100
    stem: |
      A vendor prices its claims-intake assistant at a fixed fee for each claim the assistant processes end to end
      with no human touch. The customer's operations team controls how claims are routed to the assistant and can
      reclassify what counts as touched. Both sides worry about disputes over the monthly invoice. Which contract term
      does most to make the outcome-based price workable?
    options:
      - text: A written definition of a countable claim, measured from logs both sides can inspect, with routing rules fixed in the contract
        correct: true
        why: Outcome pricing only works when the outcome is defined and measured in a way neither side can move alone. This removes the main source of disputes.
      - text: A minimum monthly fee that covers the vendor's running costs, with the per-claim fee charged on top of it
        why: Protects the vendor's cost base, which is sensible, but does nothing about who decides what counts. The disputes arise on the variable part.
        misconception: Fixing the downside solves the measurement problem
      - text: A monthly payment cap on the per-claim fees, so that the customer's budget exposure stays predictable
        why: Protects the customer's budget and may be reasonable, but leaves the definition of a countable claim open to argument below the cap.
        misconception: Budget certainty resolves disputes about the metric
      - text: A quarterly true-up against the customer's finance records of the savings from fewer claims handled by hand
        why: Savings attribution is itself contestable, since other changes move cost too. It replaces one disputed number with another that neither side controls.
        misconception: Financial outcomes are a more objective basis than operational counts
    explanation: |
      Outcome-based pricing moves performance risk to the vendor, so the vendor needs the outcome to be defined,
      measurable and not controllable by the customer alone. A floor or a cap shifts risk but does not settle what
      counts; a shared definition, measured from evidence both sides can inspect, does.

  # ---------------------------------------------------------------- numeric
  - id: D1-020
    version: 2
    type: numeric
    subtopic: role.economics
    tags: [obs.cost]
    competencies: [x.estimation]
    difficulty: 2
    level: apply
    time_s: 150
    stem: |
      An insurer's claims-intake team processes 40,000 claims per month. The current fully loaded cost is $4.20 per
      claim. With an AI pipeline, every claim incurs $0.55 of model and infrastructure cost, and 18% of claims are
      exceptions that an adjuster still handles at $6.00 each (on top of the pipeline cost). What are the monthly net
      savings against the current process, in US dollars?
    answer: {value: 102800, tolerance: 0.01, tolerance_type: rel, unit: "USD"}
    work: |
      Current cost: 40,000 × 4.20 = $168,000.\
      New cost: pipeline 40,000 × 0.55 = $22,000; exceptions 0.18 × 40,000 = 7,200 claims × 6.00 = $43,200.\
      Total $65,200. Savings = 168,000 − 65,200 = $102,800.
    explanation: |
      Compare against the real baseline and include the human work that remains. Common errors: forgetting the exception
      handling cost (gives $146,000), or treating the pipeline cost as applying only to the 82% handled automatically
      (gives $106,760), when in fact the pipeline processes every claim.

  - id: D1-021
    version: 2
    type: numeric
    subtopic: role.economics
    tags: [obs.cost, delivery.scoping]
    competencies: [x.estimation]
    difficulty: 3
    level: analyze
    time_s: 170
    stem: |
      A vendor offers outcome-based pricing for a support assistant: $2.50 per ticket the assistant resolves. The
      assistant resolves 70% of tickets it receives. Inference costs $0.40 for every ticket received (resolved or not),
      and the FDE team costs a fixed $90,000 per month. At how many tickets received per month does the vendor
      break even? Round to the nearest thousand.
    answer: {value: 67000, tolerance: 500, tolerance_type: abs, unit: "tickets/month"}
    work: |
      Contribution per ticket received = 0.70 × 2.50 − 0.40 = 1.75 − 0.40 = $1.35.\
      Break-even volume = 90,000 / 1.35 = 66,667 → about 67,000 tickets per month.
    explanation: |
      Under outcome-based pricing the vendor carries volume and resolution-rate risk. Ignoring the resolution rate gives
      about 43,000 (90,000 / 2.10); ignoring inference cost gives about 51,000 (90,000 / 1.75); charging inference only
      on resolved tickets gives about 61,000 (90,000 / 1.47). All understate the volume needed. At a 70% resolution
      rate, any month below about 67,000 tickets loses money; a higher resolution rate would lower the break-even point.

  # ---------------------------------------------------------------- open
  - id: D1-022
    version: 2
    type: open
    subtopic: role.definition
    tags: [role.economics, role.adjacent]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 480
    stem: |
      A customer's CFO writes: "Why are we paying for forward deployed engineers? A systems integrator has quoted a
      lower day rate to build the same system, and your product is supposedly self-service. How would I know you are
      worth it, and how long will we need you?" Write the reply you would send as the vendor's lead FDE. Keep it under
      250 words.
    rubric:
      - criterion: Bottom line first, in the CFO's terms
        points: 2
        guidance: "2 if the reply opens with a clear position on value and cost and acknowledges the concern; 1 if a position is present but buried or loosely tied to cost; 0 if there is no usable position or it opens with a defensive role definition."
      - criterion: Explains what this engagement contributes and compares it fairly with the integrator's quote
        points: 3
        guidance: "3 if it explains what the FDE engagement adds beyond building the system (for example product depth, a route to product fixes, production responsibility, work on the agreed outcome) and compares it fairly with what the integrator is quoting to do; 2 if the contribution is credible but the comparison or why it matters to the CFO is weak; 1 if it only claims FDEs are better or more technical; 0 if missing or if it rests on a materially false distinction, such as integrators being unable to build or run production systems."
      - criterion: Addresses day rate versus total cost
        points: 2
        guidance: "2 if it moves from day rate to total cost, time to value or ongoing cost and concedes where the integrator may be cheaper or a better fit (recommending the integrator for part of the work, or a smaller FDE role, can earn full credit if justified); 1 if it covers only one cost or value dimension or merely asserts higher value; 0 if it ignores the cost point."
      - criterion: Proposes how value will be checked and how dependence will fall
        points: 3
        guidance: "3 if it proposes agreed outcome metrics with a baseline, a credible plan for the customer to take over or for FDE effort to fall, and a decision point if value is not shown; 2 if metrics and reduced dependence are both covered but one is vague, or one is covered well; 1 if only a vague commitment; 0 if neither. Exact dates and wording are not required."
    model_answer: |
      Fair question, and day rate alone won't answer it. Here is what the difference buys, and how you can check it.

      The integrator may well be cheaper per day, and for well-defined build work they can be a sound choice; we can
      look together at which parts of this programme fit that. What our engagement adds is what happens beyond the
      build. We work on the platform itself, with a direct route to our product team for fixes, and we answer for the
      outcome we agree with you in production, not only for delivering the system.

      "Self-service" is true for the product and less so for your environment. Data access, permissions, legacy
      systems and process change are where deployments stall, and that is the work we do.

      To make this checkable, I propose three things. First, this week we confirm the business metric this programme
      must move, with a baseline and a target. Second, you see weekly usage and outcome numbers, not activity reports.
      Third, our involvement shrinks on a plan: by the end of next quarter your team operates and changes the system,
      with us on escalation. If the metric has not moved by day 60, we decide together whether this model, a smaller
      FDE role or the integrator is the better use of your money.
    max_chars: 2000

  # ---------------------------------------------------------------- audio
  - id: D1-023
    version: 2
    type: audio
    subtopic: role.productization
    tags: [role.economics]
    competencies: [x.written-comms]
    difficulty: 2
    level: evaluate
    time_s: 150
    prep_s: 30
    max_s: 120
    stem: |
      A founder says: "We want to deploy engineers to customers, but we also want software margins. Can we have
      both?" Give your answer out loud, in about two minutes, including how they would know whether it is working.
    rubric:
      - criterion: Clear position up front
        points: 2
        guidance: "2 if a direct answer is given in the first sentences (for example: possible over time, under conditions); 1 if a position appears late; 0 if none."
      - criterion: Explains the mechanism that moves margin
        points: 3
        guidance: "3 if it explains how delivery effort per customer falls relative to what customers pay, through reusable assets, configuration over customisation and field learning feeding the product (equivalent mechanisms, such as pricing deployment work separately, earn credit if explained); 2 if it names reuse without the mechanism; 1 if vague; 0 if absent."
      - criterion: Names a metric or signal to track
        points: 2
        guidance: "2 if it gives a concrete measure such as hours to production per deployment, share of customer-specific code, or delivery cost as a share of revenue; 1 if vague; 0 if none."
      - criterion: Acknowledges the trade-off honestly
        points: 2
        guidance: "2 if it gives a concrete, conditional account of the trade-off (for example: heavy deployment effort can hold margins down while the product matures, so it is a deliberate investment that needs a check on whether it is paying off); 1 if a relevant but incomplete caution; 0 if it promises both immediately or guarantees either outcome."
    model_answer: |
      Yes, but probably not on day one, and only if you manage it deliberately. While each deployment takes weeks of
      engineering, delivery cost can pull gross margin toward services levels. That can be a sensible choice: you are
      paying for access to hard problems and for what you learn from them.

      Pricing and hosting costs matter too, but the lever this model adds is effort per customer, and it has to fall
      over time. That does not happen by scaling alone. It happens when what your engineers build is separated into
      the core product and per-customer configuration, when connectors, evaluation sets and known failure patterns
      are reused, and when repeated requests are fed back to the product team and turned into features.

      I would track hours to reach production per new deployment, and the share of each deployment that is
      customer-specific code versus configuration. If those aren't falling quarter on quarter, treat it as a warning
      that you are scaling a services business, and find out what keeps being rebuilt.

      So: have both, but sequence them. Expect lower margins while you invest, instrument the trend, and give product
      a clear route to absorb what the field learns.
