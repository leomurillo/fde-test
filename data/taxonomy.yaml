        jd: [jd.deployment, jd.preferred]
      - id: D10.2
        tag: deploy.delivery
        name: CI/CD and infrastructure as code
        share: 30
        concepts:
          - Pipelines, environment parity, IaC (e.g. Terraform) and drift
          - Canary, blue / green, feature flags, rollback
        jd: [jd.deployment, jd.preferred]
