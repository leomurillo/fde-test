  - id: D11
    slug: operations
    name: Observability, Reliability & Cost
    weight: 7
    rationale: >-
      A full JD bullet (traces, token use, latency, cost) plus "troubleshooting
      across layers"; Richard Xu ch13-14. Runaway cost and flaky behaviour in
      production are classic FDE scenario questions.
    sources:
      richardxu: [ch13, ch14]
      goday: [ch8, ch10]
      external: [otel-genai]
    subtopics:
      - id: D11.1
        tag: obs.tracing
        name: Tracing and telemetry for AI systems
        share: 30
        concepts:
          - Traces and spans across model and tool calls; structured logs; metrics
          - OpenTelemetry and its GenAI semantic conventions; correlation IDs
          - Replaying a run; logging prompts and outputs without leaking PII
        jd: [jd.observability, jd.preferred]
      - id: D11.2
        tag: obs.troubleshooting
        name: Troubleshooting across layers
        share: 25
        concepts:
          - Isolate the layer — network, auth, data, retrieval, prompt, model, tool
          - Why prod differs from staging (data, permissions, config, model version)
          - Reproducing non-deterministic failures; classifying failures
        jd: [jd.troubleshooting, jd.observability]
      - id: D11.3
        tag: obs.cost
        name: Cost control
        share: 25
        concepts:
          - Token accounting and cost attribution per run, tenant and feature
          - Prompt caching, routing / cascades, batching, output-length control
          - Budgets and spend circuit breakers
        jd: [jd.observability]
      - id: D11.4
        tag: obs.slo
        name: SLOs and incident response
        share: 20
        concepts:
          - Separate SLOs for availability, latency and quality; error budgets
          - Alerting, on-call, runbooks, post-incident review
        jd: [jd.observability]

