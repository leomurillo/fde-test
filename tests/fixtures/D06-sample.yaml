  - id: D6-906
    version: 1
    type: sql
    subtopic: agents.patterns
    tags: [obs.cost]
    competencies: [x.sql]
    difficulty: 2
    level: apply
    time_s: 420
    stem: |
      Table `calls(run_id, step, model, input_tokens, output_tokens)`. Return each `run_id` with its total tokens
      (input + output) as `total_tokens`, for runs above 1,000 total tokens.
    sql:
      setup: |
        CREATE TABLE calls(run_id TEXT, step INT, model TEXT, input_tokens INT, output_tokens INT);
        INSERT INTO calls VALUES ('r1',1,'small',400,50),('r1',2,'large',600,120),('r2',1,'small',300,40),('r3',1,'large',900,200);
      reference: |
        SELECT run_id, SUM(input_tokens + output_tokens) AS total_tokens
        FROM calls GROUP BY run_id HAVING SUM(input_tokens + output_tokens) > 1000
      order_matters: false
      float_round: 2
    explanation: Aggregate per run, then filter groups with HAVING (not WHERE).

  - id: D6-907
    version: 1
    type: code
    subtopic: agents.state
    tags: [int.resilience]
    competencies: [x.python]
    difficulty: 2
    level: apply
    time_s: 600
    stem: |
      Implement `backoff_delays(attempts, base, cap)` returning the delay before each retry: `base * 2**i`,
      capped at `cap`, for `i` in `0..attempts-1`. Return an empty list for `attempts <= 0`.
    code:
      function: backoff_delays
      starter: |
        def backoff_delays(attempts: int, base: float, cap: float) -> list[float]:
            ...
      reference: |
        def backoff_delays(attempts, base, cap):
            return [min(cap, base * 2 ** i) for i in range(max(0, attempts))]
      examples:
        - args: [3, 0.5, 4.0]
          expected: [0.5, 1.0, 2.0]
      tests:
        - args: [0, 1.0, 1.0]
          expected: []
        - args: [-2, 1.0, 1.0]
          expected: []
        - args: [5, 1.0, 5.0]
          expected: [1.0, 2.0, 4.0, 5.0, 5.0]
        - kwargs: {attempts: 2, base: 0.1, cap: 10.0}
          expected: [0.1, 0.2]
          approx: 1.0e-9
      timeout_s: 5
    explanation: Exponential backoff with a cap; production code adds jitter so clients don't retry in lockstep.
