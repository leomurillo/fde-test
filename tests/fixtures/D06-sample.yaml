domain: D6
items:
  - id: D6-901
    version: 1
    type: single
    subtopic: agents.when
    tags: [discovery.selection]
    difficulty: 2
    level: evaluate
    time_s: 75
    stem: |
      A client wants to automate invoice intake: PDFs arrive by email, fields are extracted, validated against
      the ERP, and posted. Layouts vary by vendor, but the steps and their order never change, and every
      posting must be explainable to auditors. What should the core control flow be?
    options:
      - text: A fixed workflow that calls an LLM only for field extraction, with code-based validation and posting
        correct: true
        why: The path is known and auditable; the LLM handles only the genuinely variable step (layouts).
      - text: A tool-using agent that decides per invoice which extraction, validation and posting tools to call
        why: Autonomy adds cost and unpredictability where the path never changes, and weakens auditability.
        misconception: Agents are the default architecture for any LLM-powered automation
      - text: A multi-agent design with separate extractor, validator and poster agents coordinated by a supervisor
        why: Coordination overhead and compounding errors with no benefit; nothing here needs dynamic delegation.
        misconception: Splitting responsibilities across agents improves reliability
      - text: Template-based OCR rules per vendor with no LLM, maintained by the client's finance IT team
        why: Varying layouts are exactly where per-vendor templates become a maintenance burden; an LLM step fits.
        misconception: Deterministic means no model at all
    explanation: |
      Prefer the simplest control flow that handles the variability. Here only one step (layout understanding)
      is open-ended, so it gets the model; sequencing, validation and posting stay deterministic and auditable.
    refs: [https://www.anthropic.com/engineering/building-effective-agents]

  - id: D6-902
    version: 1
    type: multi
    subtopic: agents.state
    difficulty: 2
    level: apply
    time_s: 90
    stem: |
      An agent run waits for a human approval that may take until the next morning before it can file a ticket.
      Which design choices keep this safe and cheap to resume?
    options:
      - text: Persist run state at the approval step and resume from that checkpoint
        correct: true
        why: Avoids redoing completed steps and their cost.
      - text: Give the ticket-creation call an idempotency key derived from the run and step
        correct: true
        why: A retried resume cannot create a duplicate ticket.
      - text: Keep the process alive with the full conversation in memory until approval arrives
        why: Fragile across restarts and deploys; memory is not durable state.
        misconception: Long-lived processes are an acceptable substitute for durable execution
      - text: Re-run the whole agent from the start after approval so the context is fresh
        why: Repeats work and may produce a different plan than the one that was approved.
        misconception: Fresh context is always better than resumed state
    explanation: Durable checkpoints plus idempotent side effects are the standard pair for long waits.

  - id: D6-903
    version: 1
    type: numeric
    subtopic: agents.patterns
    competencies: [x.estimation]
    difficulty: 1
    level: apply
    time_s: 90
    stem: |
      A parallel "voting" step sends the same 2,000-token prompt to a model 5 times; each call returns 300 tokens.
      Input costs $3 per million tokens and output $15 per million. What does one voting step cost, in US cents?
    answer: {value: 5.25, tolerance: 0.05, tolerance_type: abs, unit: "¢"}
    work: |
      Input 5 × 2,000 = 10,000 tokens → $0.03. Output 5 × 300 = 1,500 tokens → $0.0225. Total $0.0525 = 5.25¢.
    explanation: Voting multiplies both input and output cost by the number of samples.

